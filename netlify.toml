[build]
  functions = "netlify/functions"
  publish = "."

# ── API (main domain only) ──
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

# ==========================================
# ── PENGECUALIAN UNTUK FILE JAVASCRIPT ──
# Aturan ini harus ada di ATAS aturan fallback (index.html)
# supaya Netlify memberikan file .js aslinya, bukan file HTML.
# ==========================================
[[redirects]]
  from = "https://venue.trekkr.online/trekkr-api.js"
  to = "/venue/trekkr-api.js"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.trekkr.online/trekkr-api.js"
  to = "/admin/trekkr-api.js"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/trekkr-api.js"
  to = "/superadmin/trekkr-api.js"
  status = 200
  force = true


# ==========================================
# ── SPA FALLBACK UNTUK SUBDOMAIN ──
# Apapun alamat venue yang diketik (misal /jakarta, /bintaro),
# akan selalu diarahkan ke index.html
# ==========================================
[[redirects]]
  from = "https://venue.trekkr.online/*"
  to = "/venue/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.trekkr.online/*"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/*"
  to = "/superadmin/index.html"
  status = 200
  force = true


# ==========================================
# ── SPA FALLBACK UNTUK DOMAIN UTAMA ──
# (Jika diakses via trekkr.online/venue/jakarta)
# ==========================================
[[redirects]]
  from = "/player/*"
  to = "/player/index.html"
  status = 200

[[redirects]]
  from = "/venue/*"
  to = "/venue/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/index.html"
  status = 200