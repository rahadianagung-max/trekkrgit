[build]
  functions = "netlify/functions"
  publish = "."

# ── API routing (highest priority) ──
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

# ── Subdomain routing ──
# Without force=true, Netlify serves existing files first, then falls back to rewrite
[[redirects]]
  from = "https://venue.trekkr.online/*"
  to = "/venue/:splat"
  status = 200

[[redirects]]
  from = "https://admin.trekkr.online/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "https://superadmin.trekkr.online/*"
  to = "/superadmin/:splat"
  status = 200

# ── SPA fallbacks (main domain) ──
[[redirects]]
  from = "/player/*"
  to = "/player/index.html"
  status = 200

[[redirects]]
  from = "/venue/*"
  to = "/venue/index.html"
  status = 200
