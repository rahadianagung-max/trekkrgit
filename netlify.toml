[build]
  functions = "netlify/functions"
  publish = "."

# ══════════════════════════════════════════
# API must be handled FIRST for ALL domains
# ══════════════════════════════════════════
[[redirects]]
  from = "https://venue.trekkr.online/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.trekkr.online/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

# ══════════════════════════════════════════
# Subdomain routing (after API is handled)
# ══════════════════════════════════════════
[[redirects]]
  from = "https://venue.trekkr.online/*"
  to = "/venue/:splat"
  status = 200

[[redirects]]
  from = "https://admin.trekkr.online/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "https://superadmin.trekkr.online/*"
  to = "/superadmin/:splat"
  status = 200

# ══════════════════════════════════════════
# SPA fallbacks (main domain)
# ══════════════════════════════════════════
[[redirects]]
  from = "/player/*"
  to = "/player/index.html"
  status = 200

[[redirects]]
  from = "/venue/*"
  to = "/venue/index.html"
  status = 200
