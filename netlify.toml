# =====================================================================
# netlify.toml — Trekkr (siap pakai)
# Taruh file ini di ROOT repo, lalu commit & push. Netlify deploy ulang.
# Urutan penting: aturan spesifik di ATAS, fallback (wildcard) di BAWAH.
# =====================================================================

[build]
  functions = "netlify/functions"
  publish = "."

# ── API (domain utama) ──────────────────────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

# ── PENGECUALIAN FILE (.js / .css) UNTUK SUBDOMAIN ──────────────────
# Harus di ATAS fallback subdomain, supaya file aslinya yang dikirim
# (bukan index.html).
[[redirects]]
  from = "https://venue.trekkr.online/trekkr-api.js"
  to = "/venue/trekkr-api.js"
  status = 200
  force = true

[[redirects]]
  from = "https://venue.trekkr.online/trekkr-theme.css"
  to = "/venue/trekkr-theme.css"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.trekkr.online/trekkr-api.js"
  to = "/admin/trekkr-api.js"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/trekkr-api.js"
  to = "/superadmin/trekkr-api.js"
  status = 200
  force = true

# ── URL BERSIH DOMAIN UTAMA (halaman desain baru) ───────────────────
# Memetakan /rankings → rankings.html, dst. Query string ikut terbawa
# otomatis (mis. /register?form=abc → /register.html?form=abc).
[[redirects]]
  from = "/rankings"
  to = "/rankings.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

# ── WAVE 1 — Liga Trekkr / calendar / sessions / claim ─────
[[redirects]]
  from = "/liga-trekkr"
  to = "/liga-trekkr.html"
  status = 200

[[redirects]]
  from = "/season"
  to = "/season.html"
  status = 200

[[redirects]]
  from = "/sessions"
  to = "/sessions.html"
  status = 200

[[redirects]]
  from = "/sessions/:id"
  to = "/session.html"
  status = 200

[[redirects]]
  from = "/claim"
  to = "/claim.html"
  status = 200

# Wave 2 route stubs (coming soon)
[[redirects]]
  from = "/passport"
  to = "/passport.html"
  status = 200

[[redirects]]
  from = "/ranking"
  to = "/ranking.html"
  status = 200

[[redirects]]
  from = "/series"
  to = "/series.html"
  status = 200

# Halaman struktur baru (5 menu)
[[redirects]]
  from = "/playrank"
  to = "/playrank.html"
  status = 200

[[redirects]]
  from = "/tournament"
  to = "/tournament.html"
  status = 200

[[redirects]]
  from = "/how-trekkr-works"
  to = "/how-trekkr-works.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/market"
  to = "/market.html"
  status = 200

# Rename lama → baru (301 permanen)
[[redirects]]
  from = "/how-it-works"
  to = "/how-trekkr-works"
  status = 301

[[redirects]]
  from = "/events"
  to = "/tournament"
  status = 301

[[redirects]]
  from = "/tournaments"
  to = "/tournaments.html"
  status = 200

[[redirects]]
  from = "/tournaments/demo"
  to = "/tournament-demo.html"
  status = 200

[[redirects]]
  from = "/recap"
  to = "/recap.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/re-public"
  to = "/re-public.html"
  status = 200

[[redirects]]
  from = "/re-player"
  to = "/re-player.html"
  status = 200

[[redirects]]
  from = "/re-scorer"
  to = "/re-scorer.html"
  status = 200

[[redirects]]
  from = "/re-admin"
  to = "/re-admin.html"
  status = 200

# Opsional: direktori venue juga bisa diakses dari domain utama
[[redirects]]
  from = "/venues"
  to = "/venue/index.html"
  status = 200

# ── SPA FALLBACK UNTUK SUBDOMAIN ────────────────────────────────────
[[redirects]]
  from = "https://venue.trekkr.online/*"
  to = "/venue/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.trekkr.online/*"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/*"
  to = "/superadmin/index.html"
  status = 200
  force = true

# ── FALLBACK PATH DOMAIN UTAMA ──────────────────────────────────────
# /player/{nama} → passport; /venue, /admin, /superadmin via path.
[[redirects]]
  from = "/player/*"
  to = "/player/index.html"
  status = 200

[[redirects]]
  from = "/venue/*"
  to = "/venue/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/index.html"
  status = 200
