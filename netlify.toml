[build]
  functions = "netlify/functions"
  publish = "."

# ── API (main domain only) ──
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200
  force = true

# ==========================================
# ── PENGECUALIAN FILE (.js / .css) UNTUK SUBDOMAIN ──
# Harus di ATAS aturan fallback (index.html) supaya Netlify
# memberikan file aslinya, bukan index.html.
# ==========================================
[[redirects]]
  from = "https://venue.trekkr.online/trekkr-api.js"
  to = "/venue/trekkr-api.js"
  status = 200
  force = true

[[redirects]]
  from = "https://venue.trekkr.online/trekkr-theme.css"
  to = "/venue/trekkr-theme.css"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.trekkr.online/trekkr-api.js"
  to = "/admin/trekkr-api.js"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/trekkr-api.js"
  to = "/superadmin/trekkr-api.js"
  status = 200
  force = true

# ==========================================
# ── URL BERSIH DOMAIN UTAMA (halaman desain baru) ──
# Memetakan /rankings → rankings.html, dst. Harus di ATAS
# fallback /player, /venue agar tidak tertelan.
# ==========================================
[[redirects]]
  from = "/rankings"
  to = "/rankings.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/tournaments"
  to = "/tournaments.html"
  status = 200

[[redirects]]
  from = "/tournaments/demo"
  to = "/tournament-demo.html"
  status = 200

# ==========================================
# ── SPA FALLBACK UNTUK SUBDOMAIN ──
# ==========================================
[[redirects]]
  from = "https://venue.trekkr.online/*"
  to = "/venue/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.trekkr.online/*"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/*"
  to = "/superadmin/index.html"
  status = 200
  force = true

# ==========================================
# ── FALLBACK PATH DOMAIN UTAMA ──
# ==========================================
[[redirects]]
  from = "/player/*"
  to = "/player/index.html"
  status = 200

[[redirects]]
  from = "/venue/*"
  to = "/venue/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/index.html"
  status = 200
