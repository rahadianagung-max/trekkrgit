[build]
  publish = "."

# ── 1. Subdomain routing (Paling spesifik) ──
[[redirects]]
  from = "https://admin.trekkr.online/*"
  to = "/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://superadmin.trekkr.online/*"
  to = "/superadmin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://venue.trekkr.online/*"
  to = "/venue/:splat"
  status = 200
  force = true

# ── 2. API routing ──
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sheet/:splat"
  status = 200

# ── 3. Clean URL routing (Untuk masing-masing folder) ──
[[redirects]]
  from = "/player/*"
  to = "/player/index.html"
  status = 200

[[redirects]]
  from = "/venue/*"
  to = "/venue/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/index.html"
  status = 200

# ── 4. Catch-all routing (Paling umum, WAJIB paling bawah) ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200