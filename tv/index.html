<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlayRank TV · Trekkr</title>
<meta name="description" content="PlayRank on the big screen — live courts, full standings, and the champions podium.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Dark TV screen — tokens from live/index.html (dark theme). */
  :root{
    --ground:#0E0C0A; --card:#1A1712; --card2:#211D17; --line:#2C271F; --line2:#241F19;
    --ink:#F4EFE6; --mute:#A79E8E; --dim:#786F60;
    --orange:#FF7D24; --orange-ink:#FFB27A;
    --cyan:#3AD0DD; --cyan-ink:#8FE7EF;
    --grn:#3CCB7F; --red:#FF6A5E; --gold:#E0B84A;
    --pill:#241F18; --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 44px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(120% 90% at 84% -12%,color-mix(in srgb,var(--orange) 13%,transparent),transparent 58%),
      radial-gradient(90% 80% at -4% 112%,color-mix(in srgb,var(--cyan) 11%,transparent),transparent 55%),var(--ground);
    color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    container-type:inline-size;display:flex;flex-direction:column;min-height:100%}
  .mono{font-family:'Space Mono',monospace}
  img{display:block;max-width:100%}

  /* ---- header ---- */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:1.4cqw 2.1cqw;border-bottom:1px solid var(--line)}
  .brand{font-family:'Saira Condensed';font-style:italic;font-weight:800;text-transform:uppercase;font-size:3.1cqw;line-height:.9;letter-spacing:.5px}
  .brand .rk{background:linear-gradient(90deg,var(--orange),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .venue{font-family:'Saira Condensed';font-style:italic;font-weight:700;text-transform:uppercase;font-size:1.45cqw;color:var(--mute);margin-top:.15cqw}
  .hmeta{display:flex;align-items:center;gap:.9cqw;flex-wrap:wrap;justify-content:flex-end}
  .live-dot{display:inline-flex;align-items:center;gap:.6cqw;font-size:1.35cqw;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--grn)}
  .live-dot i{width:1.05cqw;height:1.05cqw;border-radius:50%;background:var(--grn);box-shadow:0 0 0 0 color-mix(in srgb,var(--grn) 60%,transparent);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--grn) 55%,transparent)}70%{box-shadow:0 0 0 1.1cqw transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media(prefers-reduced-motion:reduce){.live-dot i{animation:none}}
  .chip{font-size:1.25cqw;font-weight:800;background:var(--pill);color:var(--mute);border-radius:999px;padding:.5cqw 1.1cqw}
  .chip.cy{color:var(--cyan-ink)}

  /* ---- body split ---- */
  .body{flex:1;min-height:0;display:grid;grid-template-columns:1.68fr 1fr;gap:1.4cqw;padding:1.4cqw 1.8cqw}
  .col{min-height:0;display:flex;flex-direction:column}
  .slab{display:flex;align-items:center;gap:.8cqw;margin:0 .2cqw 1cqw}
  .slab h2{font-family:'Saira Condensed';font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:1.6cqw;margin:0}
  .slab .rule{flex:1;height:1px;background:var(--line)}
  .slab .n{font-size:1.2cqw;color:var(--dim);font-weight:800}

  /* photo avatar (real photo via <img>, initials fallback) */
  .ph{border-radius:50%;overflow:hidden;flex:none;background:var(--line2);display:flex;align-items:center;justify-content:center;
    font-family:'Saira Condensed';font-style:italic;font-weight:800;color:var(--dim);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .ph img{width:100%;height:100%;object-fit:cover}

  /* court schedule cards */
  .courts{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1cqw;flex:1;min-height:0}
  .courts.one{grid-template-columns:1fr}
  .court{background:var(--card);border:1px solid var(--line);border-radius:1cqw;box-shadow:var(--shadow);
    padding:1cqw 1.2cqw;display:flex;flex-direction:column;justify-content:center;gap:.5cqw}
  .court .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2cqw}
  .ct{font:800 1.25cqw/1 'Plus Jakarta Sans';letter-spacing:.08em;text-transform:uppercase;color:var(--cyan-ink);
    background:color-mix(in srgb,var(--cyan) 15%,transparent);padding:.5cqw 1cqw;border-radius:.6cqw}
  .fmt{font-size:1.1cqw;color:var(--dim);font-weight:800}
  .trow{display:grid;grid-template-columns:auto 1fr;gap:.9cqw;align-items:center;padding:.35cqw 0}
  .avs{display:flex}.avs .ph{width:2.9cqw;height:2.9cqw;font-size:1.2cqw}.avs .ph+.ph{margin-left:-.8cqw}
  .tname{font-weight:800;font-size:1.8cqw;letter-spacing:-.2px;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vs{display:flex;align-items:center;gap:.7cqw;margin:.1cqw 0}
  .vs .l{flex:1;height:1px;background:var(--line)}
  .vs .v{font-family:'Saira Condensed';font-style:italic;font-weight:800;color:var(--dim);font-size:1.2cqw;letter-spacing:1px}
  .byebar{margin-top:1cqw;background:var(--card2);border:1px dashed var(--line);border-radius:.8cqw;padding:.7cqw 1.1cqw;font-size:1.2cqw;color:var(--mute);display:flex;align-items:center;gap:.7cqw;flex-wrap:wrap}
  .byebar b{color:var(--ink)}
  .byeavs{display:flex}.byeavs .ph{width:2cqw;height:2cqw;font-size:.9cqw}.byeavs .ph+.ph{margin-left:-.6cqw}

  /* standings board */
  .board{background:var(--card);border:1px solid var(--line);border-radius:1cqw;box-shadow:var(--shadow);overflow:hidden;flex:1;min-height:0}
  .bhead,.brow{display:grid;grid-template-columns:2.4cqw 3cqw 1fr auto;gap:.8cqw;align-items:center;padding:.62cqw 1.1cqw}
  .bhead{border-bottom:1px solid var(--line);background:var(--card2)}
  .bhead .hn{font-size:1cqw;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .bhead .stat span{font-size:1cqw;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);min-width:1.9cqw;text-align:right;display:inline-block}
  .brow{border-bottom:1px solid var(--line2)}
  .brow:last-child{border-bottom:0}
  .brow.lead{background:color-mix(in srgb,var(--gold) 8%,transparent)}
  .rk{font-family:'Space Mono';font-weight:700;color:var(--dim);font-size:1.35cqw;text-align:center}
  .rk.p1{color:var(--gold)} .rk.p2{color:#c9c9cf} .rk.p3{color:#d08a4e}
  .brow .ph{width:2.9cqw;height:2.9cqw;font-size:1.15cqw}
  .bn{font-weight:800;font-size:1.5cqw;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bn .streak{font-family:'Space Mono';font-size:1.05cqw;font-weight:700;color:var(--orange-ink)}
  .stat{display:inline-flex;gap:1.2cqw;align-items:baseline;font-family:'Space Mono';font-weight:700}
  .stat b{font-size:1.45cqw;min-width:1.9cqw;text-align:right;display:inline-block;color:var(--ink)}
  .stat .pd,.stat .dl{font-size:1.2cqw}
  .stat .up{color:var(--grn)} .stat .dn{color:var(--red)}
  .rulenote{margin-top:.9cqw;font-size:1.1cqw;color:var(--mute);line-height:1.45;background:var(--card2);
    border:1px solid var(--line);border-left:.3cqw solid var(--cyan);border-radius:.6cqw;padding:.7cqw 1cqw}
  .rulenote b{color:var(--cyan-ink)}

  /* FINAL podium */
  .podwrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.2cqw}
  .champline{text-align:center;font-family:'Saira Condensed';font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:2cqw;color:var(--gold)}
  .podium{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:1.1cqw;align-items:end}
  .pod{background:var(--card);border:1px solid var(--line);border-radius:1.1cqw;box-shadow:var(--shadow);padding:1.2cqw 1cqw 1cqw;text-align:center}
  .pod.first{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent),0 18px 46px rgba(0,0,0,.55)}
  .medal{font-size:2.4cqw;line-height:1}
  .pod .ph{margin:.5cqw auto .4cqw;width:6.4cqw;height:6.4cqw;font-size:2.6cqw}
  .pod.first .ph{width:8.2cqw;height:8.2cqw;font-size:3.3cqw;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 .4cqw color-mix(in srgb,var(--gold) 35%,transparent)}
  .pod .pn{font-weight:800;font-size:1.9cqw;margin-top:.3cqw;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pod .rec{font-family:'Space Mono';font-size:1.25cqw;color:var(--mute);margin-top:.2cqw}
  .pod .dl2{font-family:'Space Mono';font-size:1.3cqw;font-weight:700;margin-top:.35cqw}
  .pod .base{margin-top:.8cqw;border-radius:.6cqw;font-family:'Saira Condensed';font-style:italic;font-weight:800;font-size:2cqw;color:#0d0b08;display:flex;align-items:center;justify-content:center}
  .pod.first .base{height:4.6cqw;background:linear-gradient(180deg,var(--gold),#b98e1e)}
  .pod.second .base{height:3.4cqw;background:linear-gradient(180deg,#c9c9cf,#8f8f96)}
  .pod.third .base{height:2.6cqw;background:linear-gradient(180deg,#d08a4e,#9c5f2f)}

  /* states */
  .state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px}
  .state .big{font-family:'Saira Condensed';font-style:italic;font-weight:800;text-transform:uppercase;font-size:5cqw;color:var(--mute)}
  .state p{color:var(--dim);font-size:1.6cqw;max-width:28ch}
  .spin{width:2.2cqw;height:2.2cqw;border:.3cqw solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}

  /* If someone opens this on a phone, keep it usable (stack). */
  @media(max-width:820px){
    body{container-type:normal}
    .hdr{padding:14px 16px}.brand{font-size:26px}.venue{font-size:12px}
    .live-dot,.chip{font-size:12px}.live-dot i{width:9px;height:9px}
    .body{grid-template-columns:1fr;gap:14px;padding:14px}
    .slab h2{font-size:15px}.slab .n{font-size:11px}
    .courts{grid-template-columns:1fr}
    .ct{font-size:11px}.fmt{font-size:11px}.tname{font-size:16px}.avs .ph{width:32px;height:32px}
    .bhead,.brow{grid-template-columns:24px 32px 1fr auto}.rk{font-size:13px}.brow .ph{width:32px;height:32px}
    .bn{font-size:14px}.stat b{font-size:14px;min-width:22px}.stat .pd,.stat .dl{font-size:12px}
    .bhead .stat span{min-width:22px;font-size:10px}
    .rulenote{font-size:12px}.champline{font-size:20px}.pod .ph{width:64px;height:64px}.pod.first .ph{width:80px;height:80px}
    .pod .pn{font-size:16px}.pod .rec{font-size:12px}.medal{font-size:24px}
  }
</style>
</head>
<body>
  <div id="app"></div>

<script>
var API_BASE=(location.hostname==='trekkr.online'||location.hostname.endsWith('.vercel.app'))?'/api':'https://trekkr.online/api';
function getCode(){
  var q=new URLSearchParams(location.search).get('code'); if(q) return q.trim().toLowerCase();
  var seg=location.pathname.replace(/\/+$/,'').split('/').filter(Boolean); var last=seg[seg.length-1]||'';
  if(last && last.toLowerCase()!=='tv') return last.trim().toLowerCase(); return '';
}
var CODE=getCode();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function firstName(n){return String(n||'').split(' ')[0];}
function fullName(p){return esc(p.displayName||p.name||p.short||'');}
function initials(n){return (String(n||'').trim().split(/\s+/).map(function(w){return w[0]||'';}).slice(0,2).join('').replace(/[^A-Za-z0-9]/g,'')||'?').toUpperCase();}
window.__lavFallback=function(img,ini){
  var s=img.getAttribute('src')||'';
  if(!img.dataset.alt && s.indexOf('i.ibb.co')>-1){img.dataset.alt='1';
    img.src=s.indexOf('i.ibb.co.com')>-1?s.replace('i.ibb.co.com/','i.ibb.co/'):s.replace('i.ibb.co/','i.ibb.co.com/');return;}
  var d=img.parentNode; if(d){img.remove(); d.textContent=ini;}
};
function avatar(p){
  var ini=initials(p.displayName||p.name||p.short); var u=p.photoUrl||'';
  if(u) return '<div class="ph"><img src="'+esc(u)+'" alt="" loading="lazy" onerror="__lavFallback(this,\''+ini+'\')"></div>';
  return '<div class="ph">'+ini+'</div>';
}
function genderLabel(g){g=String(g||'').toUpperCase();return g==='F'?"Women's":g==='M'?"Men's":'';}
function pdTxt(v){v=Number(v)||0;return (v>=0?'+':'')+v;}

var STATE=null, BY={}, POLL=null;
function indexPlayers(ps){BY={};(ps||[]).forEach(function(p){BY[p.name]=p;if(p.short)BY[p.short]=p;});}
function look(k){return BY[k]||{name:k,elo:1350,w:0,l:0,pd:0,streak:0};}
// Rule #1: most wins → tie: point difference → tie: ELO.
function sortStandings(ps){return (ps||[]).slice().sort(function(a,b){return (b.w-a.w)||(b.pd-a.pd)||(b.elo-a.elo);});}
var RULES='<div class="rulenote"><b>Ranking</b> = most wins → if tied, higher point difference (PD). PD = points won − points lost.</div>';

function teamRow(names){
  var team=(names||[]).map(look);
  return '<div class="trow"><span class="avs">'+team.map(avatar).join('')+'</span>'+
    '<div class="tname">'+team.map(function(p){return esc(firstName(p.name));}).join(' & ')+'</div></div>';
}
function courtCard(m,fmt){
  if(!m.a||!m.b||m.a.length<2||m.b.length<2) return '';
  return '<div class="court"><div class="top"><span class="ct">Court '+esc(m.court||'')+'</span><span class="fmt">'+esc(fmt)+'</span></div>'+
    teamRow(m.a)+'<div class="vs"><span class="l"></span><span class="v">VS</span><span class="l"></span></div>'+teamRow(m.b)+'</div>';
}
function boardHead(final){
  return '<div class="bhead"><span></span><span></span><span class="hn">Player</span>'+
    '<span class="stat"><span>W</span><span>L</span><span>PD</span>'+(final?'<span>ELO</span>':'')+'</span></div>';
}
function boardRow(p,i,final){
  var rkc=i===0?'p1':i===1?'p2':i===2?'p3':'';
  var w=p.w||0,l=p.l||0,pd=p.pd||0,dl=(p.elo||0)-(p.start||p.elo||0);
  var stat='<span class="stat"><b>'+w+'</b><b>'+l+'</b><b class="pd '+(pd>=0?'up':'dn')+'">'+pdTxt(pd)+'</b>'+
    (final?'<b class="dl '+(dl>=0?'up':'dn')+'">'+pdTxt(dl)+'</b>':'')+'</span>';
  var streak=(p.streak||0)>=2?' <span class="streak">'+p.streak+'W🔥</span>':'';
  return '<div class="brow'+(i===0?' lead':'')+'"><span class="rk '+rkc+'">'+(i+1)+'</span>'+
    avatar(p)+'<div class="bn">'+fullName(p)+streak+'</div>'+stat+'</div>';
}
function podCard(p,place){
  var cls=place===1?'first':place===2?'second':'third',medal=place===1?'🥇':place===2?'🥈':'🥉';
  var dl=(p.elo||0)-(p.start||p.elo||0);
  return '<div class="pod '+cls+'"><div class="medal">'+medal+'</div>'+avatar(p)+
    '<div class="pn">'+fullName(p)+'</div>'+
    '<div class="rec">'+(p.w||0)+'W · '+(p.l||0)+'L · PD '+pdTxt(p.pd||0)+'</div>'+
    '<div class="dl2" style="color:'+(dl>=0?'var(--grn)':'var(--red)')+'">'+pdTxt(dl)+' ELO</div>'+
    '<div class="base">'+place+'</div></div>';
}

function header(d,mode,metaHtml){
  return '<div class="hdr"><div><div class="brand">PLAY<span class="rk">RANK</span> '+mode+'</div>'+
    '<div class="venue">'+esc(d.venue||'Trekkr PlayRank')+'</div></div><div class="hmeta">'+metaHtml+'</div></div>';
}
function render(d){
  var app=document.getElementById('app');
  var final=(STATE&&STATE.status==='final');
  var ps=sortStandings(d.players);
  if(final){
    var top=ps.slice(0,3);
    var champ=top.length?'<div class="champline">🎉 '+esc(firstName((top[0].displayName||top[0].name)))+' wins the night</div>':'';
    var podium=top.length? '<div class="podium">'+(top[1]?podCard(top[1],2):'<div></div>')+(top[0]?podCard(top[0],1):'')+(top[2]?podCard(top[2],3):'<div></div>')+'</div>':'';
    app.innerHTML=header(d,'RESULTS','<span class="chip cy">Final</span><span class="chip">'+esc(genderLabel(d.gender))+(d.round?' · '+d.round+' rounds':'')+'</span>')+
      '<div class="body"><div class="col"><div class="slab"><h2>Champions</h2><span class="rule"></span><span class="n">Trekkr PlayRank</span></div>'+
        '<div class="podwrap">'+champ+podium+'</div></div>'+
      '<div class="col"><div class="slab"><h2>Final standings</h2><span class="rule"></span><span class="n">W · L · PD · ELO</span></div>'+
        '<div class="board">'+boardHead(true)+ps.map(function(p,i){return boardRow(p,i,true);}).join('')+'</div>'+RULES+'</div></div>';
    return;
  }
  var now=d.now||[]; var fmt=d.scoreTarget?('Race to '+d.scoreTarget+' · live'):'Live';
  var one=now.length<=1?' one':'';
  var courts=now.length?now.map(function(m){return courtCard(m,fmt);}).join(''):'<div class="byebar">Waiting for the next round to start…</div>';
  var bye=(d.bye||[]).map(look);
  var byebar=bye.length?'<div class="byebar">⏸ Resting this round: <span class="byeavs">'+bye.map(avatar).join('')+'</span> <b>'+bye.map(function(p){return esc(firstName(p.name));}).join(', ')+'</b></div>':'';
  app.innerHTML=header(d,'LIVE','<span class="live-dot"><i></i>Live</span><span class="chip">'+esc(genderLabel(d.gender))+'</span>'+(d.round?'<span class="chip cy">Round '+esc(d.round)+'</span>':''))+
    '<div class="body"><div class="col"><div class="slab"><h2>On court now</h2><span class="rule"></span><span class="n">'+(now.length?(now.length+(now.length===1?' match':' matches')):'—')+'</span></div>'+
      '<div class="courts'+one+'">'+courts+'</div>'+byebar+'</div>'+
    '<div class="col"><div class="slab"><h2>Standings</h2><span class="rule"></span><span class="n">All players</span></div>'+
      '<div class="board">'+boardHead(false)+ps.map(function(p,i){return boardRow(p,i,false);}).join('')+'</div>'+RULES+'</div></div>';
}
function showState(big,msg){
  document.getElementById('app').innerHTML='<div class="state"><div class="'+(big==='…'?'spin':'big')+'">'+(big==='…'?'':esc(big))+'</div>'+(msg?'<p>'+esc(msg)+'</p>':'')+'</div>';
}
function fetchState(first){
  return fetch(API_BASE+'/live?code='+encodeURIComponent(CODE),{headers:{'Accept':'application/json'}})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(d){ STATE=d; indexPlayers(d.players); render(d); if(d.status==='final') stopPoll(); })
    .catch(function(e){ if(first) showState('Live not found','This TV link may have expired or the code is wrong. Ask the host for a fresh link.'); });
}
function startPoll(){ stopPoll(); POLL=setInterval(function(){ if(!document.hidden) fetchState(false); },5000); }
function stopPoll(){ if(POLL){ clearInterval(POLL); POLL=null; } }
document.addEventListener('visibilitychange',function(){ if(!document.hidden && STATE && STATE.status!=='final') fetchState(false); });

if(!CODE){ showState('No session code','Open this as /tv/<code> or /tv?code=<code>. Ask the host for the TV link.'); }
else { showState('…',''); fetchState(true).then(function(){ if(STATE && STATE.status!=='final') startPoll(); }); }
</script>
</body>
</html>
