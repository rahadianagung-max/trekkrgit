<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/styles.css"/><title>Rankings — Trekkr</title></head><body data-page="/rankings">
<div id="site-header"></div>
<div class="wrap page-hd">
  <div class="eyebrow" style="color:var(--orange);margin-bottom:12px">Live &middot; updated every session</div>

  </div>
</div>
<div class="wrap" style="padding-bottom:50px"><div class="rank-table" id="rank-table"><div class="loading">Loading rankings&hellip;</div></div></div>
<div id="site-footer"></div><script src="/site.js"></script></body></html>
