<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Player passport — Trekkr</title>
<meta name="description" content="A Trekkr player passport: ELO, tier, win rate, streak, and rating history."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="/trekkr-theme.css"/>
<style>
/* Header */
.site-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft)}

/* Passport */
.pp-head{padding:24px 0 0}
.pp-back{font-size:12px;font-weight:600;color:var(--subtle);display:inline-flex;align-items:center;gap:5px}
.pp-back:hover{color:var(--orange)}

.card{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:22px}
.pp-hero{margin-top:14px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pp-avatar{width:92px;height:92px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#FFE3CC;color:var(--orange);font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center;border:3px solid var(--orange);overflow:hidden}
.pp-id{flex:1;min-width:200px}
.pp-name{font-size:clamp(26px,5vw,38px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pp-verified{color:var(--orange);font-size:20px}
.pp-sub{color:var(--muted);font-size:13px;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pp-elo-wrap{text-align:right;min-width:130px}
.pp-elo-cap{font-size:10px;letter-spacing:.14em;color:var(--subtle);font-weight:700}
.pp-elo{font-family:var(--display);font-style:italic;font-weight:800;font-size:46px;line-height:.9}
.pp-tier{display:inline-flex;align-items:center;gap:8px;margin-top:6px}
.pp-tier-name{font-size:14px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill)}
.badge.calib{color:var(--amber);background:#FFF6E6}
.badge.rated{color:var(--green);background:#E7F6EC}

.prog{margin-top:18px}
.prog__top{display:flex;justify-content:space-between;font-size:11px;color:var(--subtle);margin-bottom:6px}
.prog__bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.prog__fill{height:100%;background:var(--grad);border-radius:99px;width:0;transition:width .6s cubic-bezier(.22,.61,.36,1)}

.stats{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--border-soft);border-radius:12px;padding:14px}
.stat .v{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;line-height:1}
.stat .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);font-weight:700;margin-top:4px}
.stat .v.win{color:var(--green)}.stat .v.loss{color:var(--red)}

.grid2{margin-top:14px;display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.spark{width:100%;height:120px}
.spark line,.spark polyline{vector-effect:non-scaling-stroke}
.form-list{display:flex;flex-direction:column;gap:5px}
.form-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border-soft);border-radius:9px;padding:9px 12px}
.form-row .s{flex:1;font-size:12px;font-weight:600;color:var(--muted)}
.form-row .e{font-size:13px;font-weight:700}
.form-row .d{font-size:11px;font-weight:700;width:46px;text-align:right}
.d.up{color:var(--green)}.d.down{color:var(--red)}.d.flat{color:var(--faint)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill);background:#fff;border:1px solid var(--border);color:var(--muted)}

.state{padding:50px 20px;text-align:center}
.state h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:24px;margin:0}
.state p{color:var(--muted);font-size:13px;margin:8px 0 16px}
.skeleton{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:860px){.nav{display:none}.menu-toggle{display:flex}}
@media(max-width:680px){.pp-elo-wrap{text-align:left;width:100%}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}.prog__fill{transition:none}}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="brand">Trekkr</a>
    <nav class="nav" aria-label="Primary">
      <a href="/rankings">Rankings</a>
      <a href="https://venue.trekkr.online">Venues</a>
      <a href="/tournaments">Tournaments</a>
      <a href="/events">Events</a>
    </nav>
    <div class="header-actions">
      <a href="/rankings#find" class="btn btn--outline"><i class="ti ti-search" aria-hidden="true"></i>Find me</a>
      <a href="https://admin.trekkr.online" class="btn btn--primary">Venue login</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">≡</button>
    </div>
  </div>
  <div class="container">
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile">
      <a href="/rankings">Rankings</a>
      <a href="https://venue.trekkr.online">Venues</a>
      <a href="/tournaments">Tournaments</a>
      <a href="/events">Events</a>
      <a href="/rankings#find">Find me</a>
      <a href="https://admin.trekkr.online">Venue login</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="pp-head"><a class="pp-back" href="/rankings"><i class="ti ti-arrow-left" aria-hidden="true"></i>Back to rankings</a></div>
  <div id="content"><div class="skeleton" style="margin-top:14px"></div><div class="skeleton" style="margin-top:10px;height:70px"></div></div>
</main>

<div class="toast" id="toast"></div>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="footer-brand">Trekkr</span>
    <nav class="footer-links" aria-label="Footer">
      <a href="/rankings">Rankings</a>
      <a href="https://venue.trekkr.online">Venues</a>
      <a href="/tournaments">Tournaments</a>
      <a href="/events">Events</a>
    </nav>
    <span class="footer-copy">© 2026 Trekkr. All rights reserved.</span>
  </div>
</footer>

<script>
(function(){
  var BASE = location.hostname==='trekkr.online' ? '/api' : 'https://trekkr.online/api';
  var mt=document.getElementById('menuToggle'), mn=document.getElementById('mobileNav');
  mt&&mt.addEventListener('click',function(){var o=mn.classList.toggle('open');mt.setAttribute('aria-expanded',o?'true':'false');});

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function initials(n){var p=String(n).trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

  var TIERS=[{n:'Beginner',min:0,max:899},{n:'Upper Beginner',min:900,max:1199},{n:'Lower Bronze',min:1200,max:1499},{n:'Bronze',min:1500,max:1799},{n:'Upper Bronze',min:1800,max:2099},{n:'Silver',min:2100,max:2399},{n:'Gold',min:2500,max:2999},{n:'Platinum',min:3000,max:9999}];
  function tierProg(e){var c=TIERS.find(function(x){return e>=x.min&&e<=x.max;})||TIERS[0];var p=((e-c.min)/(c.max-c.min+1))*100;var ni=TIERS.indexOf(c)+1;var n=ni<TIERS.length?TIERS[ni]:null;return{current:c.n,progress:Math.min(Math.max(p,2),100),next:n,away:n?n.min-e:0};}

  function sparkline(vals){
    if(vals.length<2)return '';
    var w=420,h=120,pad=8,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;
    var pts=vals.map(function(v,i){var x=pad+(i/(vals.length-1))*(w-2*pad);var y=h-pad-((v-min)/rng)*(h-2*pad);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
    var lastX=w-pad,lastY=h-pad-((vals[vals.length-1]-min)/rng)*(h-2*pad);
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'
      +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF3830"/><stop offset="1" stop-color="#FFB000"/></linearGradient></defs>'
      +'<polyline fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>'
      +'<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="3.5" fill="#FF6A00"/></svg>';
  }

  function render(d){
    var p=d.player||{}, s=d.stats||{}, hist=(d.history||[]);
    var name=p.displayName||p.name||'Player';
    var elo=s.currentElo||0, tp=tierProg(elo);
    var rated=(s.totalMatches||0)>=15;
    var av=p.photoUrl?'<img class="pp-avatar" src="'+esc(p.photoUrl)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'pp-avatar\',textContent:\''+esc(initials(name))+'\'}))"/>':'<div class="pp-avatar">'+esc(initials(name))+'</div>';

    var sub=[];
    if(p.gender)sub.push(p.gender==='F'?'Women':'Men');
    if(p.region)sub.push(esc(p.region));
    var subHTML=sub.join(' <span style="color:var(--faint)">·</span> ');

    var streak=s.streak&&s.streak!=='-'?s.streak:'—';
    var wl=(s.totalW||0)+'–'+(s.totalL||0);

    // recent form (skip INITIAL seed row, newest first)
    var real=hist.filter(function(h){return h.sessionId!=='INITIAL';});
    var form=real.slice(-6).reverse().map(function(h,i,arr){
      var d=h.delta||0;
      var cls=d>0?'up':d<0?'down':'flat';
      var sign=d>0?'+'+d:(d<0?''+d:'0');
      return '<div class="form-row"><span class="s">Session '+(real.length-i)+'</span><span class="e">'+h.elo+'</span><span class="d '+cls+'">'+sign+'</span></div>';
    }).join('');
    if(!form)form='<div class="form-row"><span class="s">No matches yet</span></div>';

    var sparkVals=hist.map(function(h){return h.elo;});

    var clubs=(p.clubs||'').split(',').map(function(c){return c.trim();}).filter(Boolean);
    var chips=clubs.length?('<div class="chips">'+clubs.map(function(c){return '<span class="chip"><i class="ti ti-map-pin" style="font-size:12px;color:var(--orange)"></i> '+esc(c)+'</span>';}).join('')+'</div>'):'';

    document.getElementById('content').innerHTML=
      '<div class="card">'
        +'<div class="pp-hero">'+av
          +'<div class="pp-id"><div class="pp-name display">'+esc(name)+(p.verified?'<i class="ti ti-rosette-discount-check-filled pp-verified" title="Verified"></i>':'')+'</div>'
          +'<div class="pp-sub">'+subHTML+'</div>'+chips+'</div>'
          +'<div class="pp-elo-wrap"><div class="pp-elo-cap">ELO</div><div class="pp-elo">'+elo+'</div>'
          +'<div class="pp-tier"><span class="pp-tier-name">'+tp.current+'</span>'
          +(rated?'<span class="badge rated"><i class="ti ti-circle-check" style="font-size:12px"></i>Rated</span>':'<span class="badge calib"><i class="ti ti-target" style="font-size:12px"></i>Calibrating</span>')
          +'</div></div>'
        +'</div>'
        +'<div class="prog"><div class="prog__top"><span>'+tp.current+'</span><span>'+(tp.next?(tp.away+' to '+tp.next.n):'Top tier')+'</span></div>'
          +'<div class="prog__bar"><div class="prog__fill" id="progFill"></div></div></div>'
      +'</div>'
      +'<div class="stats">'
        +'<div class="stat"><div class="v">'+(s.totalMatches||0)+'</div><div class="l">Matches</div></div>'
        +'<div class="stat"><div class="v">'+(s.winRate||0)+'%</div><div class="l">Win rate</div></div>'
        +'<div class="stat"><div class="v"><span class="win">'+(s.totalW||0)+'</span>–<span class="loss">'+(s.totalL||0)+'</span></div><div class="l">Win–Loss</div></div>'
        +'<div class="stat"><div class="v">'+streak+'</div><div class="l">Streak</div></div>'
      +'</div>'
      +'<div class="grid2">'
        +'<div class="card" style="padding:16px"><div class="sec-label">ELO history</div>'+(sparkVals.length>1?sparkline(sparkVals):'<p style="color:var(--subtle);font-size:12px">Not enough matches yet.</p>')+'</div>'
        +'<div><div class="sec-label">Recent form</div><div class="form-list">'+form+'</div></div>'
      +'</div>'
      +'<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'
        +'<button class="btn btn--primary" id="shareBtn"><i class="ti ti-share" aria-hidden="true"></i>Share passport</button>'
        +'<a class="btn btn--ghost" href="/rankings">View rankings</a>'
      +'</div>';

    requestAnimationFrame(function(){var f=document.getElementById('progFill');if(f)f.style.width=tp.progress+'%';});
    var sb=document.getElementById('shareBtn');
    sb&&sb.addEventListener('click',function(){
      var url=location.href, title='Trekkr passport · '+name;
      if(navigator.share){navigator.share({title:title,url:url}).catch(function(){});}
      else{navigator.clipboard&&navigator.clipboard.writeText(url);toast('Link copied');}
    });
  }

  function notFound(name){
    document.getElementById('content').innerHTML='<div class="state"><h2>Player not found</h2><p>'+(name?('We couldn\'t find "'+esc(name)+'".'):'No player specified.')+'</p><a class="btn btn--primary" href="/rankings">Browse rankings</a></div>';
  }

  function getName(){
    var seg=location.pathname.split('/').filter(Boolean).pop()||'';
    seg=decodeURIComponent(seg);
    if(seg&&seg.toLowerCase()!=='player'&&!/\.html?$/i.test(seg))return seg;
    var q=new URLSearchParams(location.search).get('name');
    return q||'Novi Oey'; // demo fallback for preview
  }

  var name=getName();
  fetch(BASE+'/players/'+encodeURIComponent(name))
    .then(function(r){return r.ok?r.json():Promise.reject();})
    .then(function(d){ if(d&&(d.player||d.stats))render(d); else notFound(name); })
    .catch(function(){notFound(name);});
})();
</script>
</body>
</html>
