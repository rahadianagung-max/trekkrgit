<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Player Passport | Trekkr</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#003ec7;--primary-container:#0052ff;--secondary-container:#cd4800;--on-surface:#0b1c30;--on-surface-variant:#434656;--on-inverse:#eaf1ff;--on-primary:#fff;--surface:#f8f9ff;--surface-low:#eff4ff;--surface-container:#e5eeff;--surface-high:#dce9ff;--surface-highest:#d3e4fe;--surface-lowest:#fff;--surface-inverse:#213145;--ok:#1f9d63;--danger:#ba1a1a;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-pill:999px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:32px;--rhythm-section:32px;--rhythm-major:48px;--shadow-soft:0 16px 34px rgba(11,28,48,0.08);--motion-base:220ms;--ease-out:cubic-bezier(0.22,0.61,0.36,1)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{color:var(--on-surface);font-family:'Plus Jakarta Sans',sans-serif;line-height:1.45;background:radial-gradient(1200px 500px at 100% -15%,rgba(0,82,255,0.11),transparent 58%),radial-gradient(900px 500px at -10% 110%,rgba(205,72,0,0.1),transparent 54%),var(--surface)}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}h1,h2,h3,p{margin:0}
.container{width:min(1280px,calc(100% - 80px));margin:0 auto}
.site-header{position:sticky;top:0;z-index:50;background:rgba(248,249,255,0.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(115,118,136,0.1)}
.site-header__inner{display:flex;align-items:center;justify-content:space-between;min-height:80px}
.brand{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:800;letter-spacing:-0.03em;text-transform:uppercase}
.nav-links{display:flex;gap:6px}.nav-link{border-radius:var(--radius-pill);padding:9px 18px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--on-surface-variant);transition:all var(--motion-base)}.nav-link:hover{background:var(--surface-container)}.nav-link.is-active{color:var(--primary);background:var(--surface-container)}
.header-actions{display:flex;gap:12px}.btn{border:0;border-radius:var(--radius-pill);padding:10px 22px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:all var(--motion-base)}.btn--primary{background:var(--primary);color:var(--on-primary)}.btn--ghost{background:var(--surface-container);color:var(--primary)}.btn--text{background:transparent;color:var(--on-surface-variant)}
.btn--ig{background:linear-gradient(135deg,#833AB4,#E1306C,#F77737);color:#fff}.btn--wa{background:#25D366;color:#fff}
/* Passport header */
.pp-header{position:relative;overflow:hidden;padding:var(--rhythm-section) 0;border-bottom:1px solid rgba(115,118,136,0.18);background:linear-gradient(180deg,rgba(229,238,255,0.45),rgba(248,249,255,0))}
.pp-header::before{content:"";position:absolute;inset:0;background-image:linear-gradient(140deg,rgba(248,249,255,0.82),rgba(248,249,255,0.46)),var(--pp-bg,url("https://i.ibb.co.com/DH2Kq7K5/Screen-Shot-2026-04-21-at-08-57-40.png"));background-size:cover;background-position:center;pointer-events:none}
.pp-header>.container{position:relative;z-index:1}
.pp-label{display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius-pill);padding:6px 12px;background:var(--surface-container);font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--primary)}
.pp-title{margin-top:10px;font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,4.6vw,58px);line-height:1.02;letter-spacing:-0.04em;text-transform:uppercase;font-weight:900}
/* Hero card */
.pp-hero{margin-top:var(--space-7);border-radius:var(--radius-xl);padding:24px;background:linear-gradient(140deg,rgba(0,62,199,0.08),rgba(205,72,0,0.08));display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;box-shadow:var(--shadow-soft)}
.pp-photo{width:120px;height:120px;border-radius:var(--radius-lg);object-fit:cover;background:var(--surface-container)}
.pp-verified{display:inline-block;margin-top:8px;border-radius:var(--radius-pill);padding:4px 10px;background:rgba(31,157,99,0.12);color:#136541;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.pp-name{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4vw,46px);line-height:0.95;letter-spacing:-0.03em;text-transform:uppercase;font-weight:900}
.pp-meta-grid{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pp-meta-label{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--on-surface-variant)}
.pp-meta-value{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;margin-top:2px}
/* Stats */
.pp-stats{margin-top:var(--rhythm-section);display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pp-stat{border-radius:var(--radius-lg);background:var(--surface-low);padding:18px;text-align:center}
.pp-stat--hl{background:rgba(31,157,99,0.08);border:1px solid rgba(31,157,99,0.2)}
.pp-stat-label{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--on-surface-variant)}
.pp-stat-val{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,3vw,34px);font-weight:900;margin-top:4px}
.pp-stat-sub{font-size:11px;color:var(--on-surface-variant);margin-top:2px}
/* Tier + Info */
.pp-dual{margin-top:var(--space-6);display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pp-card{border-radius:var(--radius-lg);background:var(--surface-low);padding:20px}
.pp-card-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-0.02em}
.pp-tier-name{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:900;color:var(--primary);margin-top:8px}
.pp-tier-next{font-size:13px;color:var(--on-surface-variant);margin-top:4px}
.pp-bar-bg{height:8px;border-radius:4px;background:var(--surface-highest);margin-top:12px;overflow:hidden}
.pp-bar-fill{height:100%;border-radius:4px;background:var(--primary);transition:width 1s}
.pp-info-grid{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pp-info-item{padding:12px;border-radius:var(--radius-md);background:var(--surface-lowest)}
.pp-info-label{font-family:'Inter',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--on-surface-variant)}
.pp-info-value{font-weight:700;font-size:14px;margin-top:2px}
/* Chart */
.pp-chart{margin-top:var(--space-6);border-radius:var(--radius-lg);background:var(--surface-inverse);padding:24px;color:var(--on-inverse)}
.pp-chart-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase}
.pp-chart-canvas{width:100%;height:180px;margin-top:16px}

/* Table History Styles */
.data-table-wrap{margin-top:0px;background:var(--surface-lowest);border-radius:var(--radius-lg);overflow:hidden;border:1px solid rgba(115,118,136,0.12)}
.data-table{width:100%;border-collapse:collapse;text-align:left}
.data-table th{background:var(--surface-low);padding:12px 16px;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--on-surface-variant);border-bottom:1px solid rgba(115,118,136,0.12)}
.data-table td{padding:16px;border-bottom:1px solid rgba(115,118,136,0.08);vertical-align:middle;font-size:14px}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(239,244,255,0.4)}
.res-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700}
.res-w{background:rgba(31,157,99,0.12);color:var(--ok);border:1px solid rgba(31,157,99,0.2)}
.res-l{background:rgba(186,26,26,0.12);color:var(--danger);border:1px solid rgba(186,26,26,0.2)}
.res-d{background:var(--surface-highest);color:var(--on-surface-variant);border:1px solid rgba(115,118,136,0.2)}

/* Share */
.pp-share{margin-top:var(--space-6);border-radius:var(--radius-lg);background:var(--surface-low);padding:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pp-share-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase}
.pp-share-btns{display:flex;gap:8px}
/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--surface-inverse);color:var(--on-inverse);padding:12px 24px;border-radius:var(--radius-pill);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
canvas#shareCanvas{display:none}
/* Footer */
.site-footer{margin-top:72px;border-top:1px solid rgba(115,118,136,0.12);padding:var(--space-7) 0}
.site-footer__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.footer-brand{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase}
.footer-links{display:flex;gap:20px;font-size:13px;color:var(--on-surface-variant)}
.footer-copy{font-size:12px;color:var(--on-surface-variant)}
/* State */
.state-panel{margin-top:var(--rhythm-section);background:var(--surface-container);border-radius:var(--radius-xl);padding:44px 28px;text-align:center}
.state-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4vw,48px);line-height:0.95;letter-spacing:-0.03em;text-transform:uppercase}
.state-copy{margin:10px auto 0;max-width:700px;color:var(--on-surface-variant);font-size:16px}
@media(max-width:1023px){.container{width:min(100%,calc(100% - 48px))}.nav-links{display:none}.pp-hero{grid-template-columns:1fr}.pp-meta-grid{grid-template-columns:repeat(2,1fr)}.pp-stats{grid-template-columns:repeat(3,1fr)}.pp-dual{grid-template-columns:1fr}}
@media(max-width:767px){.container{width:min(100%,calc(100% - 32px))}.header-actions{display:none}.pp-stats{grid-template-columns:repeat(2,1fr)}.pp-share{flex-direction:column;align-items:stretch}.pp-share-btns{justify-content:center}}
</style>
</head>
<body>
<header class="site-header"><div class="container site-header__inner"><a href="https://trekkr.online" class="brand">Trekkr</a><nav class="nav-links"><a class="nav-link" href="https://trekkr.online">National Ranking</a><a class="nav-link" href="https://venue.trekkr.online">Venue</a><a class="nav-link" href="https://sportsactvd.com/trekkr" target="_blank">About</a></nav><div class="header-actions"><button class="btn btn--text" onclick="location.href='https://admin.trekkr.online'">Sign In</button></div></div></header>
<main>
  <section class="pp-header"><div class="container"><span class="pp-label" id="ppLabel">Trekkr Passport</span><h1 class="pp-title" id="ppTitle">Player Passport</h1></div></section>
  <section><div class="container" id="content"><div class="state-panel"><h2 class="state-title">Loading</h2><p class="state-copy">Fetching player data & calculating history...</p></div></div></section>
</main>
<canvas id="shareCanvas" width="1080" height="1920"></canvas>
<div class="toast" id="toast"></div>
<footer class="site-footer"><div class="container site-footer__inner"><div class="footer-brand">Trekkr</div><div class="footer-links"><a href="https://sportsactvd.com/trekkr" target="_blank">About</a><a href="https://venue.trekkr.online">Venues</a></div><div class="footer-copy">© 2026 Trekkr. All rights reserved.</div></div></footer>

<script src="https://trekkr.online/trekkr-api.js"></script>

<script>
let playerData=null;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function tcCls(e){if(e>=3000)return'Platinum';if(e>=2500)return'Gold';if(e>=2100)return'Silver';if(e>=1800)return'Upper Bronze';if(e>=1500)return'Bronze';if(e>=1200)return'Lower Bronze';if(e>=900)return'Upper Beginner';return'Beginner'}
function tierProg(e){const t=[{name:'Beginner',min:0,max:899},{name:'Upper Beginner',min:900,max:1199},{name:'Lower Bronze',min:1200,max:1499},{name:'Bronze',min:1500,max:1799},{name:'Upper Bronze',min:1800,max:2099},{name:'Silver',min:2100,max:2399},{name:'Gold',min:2500,max:2999},{name:'Platinum',min:3000,max:9999}];const c=t.find(x=>e>=x.min&&e<=x.max)||t[0];const p=((e-c.min)/(c.max-c.min+1))*100;const ni=t.indexOf(c)+1;const n=ni<t.length?t[ni]:null;return{current:c.name,progress:Math.min(p,100),next:n,ptsAway:n?n.min-e:0}}

async function loadPlayer(){
  const parts=window.location.pathname.split('/').filter(Boolean);
  const name=decodeURIComponent(parts[parts.length-1]||'');
  if(!name){document.getElementById('content').innerHTML='<div class="state-panel"><h2 class="state-title">Not Found</h2><p class="state-copy">Player not specified</p></div>';return}
  
  let d;
  try {
      d = await TrekkrAPI.getPlayerDetail(name);
      playerData = d;
  } catch(e) {
      renderDemo(name);
      return;
  }

  // ALGORITMA BARU: Tarik data history semua match untuk tabel dan kalkulasi Best Partner
  try {
      const vRes = await fetch('https://trekkr.online/api/venues');
      const vData = await vRes.json();
      let allMatches = [];
      
      for (const v of vData.venues) {
          try {
              const mRes = await fetch(`https://trekkr.online/api/venues/${encodeURIComponent(v.name)}/matches`);
              const mData = await mRes.json();
              if (mData.matches) {
                  allMatches = allMatches.concat(mData.matches);
              }
          } catch(err) {}
      }
      
      const targetName = name.toLowerCase().trim();
      const myMatches = allMatches.filter(m => 
          (m.p1t1 || "").toLowerCase().trim() === targetName || 
          (m.p2t1 || "").toLowerCase().trim() === targetName || 
          (m.p1t2 || "").toLowerCase().trim() === targetName || 
          (m.p2t2 || "").toLowerCase().trim() === targetName
      );
      
      myMatches.reverse(); // Data terbaru di atas

      let partnerStats = {};
      let historyTable = [];

      myMatches.forEach(m => {
          const p1t1 = (m.p1t1 || "").toLowerCase().trim();
          const p2t1 = (m.p2t1 || "").toLowerCase().trim();
          const p1t2 = (m.p1t2 || "").toLowerCase().trim();
          const p2t2 = (m.p2t2 || "").toLowerCase().trim();
          const isT1 = (p1t1 === targetName || p2t1 === targetName);
          
          let partner = "";
          let opponents = "";
          let isWin = false;
          let isTie = (m.scoreT1 === m.scoreT2);

          if (isT1) {
              partner = (p1t1 === targetName) ? m.p2t1 : m.p1t1;
              opponents = `${m.p1t2} & ${m.p2t2}`;
              isWin = m.scoreT1 > m.scoreT2;
          } else {
              partner = (p1t2 === targetName) ? m.p2t2 : m.p1t2;
              opponents = `${m.p1t1} & ${m.p2t1}`;
              isWin = m.scoreT2 > m.scoreT1;
          }

          if (partner && !isTie) {
              const ptKey = partner.toLowerCase().trim();
              if (!partnerStats[ptKey]) partnerStats[ptKey] = { name: partner, w: 0, l: 0, total: 0 };
              partnerStats[ptKey].total++;
              if (isWin) partnerStats[ptKey].w++; else partnerStats[ptKey].l++;
          }

          historyTable.push({
              date: m.date || "N/A",
              partner: partner || "None",
              opponents: opponents,
              resClass: isTie ? 'res-d' : (isWin ? 'res-w' : 'res-l'),
              resText: isTie ? 'D' : (isWin ? 'W' : 'L')
          });
      });

      let bestPartner = "No Data";
      let bestPartnerScore = "0W - 0L";
      let highestScore = -1;

      for (const [ptKey, stats] of Object.entries(partnerStats)) {
          const winRate = stats.w / stats.total;
          const score = stats.w + (winRate * 0.1); 
          if (stats.total > 0 && score > highestScore) {
              highestScore = score;
              bestPartner = stats.name;
              bestPartnerScore = `${stats.w}W - ${stats.l}L`;
          }
      }

      // Memasukkan hasil hitungan ke object Player Data utama
      d.bestPartner = { name: bestPartner, score: bestPartnerScore };
      d.historyTable = historyTable;

  } catch(err) {
      console.warn("Gagal menarik data histori venue", err);
  }

  renderPlayer(d);

  try{const s=await TrekkrAPI.getSettings();const st=s.settings||{};if(st.passport_label)document.getElementById('ppLabel').textContent=st.passport_label;if(st.passport_title)document.getElementById('ppTitle').textContent=st.passport_title;if(st.passport_image){document.querySelector('.pp-header').style.setProperty('--pp-bg','url('+st.passport_image+')')}}catch(e){}
}

function renderPlayer({player:p, stats:s, history, bestPartner, historyTable}){
  const ti=tierProg(s.currentElo);
  document.title=`${p.displayName} — Trekkr Passport`;
  let h=`<article class="pp-hero"><div><img class="pp-photo" src="${p.photoUrl||'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27120%27 height=%27120%27%3E%3Crect width=%27120%27 height=%27120%27 rx=%2716%27 fill=%27%23e5eeff%27/%3E%3Ccircle cx=%2760%27 cy=%2745%27 r=%2720%27 fill=%27%23d3e4fe%27/%3E%3Cpath d=%27M25 110c0-19 16-35 35-35s35 16 35 35%27 fill=%27%23d3e4fe%27/%3E%3C/svg%3E'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27120%27 height=%27120%27%3E%3Crect width=%27120%27 height=%27120%27 rx=%2716%27 fill=%27%23e5eeff%27/%3E%3C/svg%3E'">
  ${p.verified?'<span class="pp-verified">Verified</span>':''}</div>
  <div><h2 class="pp-name">${(p.displayName||p.name).toUpperCase()}</h2>
  <div class="pp-meta-grid">
    <div><p class="pp-meta-label">ELO Rating</p><p class="pp-meta-value">${s.currentElo}</p></div>
    <div><p class="pp-meta-label">Level</p><p class="pp-meta-value">${ti.current}</p></div>
    <div><p class="pp-meta-label">Gender</p><p class="pp-meta-value">${p.gender==='F'?'Women':'Men'}</p></div>
    ${p.ig?`<div><p class="pp-meta-label">Instagram</p><p class="pp-meta-value">${p.ig}</p></div>`:`<div><p class="pp-meta-label">Region</p><p class="pp-meta-value">${p.region||'—'}</p></div>`}
  </div></div></article>`;

  h+=`<div class="pp-stats">
    <div class="pp-stat"><p class="pp-stat-label">Matches</p><p class="pp-stat-val">${s.totalMatches}</p></div>
    <div class="pp-stat pp-stat--hl"><p class="pp-stat-label">Win Rate</p><p class="pp-stat-val">${s.winRate}%</p></div>
    <div class="pp-stat"><p class="pp-stat-label">W / L</p><p class="pp-stat-val">${s.totalW}/${s.totalL}</p></div>
    <div class="pp-stat"><p class="pp-stat-label">Streak</p><p class="pp-stat-val">${s.streak||'—'}</p></div>
    <div class="pp-stat"><p class="pp-stat-label">ELO</p><p class="pp-stat-val">${s.currentElo}</p></div>
  </div>`;

  h+=`<div class="pp-dual"><div class="pp-card"><p class="pp-card-title">Level Progress</p><p class="pp-tier-name">${ti.current}</p>
    ${ti.next?`<p class="pp-tier-next">Next: ${ti.next.name} · ${ti.ptsAway} pts away</p>`:'<p class="pp-tier-next">Maximum tier reached!</p>'}
    <div class="pp-bar-bg"><div class="pp-bar-fill" style="width:${ti.progress}%"></div></div></div>
    <div class="pp-card"><p class="pp-card-title">Info</p><div class="pp-info-grid">
    ${p.clubs?`<div class="pp-info-item"><p class="pp-info-label">Club / Venue</p><p class="pp-info-value">${p.clubs}</p></div>`:''} 
    ${p.region?`<div class="pp-info-item"><p class="pp-info-label">Region</p><p class="pp-info-value">${p.region}</p></div>`:''}
    ${p.ig?`<div class="pp-info-item"><p class="pp-info-label">Instagram</p><p class="pp-info-value">${p.ig}</p></div>`:''}
    <div class="pp-info-item"><p class="pp-info-label">Gender</p><p class="pp-info-value">${p.gender==='F'?'Female':'Male'}</p></div>
  </div></div></div>`;

  // UI BEST PERFORMING PARTNER
  if(bestPartner) {
      h+=`<div class="pp-card" style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
            <p class="pp-card-title" style="font-size:14px; color:var(--on-surface-variant)">Best Performing Partner</p>
            <p class="pp-tier-name" style="font-size:24px; margin-top:4px; color:var(--on-surface)">${bestPartner.name}</p>
        </div>
        <div style="text-align:right">
            <p class="pp-info-label">Record Together</p>
            <p class="pp-info-value" style="color:var(--ok); font-size:18px">${bestPartner.score}</p>
        </div>
      </div>`;
  }

  // UI CHART ELO
  if(history&&history.length>1)h+=`<div class="pp-chart"><p class="pp-chart-title">ELO Progress</p><canvas class="pp-chart-canvas" id="eloChart"></canvas></div>`;

  // UI PLAYING HISTORY TABLE
  if(historyTable) {
      let histRows = '';
      if (historyTable.length > 0) {
          historyTable.forEach(hItem => {
              histRows += `<tr>
                  <td><span style="color:var(--on-surface-variant);font-family:'Inter',sans-serif;font-size:12px">${hItem.date}</span></td>
                  <td>
                      <div style="font-weight:700;font-size:14px;color:var(--on-surface)"><span style="color:var(--primary);font-size:11px;margin-right:4px">w/</span>${hItem.partner}</div>
                      <div style="font-size:11px;color:var(--on-surface-variant);margin-top:2px;font-family:'Inter',sans-serif">VS ${hItem.opponents}</div>
                  </td>
                  <td><div class="res-badge ${hItem.resClass}">${hItem.resText}</div></td>
              </tr>`;
          });
      } else {
          histRows = `<tr><td colspan="3" style="text-align:center;color:var(--on-surface-variant)">No match history found.</td></tr>`;
      }
      
      h+=`<div class="pp-card" style="margin-top:16px; padding:0; overflow:hidden; background:transparent">
          <p class="pp-chart-title" style="margin-bottom:12px; padding:0 4px; color:var(--on-surface)">Playing History</p>
          <div class="data-table-wrap">
              <table class="data-table">
                  <thead>
                      <tr>
                          <th width="90">Date</th>
                          <th>Matchup</th>
                          <th width="60">Res</th>
                      </tr>
                  </thead>
                  <tbody>
                      ${histRows}
                  </tbody>
              </table>
          </div>
      </div>`;
  }

  // UI SHARE BUTTONS
  h+=`<div class="pp-share"><div><p class="pp-share-title">Share Passport</p><p style="font-size:13px;color:var(--on-surface-variant);margin-top:2px">Share this player's profile</p></div><div class="pp-share-btns">

    <button class="btn btn--ghost" onclick="copyLink()">Copy Link</button>
    <button class="btn btn--wa" onclick="shareWA()">WhatsApp</button>
  </div></div>`;

  document.getElementById('content').innerHTML=h;
  if(history&&history.length>1)drawChart(history);
}

function drawChart(history){const canvas=document.getElementById('eloChart');if(!canvas)return;const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,pad={t:10,r:10,b:24,l:40};const elos=history.map(e=>e.elo),minE=Math.min(...elos)-20,maxE=Math.max(...elos)+20;const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;ctx.strokeStyle='rgba(234,241,255,0.15)';ctx.lineWidth=0.5;for(let i=0;i<=4;i++){const y=pad.t+(plotH/4)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();const v=Math.round(maxE-((maxE-minE)/4)*i);ctx.fillStyle='rgba(234,241,255,0.5)';ctx.font='9px Inter';ctx.textAlign='right';ctx.fillText(v,pad.l-6,y+3)}ctx.beginPath();ctx.strokeStyle='#6ea1ff';ctx.lineWidth=2;ctx.lineJoin='round';history.forEach((e,i)=>{const x=pad.l+(plotW/(history.length-1))*i;const y=pad.t+plotH-((e.elo-minE)/(maxE-minE))*plotH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();history.forEach((e,i)=>{const x=pad.l+(plotW/(history.length-1))*i;const y=pad.t+plotH-((e.elo-minE)/(maxE-minE))*plotH;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#6ea1ff';ctx.fill()})}

function shareIG(){if(!playerData)return;const p=playerData.player,s=playerData.stats,c=document.getElementById('shareCanvas'),ctx=c.getContext('2d');c.width=1080;c.height=1920;const g=ctx.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#001c6f');g.addColorStop(1,'#003ec7');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);ctx.font='700 48px Space Grotesk';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('TREKKR',540,160);ctx.font='700 16px Inter';ctx.fillStyle='rgba(234,241,255,0.6)';ctx.fillText('PADEL ELO PASSPORT',540,195);ctx.font='900 72px Space Grotesk';ctx.fillStyle='#fff';ctx.fillText((p.displayName||p.name).toUpperCase(),540,700);ctx.font='900 180px Space Grotesk';ctx.fillStyle='#6ea1ff';ctx.fillText(String(s.currentElo),540,950);const tier=TrekkrAPI.getTierName(s.currentElo);ctx.font='700 32px Inter';ctx.fillStyle='rgba(234,241,255,0.7)';ctx.fillText(tier.toUpperCase(),540,1020);ctx.font='500 28px Plus Jakarta Sans';ctx.fillStyle='#eaf1ff';ctx.fillText(`Matches: ${s.totalMatches}    W/L: ${s.totalW}/${s.totalL}    Win Rate: ${s.winRate}%`,540,1140);ctx.font='500 20px Plus Jakarta Sans';ctx.fillStyle='rgba(234,241,255,0.4)';ctx.fillText('trekkr.online',540,1840);const link=document.createElement('a');link.download=`trekkr-${(p.name||'player').replace(/\s+/g,'-').toLowerCase()}.png`;link.href=c.toDataURL('image/png');link.click();showToast('IG Story card downloaded!')}
function copyLink(){const url=`https://trekkr.online/player/${encodeURIComponent(playerData?.player?.name||'')}`;navigator.clipboard.writeText(url).then(()=>showToast('Link copied!')).catch(()=>{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Link copied!')})}
function shareWA(){if(!playerData)return;const p=playerData.player,s=playerData.stats,tier=TrekkrAPI.getTierName(s.currentElo),url=`https://trekkr.online/player/${encodeURIComponent(p.name)}`,text=`🎾 ${p.displayName||p.name} — ELO ${s.currentElo} (${tier})\nMatches: ${s.totalMatches} · Win Rate: ${s.winRate}%\n${url}`;window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank')}

function renderDemo(name){
  playerData={
    player:{name,displayName:name,gender:'M',ig:'',verified:false,photoUrl:'',region:'Jakarta',clubs:'Stellar Squad'},
    stats:{currentElo:1389,totalMatches:89,totalW:70,totalL:19,winRate:85,streak:'6W'},
    history:[{elo:1350,delta:0},{elo:1360,delta:10},{elo:1355,delta:-5},{elo:1370,delta:15},{elo:1365,delta:-5},{elo:1380,delta:15},{elo:1389,delta:9}],
    bestPartner: { name: 'Demo Player', score: '14W - 2L' },
    historyTable: [
        {date: '2026-04-20', partner: 'Demo Player', opponents: 'Opponent A & Opponent B', resClass: 'res-w', resText: 'W'},
        {date: '2026-04-18', partner: 'Demo Player', opponents: 'Opponent C & Opponent D', resClass: 'res-l', resText: 'L'}
    ]
  };
  renderPlayer(playerData);
}
