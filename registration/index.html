  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

div>\n<header style=\"position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #E6E9EE;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n    <a href=\"#top\" style=\"display:flex;align-items:center;gap:0;text-decoration:none;\">\n      <img src=\"4999d0fd-0955-454b-8a3d-b26a70fd6860\" alt=\"APPARINDO Sports Summit\" style=\"height:46px;width:auto;display:block;\">\n    <\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:30px;\">\n      <a href=\"#about\" style=\"font:600 14.5px/1 'Public Sans';color:#44505F;text-decoration:none;\">About<\u002Fa>\n      <a href=\"#schedule\" style=\"font:600 14.5px/1 'Public Sans';color:#44505F;text-decoration:none;\">Schedule<\u002Fa>\n      <a href=\"#sports\" style=\"font:600 14.5px/1 'Public Sans';color:#44505F;text-decoration:none;\">Sports<\u002Fa>\n      <a href=\"#teams\" style=\"font:600 14.5px/1 'Public Sans';color:#44505F;text-decoration:none;\">Teams<\u002Fa>\n      <a href=\"#leaderboard\" style=\"font:600 14.5px/1 'Public Sans';color:#44505F;text-decoration:none;\">Leaderboard<\u002Fa>\n      <a href=\"#register\" style=\"display:inline-flex;align-items:center;gap:8px;background:#1C4E8F;color:#fff;font:700 14.5px/1 'Public Sans';padding:13px 22px;border-radius:8px;text-decoration:none;\">Register<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===== HERO ===== -->\n<section id=\"top\" style=\"position:relative;background:#fff;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:80px 32px 88px;display:grid;grid-template-columns:1.15fr 0.85fr;gap:64px;align-items:center;\">\n    <div>\n      <div style=\"display:inline-flex;align-items:center;gap:10px;background:#F6F8FA;border:1px solid #E6E9EE;border-radius:999px;padding:8px 16px;margin-bottom:28px;\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#4FA23E;\"><\u002Fspan>\n        <span style=\"font:600 13px/1 'Public Sans';letter-spacing:.04em;color:#44505F;\">Compete Together. Connect Stronger.<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font:900 clamp(40px,6vw,76px)/0.98 'Archivo';letter-spacing:-.03em;color:#142A4C;margin:0 0 24px;text-wrap:balance;\">APPARINDO<br>Sports Summit<span style=\"color:#4FA23E;\">.<\u002Fspan><\u002Fh1>\n      <p style=\"font:400 19px/1.6 'Public Sans';color:#44505F;max-width:520px;margin:0 0 34px;text-wrap:pretty;\">An inter-company sports festival for APPARINDO members — four sports, two days, one community. Uniting insurance &amp; reinsurance brokers beyond business.<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:40px;\">\n        <a href=\"#register\" style=\"display:inline-flex;align-items:center;gap:10px;background:#1C4E8F;color:#fff;font:700 16px/1 'Public Sans';padding:17px 30px;border-radius:9px;text-decoration:none;\">Register your company →<\u002Fa>\n        <a href=\"#schedule\" style=\"display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #D5DBE3;color:#142A4C;font:700 16px/1 'Public Sans';padding:16px 28px;border-radius:9px;text-decoration:none;\">View schedule<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:40px;flex-wrap:wrap;border-top:1px solid #E6E9EE;padding-top:28px;\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div>\n            <div style=\"font:800 30px/1 'Archivo';color:#142A4C;letter-spacing:-.02em;\">{{ s.num }}<\u002Fdiv>\n            <div style=\"font:500 13.5px/1 'Public Sans';color:#8A95A3;margin-top:7px;text-transform:uppercase;letter-spacing:.06em;\">{{ s.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- event card -->\n    <div style=\"background:#0E2545;border-radius:18px;padding:34px;color:#fff;box-shadow:0 30px 60px -28px rgba(14,37,69,0.55);\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;\">\n        <div>\n          <div style=\"font:600 12px/1 'Public Sans';letter-spacing:.14em;text-transform:uppercase;color:#8FB4E6;\">Save the date<\u002Fdiv>\n          <div style=\"font:800 30px/1.05 'Archivo';margin-top:10px;letter-spacing:-.02em;\">8 – 9 August<br>2026<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:5px;\">\n          <span style=\"width:9px;height:9px;border-radius:50%;background:#4FA23E;\"><\u002Fspan>\n          <span style=\"width:9px;height:9px;border-radius:50%;background:#F3B30B;\"><\u002Fspan>\n          <span style=\"width:9px;height:9px;border-radius:50%;background:#D33A2C;\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:rgba(255,255,255,0.12);margin-bottom:22px;\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"display:flex;align-items:center;gap:14px;\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#4FA23E;flex:none;\"><\u002Fspan>\n          <div><div style=\"font:700 15px/1.2 'Public Sans';\">Racquet Day · Padel + Badminton<\u002Fdiv><div style=\"font:400 13px/1.3 'Public Sans';color:#A9BDD8;margin-top:3px;\">8 Aug · Trinity Court, SCBD<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px;\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#F3B30B;flex:none;\"><\u002Fspan>\n          <div><div style=\"font:700 15px/1.2 'Public Sans';\">Precision Day · Bowling + Billiard<\u002Fdiv><div style=\"font:400 13px/1.3 'Public Sans';color:#A9BDD8;margin-top:3px;\">9 Aug · Arjuna Bowling &amp; Billiard<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:26px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;\">\n        <div><div style=\"font:400 12px/1 'Public Sans';color:#A9BDD8;text-transform:uppercase;letter-spacing:.08em;\">Registration<\u002Fdiv><div style=\"font:700 16px/1.2 'Public Sans';margin-top:6px;\">1 – 30 July 2026<\u002Fdiv><\u002Fdiv>\n        <span style=\"font:700 12px/1 'Public Sans';background:#4FA23E;color:#fff;padding:7px 12px;border-radius:6px;\">OPEN<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== ABOUT ===== -->\n<section id=\"about\" style=\"background:#F6F8FA;border-top:1px solid #E6E9EE;border-bottom:1px solid #E6E9EE;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;align-items:start;\">\n      <div>\n        <div style=\"font:600 13px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#4FA23E;margin-bottom:16px;\">About the Summit<\u002Fdiv>\n        <h2 style=\"font:800 clamp(30px,3.6vw,46px)/1.06 'Archivo';letter-spacing:-.02em;color:#142A4C;margin:0;text-wrap:balance;\">More than a tournament — a platform to connect the industry.<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font:400 18px/1.7 'Public Sans';color:#44505F;margin:0 0 18px;text-wrap:pretty;\">The insurance and reinsurance brokerage industry is built on trust, collaboration, and the quality of relationships between its players. APPARINDO Sports Summit creates an open, positive arena that strengthens those connections beyond formal forums.<\u002Fp>\n        <p style=\"font:400 18px/1.7 'Public Sans';color:#44505F;margin:0;text-wrap:pretty;\">Across four sports — <strong style=\"color:#142A4C;\">Padel, Badminton, Bowling, and Billiard<\u002Fstrong> — held over two days, members compete on behalf of their companies, combining healthy competition with genuine professional camaraderie.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px;\">\n      <sc-for list=\"{{ objectives }}\" as=\"o\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:14px;padding:28px;\">\n          <div style=\"font:800 15px/1 'Archivo';color:#fff;background:#1C4E8F;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;\">{{ o.n }}<\u002Fdiv>\n          <div style=\"font:700 17.5px/1.3 'Public Sans';color:#142A4C;margin-bottom:8px;\">{{ o.t }}<\u002Fdiv>\n          <div style=\"font:400 14.5px/1.6 'Public Sans';color:#64707E;\">{{ o.d }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== SCHEDULE ===== -->\n<section id=\"schedule\" style=\"background:#fff;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"font:600 13px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#D33A2C;margin-bottom:16px;\">Event Schedule<\u002Fdiv>\n    <h2 style=\"font:800 clamp(30px,3.6vw,46px)/1.06 'Archivo';letter-spacing:-.02em;color:#142A4C;margin:0 0 12px;\">Two days. Four sports.<\u002Fh2>\n    <p style=\"font:400 18px/1.6 'Public Sans';color:#44505F;max-width:600px;margin:0 0 52px;\">From registration through to the awards gala — here is how the Summit unfolds.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:18px;\">\n      <sc-for list=\"{{ schedule }}\" as=\"e\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:170px 1fr auto;gap:28px;align-items:center;background:#fff;border:1px solid #E6E9EE;border-radius:14px;padding:26px 30px;\">\n          <div>\n            <div style=\"font:700 12px/1 'Public Sans';letter-spacing:.1em;text-transform:uppercase;color:#8A95A3;margin-bottom:8px;\">{{ e.phase }}<\u002Fdiv>\n            <div style=\"font:800 19px/1.1 'Archivo';color:#142A4C;\">{{ e.date }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid #E6E9EE;padding-left:28px;\">\n            <div style=\"font:700 20px/1.2 'Public Sans';color:#142A4C;margin-bottom:6px;\">{{ e.title }}<\u002Fdiv>\n            <div style=\"font:400 15px/1.5 'Public Sans';color:#64707E;\">{{ e.meta }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:46px;height:46px;border-radius:12px;background:{{ e.tint }};display:flex;align-items:center;justify-content:center;flex:none;\">\n            <span style=\"width:14px;height:14px;border-radius:50%;background:{{ e.color }};\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== SPORTS / FORMAT & PRIZES ===== -->\n<section id=\"sports\" style=\"background:#F6F8FA;border-top:1px solid #E6E9EE;border-bottom:1px solid #E6E9EE;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"font:600 13px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#4FA23E;margin-bottom:16px;\">Format &amp; Prizes<\u002Fdiv>\n    <h2 style=\"font:800 clamp(30px,3.6vw,46px)/1.06 'Archivo';letter-spacing:-.02em;color:#142A4C;margin:0 0 52px;\">The four arenas.<\u002Fh2>\n\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:22px;\">\n      <sc-for list=\"{{ sports }}\" as=\"sp\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:16px;padding:32px;border-top:4px solid {{ sp.color }};\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;\">\n            <div>\n              <h3 style=\"font:800 26px/1 'Archivo';color:#142A4C;margin:0 0 8px;letter-spacing:-.01em;\">{{ sp.name }}<\u002Fh3>\n              <div style=\"font:600 13px/1 'Public Sans';color:{{ sp.color }};text-transform:uppercase;letter-spacing:.06em; tter-spacing:-.02em;color:#fff;margin:0;\">Beat the stars &amp; more.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font:400 16px/1.6 'Public Sans';color:#A9BDD8;max-width:380px;margin:0;\">Side challenges, celebrity matches and crowd activations keep the energy high between rounds.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px;\">\n      <sc-for list=\"{{ activations }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <div style=\"background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:30px;border-left:4px solid {{ a.color }};\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;\">\n            <h3 style=\"font:800 21px/1.15 'Archivo';color:#fff;margin:0;letter-spacing:-.01em;\">{{ a.t }}<\u002Fh3>\n            <span style=\"font:700 13px/1 'Public Sans';background:{{ a.color }};color:#0E2545;padding:7px 12px;border-radius:6px;white-space:nowrap;\">{{ a.prize }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font:600 14.5px/1.3 'Public Sans';color:#8FB4E6;margin-bottom:10px;\">{{ a.who }}<\u002Fdiv>\n          <p style=\"font:400 15px/1.6 'Public Sans';color:#C7D5E8;margin:0;\">{{ a.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap;margin-top:24px;\">\n      <div style=\"flex:1;min-width:240px;background:rgba(243,179,11,0.12);border:1px solid rgba(243,179,11,0.3);border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;\">\n        <div><div style=\"font:700 17px/1.2 'Public Sans';color:#fff;\">Best Company Jersey<\u002Fdiv><div style=\"font:400 14px/1.3 'Public Sans';color:#A9BDD8;margin-top:4px;\">Judged by APPARINDO representatives<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:800 20px/1 'Archivo';color:#F3B30B;\">Rp 3M<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:240px;background:rgba(211,58,44,0.12);border:1px solid rgba(211,58,44,0.3);border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;\">\n        <div><div style=\"font:700 17px/1.2 'Public Sans';color:#fff;\">Best Supporters<\u002Fdiv><div style=\"font:400 14px/1.3 'Public Sans';color:#A9BDD8;margin-top:4px;\">Bring your loudest crowd<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:800 20px/1 'Archivo';color:#D33A2C;\">Rp 3M<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ===== TEAMS / PARTICIPANTS ===== -->\n<section id=\"teams\" style=\"background:#fff;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:14px;\">\n      <div>\n        <div style=\"font:600 13px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#1C4E8F;margin-bottom:16px;\">Participating Companies<\u002Fdiv>\n        <h2 style=\"font:800 clamp(30px,3.6vw,46px)/1.06 'Archivo';letter-spacing:-.02em;color:#142A4C;margin:0;\">Meet the teams.<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font:400 18px/1.6 'Public Sans';color:#44505F;max-width:620px;margin:0 0 52px;\">A sample of member companies and the players representing them across the four sports.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:24px;\">\n      <sc-for list=\"{{ companies }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid #E6E9EE;border-radius:16px;padding:30px 32px;background:#fff;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid #EEF1F5;\">\n            <div style=\"display:flex;align-items:center;gap:16px;\">\n              <div style=\"width:48px;height:48px =\"{{ true }}\">\n<section id=\"leaderboard\" style=\"background:#F6F8FA;border-top:1px solid #E6E9EE;border-bottom:1px solid #E6E9EE;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:40px;\">\n      <div>\n        <div style=\"font:600 13px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#F3B30B;margin-bottom:16px;\">Company Leaderboard<\u002Fdiv>\n        <h2 style=\"font:800 clamp(30px,3.6vw,46px)/1.06 'Archivo';letter-spacing:-.02em;color:#142A4C;margin:0 0 12px;\">Competing for the company.<\u002Fh2>\n        <p style=\"font:400 17px/1.6 'Public Sans';color:#44505F;max-width:560px;margin:0;\">Points from all four sports combine into one standing. The top company takes the grand prize.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:12px;\">\n        <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:12px;padding:16px 20px;text-align:center;\"><div style=\"font:500 11px/1 'Public Sans';color:#8A95A3;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;\">Winner<\u002Fdiv><div style=\"font:800 18px/1 'Archivo';color:#142A4C;\">Rp 10M<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:12px;padding:16px 20px;text-align:center;\"><div style=\"font:500 11px/1 'Public Sans';color:#8A95A3;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;\">Runner-up<\u002Fdiv><div style=\"font:800 18px/1 'Archivo';color:#142A4C;\">Rp 5M<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:12px;padding:16px 20px;text-align:center;\"><div style=\"font:500 11px/1 'Public Sans';color:#8A95A3;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;\">Third<\u002Fdiv><div style=\"font:800 18px/1 'Archivo';color:#142A4C;\">Rp 2.5M<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:16px;overflow:hidden;\">\n      <div style=\"display:grid;grid-template-columns:64px 1fr repeat(4,84px) 96px;gap:0;padding:16px 28px;background:#0E2545;align-items:center;\">\n        <div style=\"font:700 12px/1 'Public Sans';color:#8FB4E6;text-transform:uppercase;letter-spacing:.06em;\">Rank<\u002Fdiv>\n        <div style=\"font:700 12px/1 'Public Sans';color:#8FB4E6;text-transform:uppercase;letter-spacing:.06em;\">Company<\u002Fdiv>\n        <div style=\"font:700 12px/1 'Public Sans';color:#8FB4E6;text-transform:uppercase;letter-spacing:.06em;text-align:center;\">Padel<\u002Fdiv>\n        <div style=\"font:700 12px/1 'Public Sans';color:#8FB4E6;text-transform:uppercase;letter-spacing:.06em;text-align:center;\">Bdmtn<\u002Fdiv>\n        <div style=\"font:700 12px/1 'Public Sans';color:#8FB4E6;text-transform:uppercase;letter-spacing:.06em;text-align:center;\">Bowl<\u002Fdiv>\n        <div style=\"font:700 12px/1 'Public Sans';color:#8FB4E6;text-transform:uppercase;letter-spacing:.06em;text-align:center;\">Bllrd<\u002Fdiv>\n        <div style=\"font:700 12px/1 'Public Sans';color:#fff;text-transform:uppercase;letter-spacing:.06em;text-align:right;\">Total<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ leaderboard }}\" as=\"r\" hint-placeholder-count=\"10\">\n        <div style=\"display:grid;grid-template-columns:64px 1fr repeat(4,84px) 96px;gap:0;padding:18px 28px;align-items:center;border-top:1px solid #EEF1F5;background:{{ r.rowbg }};\">\n          <div style=\"display:flex;align-items:center;\"><span style=\"width:30px;height:30px;border-radius:8px;background:{{ r.rankbg }};color:{{ r.rankcolor }};display:flex;align-items:center;justify-content:center;font:800 14px/1 'Archivo';\">{{ r.rank }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:13px;\">\n            <span style=\"width:30px;height:30px;border-radius:8px;background:{{ r.color }};color:#fff;display:flex;align-items:center;justify-content:center;font:800 12px/1 'Archivo';flex:none;\">{{ r.mark }}<\u002Fspan>\n            <span style=\"font:700 15.5px/1.2 'Public Sans';color:#142A4C;\">{{ r.name }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font:500 15px/1 'Public Sans';color:#64707E;text-align:center;\">{{ r.padel }}<\u002Fdiv>\n          <div style=\"font:500 15px/1 'Public Sans';color:#64707E;text-align:center;\">{{ r.badminton }}<\u002Fdiv>\n          <div style=\"font:500 15px/1 'Public Sans';color:#64707E;text-align:center;\">{{ r.bowling }}<\u002Fdiv>\n          <div style=\"font:500 15px/1 'Public Sans';color:#64707E;text-align:center;\">{{ r.billiard }}<\u002Fdiv>\n          <div style=\"font:800 17px/1 'Archivo';color:#142A4C;text-align:right;\">{{ r.total }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ===== REGISTRATION ===== -->\n<section id=\"register\" style=\"background:#fff;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"display:grid;grid-template-columns:0.85fr 1.15fr;gap:56px;align-items:start;\">\n      <div>\n        <div style=\"font:600 13px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#4FA23E;margin-bottom:16px;\">Registration<\u002Fdiv>\n        <h2 style=\"font:800 clamp(30px,3.6vw,46px)/1.06 'Archivo';letter-spacing:-.02em;color:#142A4C;margin:0 0 18px;\">Enter your company.<\u002Fh2>\n        <p style=\"font:400 17px/1.65 'Public Sans';color:#44505F;margin:0 0 30px;\">Team registration runs <strong style=\"color:#142A4C;\">1 – 30 July 2026<\u002Fstrong>. Reserve your company's slots across any of the four sports.<\u002Fp>\n\n        <div style=\"background:#F6F8FA;border:1px solid #E6E9EE;border-radius:14px;padding:24px;margin-bottom:18px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;\">\n            <span style=\"font:600 14px/1 'Public Sans';color:#44505F;\">Team slots remaining<\u002Fspan>\n            <span style=\"font:800 20px/1 'Archivo';color:#D33A2C;\">{{ spotsLeft }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:8px;background:#E6E9EE;border-radius:999px;overflow:hidden;\"><div style=\"height:100%;width:{{ spotsPct }};background:#4FA23E;border-radius:999px;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;\">\n          <sc-for list=\"{{ included }}\" as=\"i\" hint-placeholder-count=\"4\">\n            <li style=\"display:flex;align-items:center;gap:12px;font:500 15px/1.4 'Public Sans';color:#44505F;\">\n              <span style=\"width:20px;height:20px;border-radius:50%;background:#4FA23E;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px/1 'Public Sans';flex:none;\">✓<\u002Fspan>{{ i }}\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <!-- form card -->\n      <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:18px;padding:36px;box-shadow:0 24px 50px -34px rgba(14,37,69,0.4);\">\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:40px 10px;\">\n            <div style=\"width:64px;height:64px;border-radius:50%;background:#EAF5E7;color:#4FA23E;display:flex;align-items:center;justify-content:center;font:800 30px/1 'Archivo';margin:0 auto 22px;\">✓<\u002Fdiv>\n            <h3 style=\"font:800 24px/1.2 'Archivo';color:#142A4C;margin:0 0 10px;\">Registration received<\u002Fh3>\n            <p style=\"font:400 16px/1.6 'Public Sans';color:#64707E;margin:0 0 24px;\">Thank you — the organizing committee will be in touch with confirmation and next steps.<\u002Fp>\n            <button onclick=\"{{ reset }}\" style=\"background:#fff;border:1.5px solid #D5DBE3;color:#142A4C;font:700 15px/1 'Public Sans';padding:13px 24px;border-radius:9px;cursor:pointer;\">Submit another<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"display:flex;flex-direction:column;gap:18px;\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n              <div><label style=\"display:block;font:600 13px/1 'Public Sans';color:#142A4C;margin-bottom:8px;\">Company name<\u002Flabel><input type=\"text\" placeholder=\"PT Example Brokers\" style=\"width:100%;border:1.5px solid #E0E5EC;border-radius:9px;padding:13px 14px;font:400 15px/1 'Public Sans';color:#142A4C;outline:none;\" style-focus=\"border-color:#1C4E8F;\"><\u002Fdiv>\n              <div><label style=\"display:block;font:600 13px/1 'Public Sans';color:#142A4C;margin-bottom:8px;\">PIC name<\u002Flabel><input type=\"text\" placeholder=\"Full name\" style=\"width:100%;border:1.5px solid #E0E5EC;border-radius:9px;padding:13px 14px;font:400 15px/1 'Public Sans';color:#142A4C;outline:none;\" style-focus=\"border-color:#1C4E8F;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n              <div><label style=\"display:block;font:600 13px/1 'Public Sans';color:#142A4C;margin-bottom:8px;\">Email<\u002Flabel><input type=\"email\" placeholder=\"pic@company.com\" style=\"width:100%;border:1.5px solid #E0E5EC;border-radius:9px;padding:13px 14px;font:400 15px/1 'Public Sans';color:#142A4C;outline:none;\" style-focus=\"border-color:#1C4E8F;\"><\u002Fdiv>\n              <div><label style=\"display:block;font:600 13px/1 'Public Sans';color:#142A4C;margin-bottom:8px;\">Phone / WhatsApp<\u002Flabel><input type=\"tel\" placeholder=\"+62 ...\" style=\"width:100%;border:1.5px solid #E0E5EC;border-radius:9px;padding:13px 14px;font:400 15px/1 'Public Sans';color:#142A4C;outline:none;\" style-focus=\"border-color:#1C4E8F;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font:600 13px/1 'Public Sans';color:#142A4C;margin-bottom:10px;\">Sports of interest<\u002Flabel>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n                <sc-for list=\"{{ sportChips }}\" as=\"ch\" hint-placeholder-count=\"4\">\n                  <label style=\"display:inline-flex;align-items:center;gap:8px;border:1.5px solid #E0E5EC;border-radius:8px;padding:10px 14px;cursor:pointer;font:600 14px/1 'Public Sans';color:#44505F;\">\n                    <span style=\"width:11px;height:11px;border-radius:50%;background:{{ ch.color }};\"><\u002Fspan>{{ ch.name }}\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div><label style=\"display:block;font:600 13px/1 'Public Sans';color:#142A4C;margin-bottom:8px;\">Notes (optional)<\u002Flabel><textarea rows=\"3\" placeholder=\"Number of teams, categories, questions...\" style=\"width:100%;border:1.5px solid #E0E5EC;border-radius:9px;padding:13px 14px;font:400 15px/1.5 'Public Sans';color:#142A4C;outline:none;resize:vertical;\" style-focus=\"border-color:#1C4E8F;\"><\u002Ftextarea><\u002Fdiv>\n            <button onclick=\"{{ submit }}\" style=\"width:100%;background:#1C4E8F;color:#fff;font:700 16px/1 'Public Sans';padding:17px;border-radius:10px;border:none;cursor:pointer;\" style-hover=\"background:#163E72;\">Submit registration →<\u002Fbutton>\n            <p style=\"font:400 12.5px/1.5 'Public Sans';color:#A0AAB6;text-align:center;margin:0;\">Visual preview — submission is not connected to a server.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== FAQ ===== -->\n<section id=\"faq\" style=\"background:#F6F8FA;border-top:1px solid #E6E9EE;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"display:grid;grid-template-columns:0.8fr 1.2fr;gap:56px;align-items:start;\">\n      <div>\n        <div style=\"font:600 13px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#1C4E8F;margin-bottom:16px;\">FAQ &amp; Contact<\u002Fdiv>\n        <h2 style=\"font:800 clamp(30px,3.6vw,46px)/1.06 'Archivo';letter-spacing:-.02em;color:#142A4C;margin:0 0 24px;\">Good to know.<\u002Fh2>\n        <div style=\"background:#fff;border:1px solid #E6E9EE;border-radius:14px;padding:26px;\">\n          <div style=\"font:700 16px/1.3 'Public Sans';color:#142A4C;margin-bottom:14px;\">Organizing Committee<\u002Fdiv>\n          <div style=\"font:400 15px/1.7 'Public Sans';color:#64707E;\">APPARINDO Secretariat<br>events@apparindo.or.id<br>+62 21 0000 0000<\u002Fdiv>\n          <div style=\"height:1px;background:#EEF1F5;margin:20px 0;\"><\u002Fdiv>\n          <div style=\"font:500 13.5px/1.6 'Public Sans';color:#8A95A3;\">Compete Together. Connect Stronger.<br>Uniting members beyond business.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <details style=\"background:#fff;border:1px solid #E6E9EE;border-radius:12px;padding:20px 24px;\">\n            <summary style=\"font:700 16.5px/1.4 'Public Sans';color:#142A4C;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;\">{{ f.q }}<span style=\"color:#4FA23E;font:700 20px/1 'Public Sans';\">+<\u002Fspan><\u002Fsummary>\n            <p style=\"font:400 15px/1.65 'Public Sans';color:#64707E;margin:14px 0 0;\">{{ f.a }}<\u002Fp>\n          <\u002Fdetails>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CTA FOOTER ===== -->\n<section style=\"background:#0E2545;color:#fff;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:80px 32px;text-align:center;\">\n    <h2 style=\"font:900 clamp(34px,4.5vw,58px)/1.02 'Archivo';letter-spacing:-.03em;margin:0 0 18px;text-wrap:balance;\">Ready to represent<br>your company?<\u002Fh2>\n    <p style=\"font:400 18px/1.6 'Public Sans';color:#A9BDD8;margin:0 0 32px;\">Registration opens 1 July 2026 · 8 – 9 August 2026 · Jakarta<\u002Fp>\n    <a href=\"#register\" style=\"display:inline-flex;align-items:center;gap:10px;background:#4FA23E;color:#fff;font:700 16px/1 'Public Sans';padding:18px 34px;border-radius:10px;text-decoration:none;\">Register your company →<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid rgba(255,255,255,0.1);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:30px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;\">\n      <div style=\"background:#fff;border-radius:8px;padding:8px 12px;display:inline-flex;\"><img src=\"4999d0fd-0955-454b-8a3d-b26a70fd6860\" alt=\"APPARINDO Sports Summit\" style=\"height:34px;width:auto;display:block;\"><\u002Fdiv>\n      <div style=\"font:400 13.5px/1.5 'Public Sans';color:#8FA3C0;\">© 2026 APPARINDO · Asosiasi Perusahaan Pialang Asuransi dan Reasuransi Indonesia<\u002Fdiv>\n      <div style=\"display:flex;gap:4px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#4FA23E;\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:#1C4E8F;\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:#F3B30B;\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:#D33A2C;\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;registrationOpen&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;showLeaderboard&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;showActivations&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;spotsLeft&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 18, &quot;min&quot;: 0, &quot;max&quot;: 80, &quot;tsType&quot;: &quot;number&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { submitted: false };\n\n  initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }\n\n  renderVals(){\n    const C = { Padel:'#4FA23E', Badminton:'#1C4E8F', Bowling:'#F3B30B', Billiard:'#D33A2C' };\n    const TINT = { Padel:'#EAF5E7', Badminton:'#E8EFF8', Bowling:'#FDF3D9', Billiard:'#FBE7E5' };\n    // soft avatar background per sport (slightly deeper than tint for contrast with white initials)\n    const AV = { Padel:'#5DB14C', Badminton:'#2C63A6', Bowling:'#E0A310', Billiard:'#D5483C' };\n\n    const spotsLeft = this.props.spotsLeft ?? 18;\n    const totalSlots = 80;\n    const pct = Math.max(6, Math.round(((totalSlots - spotsLeft) / totalSlots) * 100));\n\n    const stats = [\n      { num:'4', label:'Sports' },\n      { num:'2', label:'Days' },\n      { num:'200+', label:'Athletes' },\n      { num:'Rp 80M+', label:'Total Prizes' },\n    ];\n\n    const objectives = [\n      { n:'01', t:'Strengthen Relationships', d:'Create fluid spaces for members to interact and expand professional networks beyond formal forums.' },\n      { n:'02', t:'Healthy Competition', d:'Grow sportsmanship, teamwork and mutual support across the industry.' },\n      { n:'03', t:'Deeper Engagement', d:'Build a stronger sense of belonging within the APPARINDO ecosystem.' },\n      { n:'04', t:'Cross-Company Networking', d:'Open natural collaboration opportunities throughout the event.' },\n      { n:'05', t:'Member Appreciation', d:'Celebrate participation and achievement through awards and a gala celebration.' },\n      { n:'06', t:'Progressive Positioning', d:'Show APPARINDO as an active driver of a solid professional community.' },\n    ];\n\n    const schedule = [\n      { phase:'Phase 01', title:'Promotion & Team Registration', date:'1 – 30 July', meta:'Open to all APPARINDO member companies.', color:'#4FA23E', tint:'#EAF5E7' },\n      { phase:'Day 01', title:'Racquet Day', date:'8 August', meta:'Padel & Badminton · Trinity Court, SCBD · 5 padel + 5 hybrid courts · 09:00–20:00', color:'#1C4E8F', tint:'#E8EFF8' },\n      { phase:'Day 02', title:'Precision Day', date:'9 August', meta:'Bowling & Billiard · Arjuna Bowling & Billiard · 20 lanes + 12 tables · 11:00–16:00', color:'#F3B30B', tint:'#FDF3D9' },\n      { phase:'Phase 04', title:'Event Reporting & Awards', date:'15 August', meta:'Final standings, company awards and gala celebration.', color:'#D33A2C', tint:'#FBE7E5' },\n    ];\n\n    const sports = [\n      { name:'Padel', color:C.Padel, tint:TINT.Padel, day:'Racquet Day · 8 Aug', tag:\"Men's / Women's / Mixed\", format:'Qualification groups feed a knockout bracket through to the final. Tennis counting, first to 4 then 5.', cap:'Up to 72 teams · Max 4 / company', prize:'Rp 6M / 3M / 2M' },\n      { name:'Badminton', color:C.Badminton, tint:TINT.Badminton, day:'Racquet Day · 8 Aug', tag:\"Men's / Women's / Mixed\", format:'Straight knockout system. Best of 3 games to 21 points per match.', cap:'Up to 72 teams · Max 4 / company', prize:'Rp 6M / 3M / 2M' },\n      { name:'Bowling', color:C.Bowling, tint:TINT.Bowling, day:'Precision Day · 9 Aug', tag:'Mixed Team of Four', format:'Two-game qualification, accumulated score, top-10 round. International Bowling Federation rules.', cap:'20 teams · Max 1 / company', prize:'Rp 6M / 3M / 1.5M' },\n      { name:'Billiard', color:C.Billiard, tint:TINT.Billiard, day:'Precision Day · 9 Aug', tag:'8/9-Ball · Single Elim.', format:'Group stage into single-elimination knockout. Race to 3, then 4, then 5 in the final.', cap:'48 players · Max 2 / company', prize:'Rp 5M / 2.5M / 1.25M' },\n    ];\n\n    const activations = [\n      { t:'Beat the Stars · Padel', who:'Fenita Arie & Syahnaz Sadiqah', d:'Take on the celebrity STELLAR Squad duo. Team vs team, best to 3 — beat the stars to win.', prize:'Rp 500K', color:'#4FA23E' },\n      { t:'Beat the Star · Badminton', who:'Tontowi Ahmad & Partner', d:'Challenge the 2016 Olympic mixed-doubles gold medalist. Double vs single, first to 6.', prize:'Rp 500K', color:'#1C4E8F' },\n      { t:'Strike or Out · Bowling', who:'20 players · 2 lanes', d:'One throw each between rounds. Strike to stay in — the most strikes takes the prize.', prize:'Rp 500K', color:'#F3B30B' },\n      { t:'Hit the Can & Lucky Draw', who:'All venues', d:'Target challenges, a super lucky draw and crowd activations running throughout both days.', prize:'Prizes', color:'#D33A2C' },\n    ];\n\n    const mk = (name, sport, role) => ({ name, color:C[sport], av1:AV[sport], role:role, initials:this.initials(name) });\n\n    const rawCompanies = [\n      { name:'Garda Lindung Brokers', tag:'Defending company champions', color:'#1C4E8F', mark:'GL', players:[\n        mk('Bagas Pratama','Padel',\"Padel · Men's Double\"),\n        mk('Rani Kusuma','Badminton',\"Badminton · Women's Double\"),\n        mk('Dimas Anggoro','Billiard','Billiard · Open'),\n        mk('Sari Wulandari','Bowling','Bowling · Mixed Four'),\n      ]},\n      { name:'Nusantara Risk Partners', tag:'Three sports, full roster', color:'#4FA23E', mark:'NR', players:[\n        mk('Reza Mahendra','Padel',\"Padel · Men's Double\"),\n        mk('Anita Salim','Padel','Padel · Mixed Double'),\n        mk('Yoga Saputra','Badminton',\"Badminton · Men's Double\"),\n        mk('Talita Hapsari','Bowling','Bowling · Mixed Four'),\n      ]},\n      { name:'Sentra Pialang Mandiri', tag:'Strong precision-day line-up', color:'#D33A2C', mark:'SP', players:[\n        mk('Fajar Nugroho','Billiard','Billiard · Open'),\n        mk('Mega Lestari','Badminton',\"Badminton · Women's Double\"),\n        mk('Bayu Wicaksono','Bowling','Bowling · Mixed Four'),\n        mk('Dewi Anjani','Padel','Padel · Mixed Double'),\n      ]},\n      { name:'Cakrawala Reinsurance', tag:'Racquet specialists', color:'#F3B30B', mark:'CR', players:[\n        mk('Arif Setiawan','Padel',\"Padel · Men's Double\"),\n        mk('Nadia Permata','Padel',\"Padel · Women's Double\"),\n        mk('Galih Pranata','Badminton','Badminton · Mixed Double'),\n        mk('Kirana Maharani','Billiard','Billiard · Open'),\n      ]},\n    ];\n    const companies = rawCompanies.map(c => ({ ...c, roster: c.players.length }));\n\n    const lbRaw = [\n      { name:'Garda Lindung Brokers', mark:'GL', color:'#1C4E8F', padel:28, badminton:24, bowling:18, billiard:22 },\n      { name:'Nusantara Risk Partners', mark:'NR', color:'#4FA23E', padel:26, badminton:22, bowling:20, billiard:16 },\n      { name:'Sentra Pialang Mandiri', mark:'SP', color:'#D33A2C', padel:22, badminton:26, bowling:14, billiard:18 },\n      { name:'Cakrawala Reinsurance', mark:'CR', color:'#F3B30B', padel:20, badminton:18, bowling:22, billiard:16 },\n      { name:'Prima Proteksi Indonesia', mark:'PP', color:'#1C4E8F', padel:18, badminton:20, bowling:16, billiard:14 },\n      { name:'Bahtera Asuransi Brokers', mark:'BA', color:'#4FA23E', padel:16, badminton:14, bowling:18, billiard:14 },\n      { name:'Daya Lindung Mandiri', mark:'DL', color:'#D33A2C', padel:14, badminton:16, bowling:12, billiard:16 },\n      { name:'Wahana Risk Solutions', mark:'WR', color:'#F3B30B', padel:12, badminton:12, bowling:14, billiard:12 },\n      { name:'Asia Pialang Sentosa', mark:'AP', color:'#1C4E8F', padel:10, badminton:10, bowling:12, billiard:10 },\n      { name:'Mitra Reasuransi Nusantara', mark:'MR', color:'#4FA23E', padel:8, badminton:8, bowling:10, billiard:8 },\n    ];\n    const medal = ['#F3B30B','#B8C0CC','#CD8A4B'];\n    const leaderboard = lbRaw.map((r,i) => ({\n      ...r,\n      rank: i+1,\n      total: r.padel + r.badminton
