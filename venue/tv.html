<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Venue TV · Trekkr</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Trekkr venue big-screen: live PlayRank standings, weekly leaderboard and monthly champions."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#0A0A0C; --panel:#141419; --panel-2:#1B1B21; --raise:#24242C;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#F4F4F6; --muted:#8B8B95; --faint:#5A5A63;
  --orange:#FF6A00; --grad:linear-gradient(90deg,#FF3830,#FFB000);
  --pink:#FF4E8A; --gold:#FFC24B; --silver:#CDD2DA; --bronze:#E08A4B;
  --cyan:#12C8D6;
  --w:#2FD07A; --l:#FF5A52; --live:#FF3B47;
  --display:'Saira Condensed',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}
img{max-width:100%}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:1.8vh 2.2vw;gap:1.3vh;
  background:
    radial-gradient(120% 80% at 82% -12%,rgba(255,106,0,.15),transparent 60%),
    radial-gradient(90% 70% at 0% 110%,rgba(255,78,138,.10),transparent 55%),
    var(--ink);}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;opacity:.5}

/* ---- top bar ---- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;flex-shrink:0;gap:1.5vw;position:relative;z-index:2}
.brand{display:flex;flex-direction:column;line-height:.9}
.brand.left{justify-self:start;align-items:flex-start}
.brand.right{justify-self:end;align-items:flex-end}
.brand .b1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:4.2vh;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.12em}
.brand .b2{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:2vh;
  letter-spacing:.42em;color:var(--text);margin-top:.2vh}
.center{justify-self:center;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5vh;max-width:56vw}
.center .vk{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;
  font-size:2.1vh;letter-spacing:.06em;color:var(--orange);display:flex;align-items:center;gap:.6vw}
.center .vk.livek{color:var(--live)}
.livedot{width:1.4vh;height:1.4vh;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(255,59,71,.5);animation:lp 1.5s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 rgba(255,59,71,.5)}70%{box-shadow:0 0 0 1.4vh rgba(255,59,71,0)}100%{box-shadow:0 0 0 0 rgba(255,59,71,0)}}
.center .vname{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:5.4vh;
  line-height:.86;letter-spacing:-.01em;white-space:nowrap}
.progress{width:17vw;height:.4vh;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:.6vh}
.progress i{display:block;height:100%;background:var(--grad);width:0;border-radius:999px}
.persub{font-size:1.3vh;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.persub b{color:var(--text)}

/* ---- content area ---- */
.content{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
.scene{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.scene.on{display:flex;animation:swapin .5s both}
@keyframes swapin{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scene.on{animation:none}.livedot{animation:none}}

/* ---- two-column boards (weekly + live-ish) ---- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.5vw;flex:1;min-height:0}
.cols.one{grid-template-columns:1fr;max-width:70vw;margin:0 auto;width:100%}
.col{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;overflow:hidden;min-height:0}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:1.1vh 1.5vw;border-bottom:1px solid var(--line-2)}
.col-head .side{display:flex;align-items:center;gap:.7vw}
.col-head .dot{width:1.4vh;height:1.4vh;border-radius:50%}
.col-m .dot{background:var(--orange)}.col-f .dot{background:var(--pink)}.col-live .dot{background:var(--live)}
.col-head .t{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:2.9vh;letter-spacing:-.01em}
.col-head .cnt{font-size:1.25vh;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

/* podium — top 3 */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7vw;padding:1.3vh 1vw;border-bottom:1px solid var(--line-2);align-items:stretch}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5vh;
  background:var(--panel-2);border:1px solid var(--line);border-radius:1.2vh;padding:1.4vh .5vw 1.2vh}
.col-m .pcard.c1,.col-live .pcard.c1{background:linear-gradient(180deg,rgba(255,194,75,.18),rgba(255,106,0,.05) 55%,var(--panel-2));border-color:rgba(255,194,75,.45)}
.col-f .pcard.c1{background:linear-gradient(180deg,rgba(255,194,75,.18),rgba(255,78,138,.05) 55%,var(--panel-2));border-color:rgba(255,194,75,.45)}
.pcard.c2{border-color:rgba(205,210,218,.32)}.pcard.c3{border-color:rgba(224,138,75,.32)}
.pbadge{position:absolute;top:.9vh;left:.8vw;font-family:var(--display);font-style:italic;font-weight:800;font-size:2.4vh;line-height:1}
.pcard.c1 .pbadge{color:var(--gold)}.pcard.c2 .pbadge{color:var(--silver)}.pcard.c3 .pbadge{color:var(--bronze)}
.pphoto{width:9.6vh;height:9.6vh;border-radius:50%;background:linear-gradient(140deg,var(--raise),var(--panel));
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:800;
  font-size:3.7vh;overflow:hidden;color:var(--text);border:2px solid var(--line-2)}
.pcard.c1 .pphoto{border-color:var(--gold);box-shadow:0 0 0 .5vh rgba(255,194,75,.12)}
.pcard.c2 .pphoto{border-color:var(--silver)}.pcard.c3 .pphoto{border-color:var(--bronze)}
.pphoto img{width:100%;height:100%;object-fit:cover;display:block}
.pnm{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;line-height:.92;font-size:2.5vh;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pverified{color:var(--orange);font-size:1.4vh;margin-left:.2vw}
.pstats{display:flex;align-items:baseline;justify-content:center;gap:1vw;margin-top:.2vh}
.pwl{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.2vh}
.pwl .w{color:var(--w)}.pwl .s{color:var(--faint);margin:0 .08em}.pwl .l{color:var(--l)}
.pelo{display:flex;align-items:baseline;gap:.35vw}
.pelo .v{font-family:var(--display);font-style:italic;font-weight:800;color:var(--orange);font-size:3vh}
.pelo .d{font-size:1.25vh;font-weight:800;color:var(--w)}.pelo .d.dn{color:var(--l)}

/* list rows */
.rows{flex:1;display:flex;flex-direction:column;min-height:0}
.trow{display:grid;grid-template-columns:3.2vw 1fr 5.5vw 7vw;align-items:center;gap:.8vw;padding:0 1.5vw;
  border-top:1px solid var(--line);flex:1;min-height:0}
.trow:first-child{border-top:0}
.trow .rk{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.6vh;color:var(--faint)}
.trow .pl{display:flex;align-items:center;gap:.9vw;min-width:0}
.trow .av{width:5vh;height:5vh;border-radius:1vh;background:linear-gradient(140deg,var(--raise),var(--panel-2));
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:800;
  font-size:2.1vh;flex-shrink:0;overflow:hidden;border:1px solid var(--line-2);color:var(--text)}
.trow .av img{width:100%;height:100%;object-fit:cover;display:block}
.trow .who{min-width:0}
.trow .pn{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:2.3vh;line-height:.98;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .verified{color:var(--orange);font-size:1.3vh;margin-left:.2vw}
.trow .sub{font-size:1.1vh;color:var(--muted);font-weight:600;margin-top:.2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .sub .pos{color:var(--w)}.trow .sub .neg{color:var(--l)}
.trow .wl{text-align:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:2.2vh}
.trow .wl .w{color:var(--w)}.trow .wl .s{color:var(--faint);margin:0 .1em}.trow .wl .l{color:var(--l)}
.trow .eloc{text-align:right;display:flex;align-items:baseline;justify-content:flex-end;gap:.4vw}
.trow .eloc .v{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.9vh;color:var(--orange)}
.trow .eloc .d{font-size:1.25vh;font-weight:800;color:var(--w)}.trow .eloc .d.dn{color:var(--l)}
.col-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:1.5vh;padding:2vh;text-align:center}

/* ---- LIVE scene: on-court + standings ---- */
.livewrap{display:grid;grid-template-columns:1.05fr 1fr;gap:1.5vw;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:1.1vh 1.4vw;border-bottom:1px solid var(--line-2)}
.panel-h .t{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:2.6vh}
.panel-h .cnt{font-size:1.2vh;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.courts{flex:1;min-height:0;display:flex;flex-direction:column;gap:1vh;padding:1.2vh 1.2vw;overflow:hidden}
.court{background:var(--panel-2);border:1px solid var(--line);border-radius:1.1vh;padding:1vh 1.1vw}
.court-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7vh}
.court-top .ct{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:1.7vh;color:var(--cyan);letter-spacing:.06em}
.court-top .fm{font-size:1.15vh;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.side2{display:flex;align-items:center;gap:.7vw;padding:.35vh 0}
.side2 .av{width:4.4vh;height:4.4vh;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--line-2);
  background:linear-gradient(140deg,var(--raise),var(--panel));display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-style:italic;font-weight:800;font-size:1.7vh;color:var(--text)}
.side2 .av img{width:100%;height:100%;object-fit:cover}
.side2 .nm{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:1.9vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.court-vs{display:flex;align-items:center;gap:.7vw;margin:.4vh 0}
.court-vs .ln{flex:1;height:1px;background:var(--line-2)}
.court-vs .v{font-family:var(--display);font-style:italic;font-weight:800;color:var(--faint);font-size:1.5vh}
.probbar{height:1vh;border-radius:999px;background:var(--panel);overflow:hidden;display:flex;margin-top:.7vh;border:1px solid var(--line)}
.probbar .a{background:linear-gradient(90deg,var(--orange),#FF9A4D)}
.probbar .b{background:linear-gradient(90deg,#1FB6C4,var(--cyan))}
.problab{display:flex;justify-content:space-between;font-size:1.1vh;font-weight:800;margin-top:.45vh}
.problab .a{color:#FFB27A}.problab .b{color:#8FE7EF}
.take{margin-top:.55vh;font-size:1.2vh;color:var(--muted);font-weight:600;line-height:1.35}
.take b{color:var(--text)}
.byline{padding:.8vh 1.2vw;font-size:1.2vh;color:var(--muted);font-weight:600;border-top:1px solid var(--line)}
.byline b{color:var(--text)}
/* live standings rows inside panel */
.lrows{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lrow{display:grid;grid-template-columns:3vw 1fr auto auto;align-items:center;gap:.8vw;padding:0 1.3vw;border-top:1px solid var(--line);flex:1;min-height:0}
.lrow:first-child{border-top:0}
.lrow.top{background:linear-gradient(90deg,rgba(255,194,75,.09),transparent 60%)}
.lrow .rk{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.3vh;color:var(--faint)}
.lrow.r1 .rk{color:var(--gold)}.lrow.r2 .rk{color:var(--silver)}.lrow.r3 .rk{color:var(--bronze)}
.lrow .av{width:5vh;height:5vh;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--line-2);
  background:linear-gradient(140deg,var(--raise),var(--panel-2));display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-style:italic;font-weight:800;font-size:1.9vh;color:var(--text)}
.lrow.r1 .av{border-color:var(--gold)}.lrow.r2 .av{border-color:var(--silver)}.lrow.r3 .av{border-color:var(--bronze)}
.lrow .av img{width:100%;height:100%;object-fit:cover}
.lrow .pl{display:flex;align-items:center;gap:.9vw;min-width:0}
.lrow .pn{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:2.2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .strk{font-size:1.15vh;color:var(--orange);font-weight:800;margin-top:.1vh}
.lrow .wl{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.1vh;text-align:right}
.lrow .wl .w{color:var(--w)}.lrow .wl .s{color:var(--faint);margin:0 .1em}.lrow .wl .l{color:var(--l)}
.lrow .el{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.5vh;color:var(--orange);text-align:right;min-width:6vw}

/* ---- PODIUM / champion scene ---- */
.champ{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.4vh}
.recapbar{text-align:center}
.recapbar .rh{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:5.2vh;line-height:.9;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.recapbar .rl{font-size:1.9vh;color:var(--muted);font-weight:600;margin-top:.9vh;max-width:72vw;margin-left:auto;margin-right:auto;line-height:1.4}
.recapbar .rl b{color:var(--text)}
.bigpod{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:1.2vw;align-items:end}
.bp{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  background:linear-gradient(180deg,var(--panel),#101014);border:1px solid var(--line);border-radius:1.8vh;padding:2.4vh 1vw 2vh;overflow:hidden}
.bp.s1{height:82%}.bp.s2{height:100%}.bp.s3{height:76%}
.bp.s2{background:linear-gradient(180deg,rgba(255,194,75,.16),rgba(255,106,0,.05) 45%,#12100c);border-color:rgba(255,194,75,.5);
  animation:summit 3s ease-in-out infinite}
@keyframes summit{0%,100%{box-shadow:0 0 0 0 rgba(255,194,75,0)}50%{box-shadow:0 2.2vh 5vh -2.4vh rgba(255,160,0,.45)}}
@media(prefers-reduced-motion:reduce){.bp.s2{animation:none}}
.bp .medal{font-size:4.4vh;line-height:1}
.bp .bphoto{width:15vh;height:15vh;border-radius:50%;overflow:hidden;margin-top:.8vh;border:.4vh solid var(--line-2);
  background:linear-gradient(140deg,var(--raise),var(--panel));display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-style:italic;font-weight:800;font-size:6vh;color:var(--text)}
.bp.s2 .bphoto{width:18vh;height:18vh;border-color:var(--gold);box-shadow:0 0 0 .7vh rgba(255,194,75,.14)}
.bp.s1 .bphoto{border-color:var(--silver)}.bp.s3 .bphoto{border-color:var(--bronze)}
.bp .bphoto img{width:100%;height:100%;object-fit:cover}
.bp .bnm{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:3.4vh;line-height:.92;margin-top:1vh;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bp.s2 .bnm{font-size:4.2vh;background:linear-gradient(90deg,var(--gold),#FF8A00);-webkit-background-clip:text;background-clip:text;color:transparent}
.bp .brec{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.4vh;color:var(--muted);margin-top:.5vh}
.bp .brec .w{color:var(--w)}.bp .brec .l{color:var(--l)}
.bp .bdl{font-family:var(--mono);font-weight:700;font-size:1.7vh;margin-top:.6vh;color:var(--w)}
.bp .bdl.dn{color:var(--l)}
.bp .tag{margin-top:.7vh;font-size:1.3vh;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.bp.s2 .tag{color:var(--gold)}
.finalstrip{flex-shrink:0;display:flex;gap:.7vw;flex-wrap:nowrap;overflow:hidden}
.fchip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:1vh;padding:.7vh .9vw;display:flex;align-items:center;gap:.7vw;min-width:0}
.fchip .rk{font-family:var(--display);font-style:italic;font-weight:800;color:var(--faint);font-size:2vh}
.fchip .nm{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:1.7vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.fchip .wl{font-family:var(--display);font-style:italic;font-weight:800;font-size:1.7vh}.fchip .wl .w{color:var(--w)}.fchip .wl .l{color:var(--l)}

/* ---- MONTHLY hero scene (wins / loyal) ---- */
.heros{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1.5vw}
.hero{position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel),#0e0e12);
  border:1px solid var(--line);border-radius:1.8vh;overflow:hidden;min-height:0}
.hero.m{border-color:rgba(255,106,0,.3)}.hero.f{border-color:rgba(255,78,138,.3)}
.hero-h{display:flex;align-items:center;gap:.7vw;padding:1vh 1.4vw;border-bottom:1px solid var(--line-2)}
.hero-h .dot{width:1.3vh;height:1.3vh;border-radius:50%}.hero.m .hero-h .dot{background:var(--orange)}.hero.f .hero-h .dot{background:var(--pink)}
.hero-h .t{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:2.3vh}
.hero-body{flex:1;min-height:0;display:flex;align-items:center;gap:1.6vw;padding:1.6vh 1.6vw}
.hero-photo{width:22vh;height:22vh;border-radius:2vh;overflow:hidden;flex-shrink:0;border:.4vh solid var(--gold);
  box-shadow:0 0 0 .7vh rgba(255,194,75,.12);background:linear-gradient(140deg,var(--raise),var(--panel));
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:8vh;color:var(--text)}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-info{min-width:0;display:flex;flex-direction:column;gap:.3vh}
.hero-crown{font-size:2.4vh}
.hero-name{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:5.2vh;line-height:.9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.hero-big{display:flex;align-items:baseline;gap:.5vw;margin-top:.5vh}
.hero-big .n{font-family:var(--display);font-style:italic;font-weight:800;font-size:6.5vh;line-height:.85;
  background:linear-gradient(90deg,var(--gold),#FF8A00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-big .u{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:2.4vh;color:var(--muted)}
.hero-sub{font-size:1.5vh;color:var(--muted);font-weight:600;margin-top:.5vh}.hero-sub b{color:var(--text)}
.hero-cap{font-size:1.5vh;color:var(--faint);font-weight:600;line-height:1.4;margin-top:.9vh;max-width:34vw}
.hero-runners{display:flex;gap:.5vw;margin-top:1vh;flex-wrap:wrap}
.runner{display:flex;align-items:center;gap:.5vw;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:.35vh .8vw}
.runner .av{width:3vh;height:3vh;border-radius:50%;overflow:hidden;border:1px solid var(--line-2);background:var(--raise);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:1.2vh}
.runner .av img{width:100%;height:100%;object-fit:cover}
.runner .rn{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:1.5vh}
.runner .rv{font-family:var(--mono);font-weight:700;font-size:1.3vh;color:var(--orange)}
.hero-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:1.6vh;text-align:center;padding:2vh}

/* ---- bottom: schedule + register QR ---- */
.footer{display:grid;grid-template-columns:1fr auto;gap:1.4vw;flex-shrink:0;position:relative;z-index:2}
.footer.hide{display:none}
.sched{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:1vh 1.4vw;display:flex;align-items:center;gap:1.4vw}
.sched-head{display:flex;flex-direction:column;gap:.35vh;flex-shrink:0}
.sched-head .eyebrow{font-family:var(--display);font-style:italic;font-weight:800;font-size:2.6vh;line-height:.9;
  letter-spacing:.02em;text-transform:uppercase;color:var(--orange)}
.sched-head .sv{font-size:1.2vh;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.days{display:flex;gap:.6vw;flex-wrap:nowrap;flex:1;justify-content:flex-end}
.day{display:flex;flex-direction:column;gap:.15vh;background:var(--panel-2);border:1px solid var(--line-2);
  border-left:.3vh solid var(--orange);border-radius:.7vh;padding:.55vh .8vw;min-width:0}
.day .dn{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:1.7vh;line-height:.9}
.day .dt{font-size:1.1vh;color:var(--text);font-weight:700;white-space:nowrap}
.day.off{opacity:.26;border-left-color:var(--faint)}
.day.off .dt{color:var(--muted);font-weight:600}
.days-empty{color:var(--faint);font-size:1.3vh;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.reg{background:linear-gradient(150deg,rgba(255,106,0,.14),var(--panel) 60%);border:1px solid rgba(255,106,0,.3);
  border-radius:1.2vh;padding:.85vh 1.1vw;display:flex;align-items:center;gap:.9vw}
.qrbox{background:#fff;border-radius:.7vh;padding:.55vh;flex-shrink:0;line-height:0}
.qrbox canvas{width:8vh;height:8vh;display:block;image-rendering:pixelated}
.rtx{display:flex;flex-direction:column;gap:.25vh}
.rtx .rk2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:2.3vh;line-height:.9;color:var(--orange)}
.rtx .rd{font-size:1.2vh;color:var(--text);font-weight:600;line-height:1.25;max-width:12vw}
.rtx .rurl{font-size:1.05vh;color:var(--muted);font-weight:700;letter-spacing:.03em}
.rtx .rurl i{color:var(--orange);font-style:normal}

/* italic glyph overhang guard */
.brand .b2,.center .vk,.center .vname,.col-head .t,.panel-h .t,
.pbadge,.pnm,.pwl,.pelo .v,.trow .rk,.trow .pn,.trow .wl,.trow .eloc .v,
.lrow .pn,.lrow .wl,.lrow .el,.recapbar .rh,.bp .bnm,.bp .brec,.bp .tag,
.hero-h .t,.hero-name,.hero-big .n,.hero-big .u,.runner .rn,
.sched-head .eyebrow,.day .dn,.rtx .rk2{padding-right:.16em}

.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--ink);
  font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;color:var(--muted);
  font-size:3vh;letter-spacing:.02em;transition:opacity .4s}
.boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="stage">
  <div class="topbar">
    <div class="brand left"><span class="b1">Trekkr</span><span class="b2">League</span></div>
    <div class="center">
      <div class="vk" id="eyebrow">Loading</div>
      <div class="vname" id="vname">—</div>
      <div class="progress"><i id="prog"></i></div>
      <div class="persub" id="persub">&nbsp;</div>
    </div>
    <div class="brand right"><span class="b1">Trekkr</span><span class="b2">League</span></div>
  </div>

  <div class="content" id="content"></div>

  <div class="footer" id="footer">
    <div class="sched">
      <div class="sched-head"><span class="eyebrow">PlayRank Schedule</span><span class="sv" id="schedVenue">—</span></div>
      <div class="days" id="days"></div>
    </div>
    <div class="reg">
      <div class="qrbox"><canvas id="qr" width="260" height="260"></canvas></div>
      <div class="rtx">
        <div class="rk2">Join</div>
        <div class="rd" id="regDesc">Scan to join PlayRank</div>
        <div class="rurl" id="regUrl">&nbsp;</div>
      </div>
    </div>
  </div>
</div>

<div class="boot" id="boot">Loading venue&hellip;</div>

<script src="/qrcode.js"></script>
<script>
(function(){
  var BASE = (location.hostname==='trekkr.online'||(location.hostname.endsWith('.vercel.app')&&location.hostname.startsWith('trekkrgit'))) ? '/api' : 'https://trekkr.online/api';

  /* ---------- helpers ---------- */
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
  function initials(n){var p=String(n||'').trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
  function first(n){return String(n||'').split(' ')[0];}
  function fetchJSON(url){return fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){return r.json();});}
  function photoInner(url,name){
    if(url)return '<img src="'+esc(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\''+esc(initials(name)).replace(/'/g,'')+'\'"/>';
    return esc(initials(name));
  }
  function delta(d){if(d==null||isNaN(d))return '';var dn=d<0;return '<span class="d'+(dn?' dn':'')+'">'+(dn?'▾':'▴')+Math.abs(d)+'</span>';}
  function weekLabel(w){w=String(w||'');return w?w.replace(/^W/i,'Week '):'';}

  /* ---------- prediction (ELO + form) for live matchups ---------- */
  function formAdj(p){var m=(p.w||0)+(p.l||0);if(!m)return 0;var wr=(p.w||0)/m;var base=(wr-0.5)*160;var st=Math.max(0,Math.min(4,p.streak||0))*12;return (base+st)*Math.min(1,m/4);}
  function eff(p){return (p.elo||1350)+formAdj(p);}
  function winPct(A,B){var ea=(eff(A[0])+eff(A[1]))/2,eb=(eff(B[0])+eff(B[1]))/2;return 1/(1+Math.pow(10,(eb-ea)/400));}
  function take(A,B,pa){
    var fav=pa>=.5?A:B, pct=Math.round((pa>=.5?pa:1-pa)*100);
    var favN=fav.map(function(p){return first(p.name);}).join(' & ');
    var dog=pa>=.5?B:A, hot=dog.filter(function(p){return (p.streak||0)>=2;})[0];
    if(pct<=54) return 'Coin-flip — anyone\'s game.';
    if(hot) return 'Model likes <b>'+esc(favN)+'</b> at <b>'+pct+'%</b>, but '+esc(first(hot.name))+' is on a <b>'+hot.streak+'-win heater</b> 🔥';
    if(pct>=68) return '<b>'+esc(favN)+'</b> favoured at <b>'+pct+'%</b> — on paper.';
    return 'Edge to <b>'+esc(favN)+'</b> (<b>'+pct+'%</b>). One break flips it.';
  }

  /* ---------- state ---------- */
  var VENUE={name:'',region:'',registerUrl:'',schedule:''};
  var SLUG=(function(){
    var segs=location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
    if(segs.length){
      var last=segs[segs.length-1].toLowerCase();
      if(last==='tv'&&segs.length>=2)return segs[segs.length-2];
      if(last!=='tv'&&!/\.html?$/i.test(last)&&last!=='venue'&&last!=='venues')return segs[segs.length-1];
    }
    return new URLSearchParams(location.search).get('v')||'';
  })();
  var LIVE=null, WEEKLY=null, MONTHLY=null;
  var DAY_ORDER=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
  var DAY_ABBR={Senin:'Mon',Selasa:'Tue',Rabu:'Wed',Kamis:'Thu',Jumat:'Fri',Sabtu:'Sat',Minggu:'Sun'};
  var DAY_ALIAS={sen:'Senin',senin:'Senin',mon:'Senin',monday:'Senin',
    sel:'Selasa',selasa:'Selasa',tue:'Selasa',tuesday:'Selasa',
    rab:'Rabu',rabu:'Rabu',wed:'Rabu',wednesday:'Rabu',
    kam:'Kamis',kamis:'Kamis',thu:'Kamis',thursday:'Kamis',
    jum:'Jumat',jumat:'Jumat',fri:'Jumat',friday:'Jumat',
    sab:'Sabtu',sabtu:'Sabtu',sat:'Sabtu',saturday:'Sabtu',
    min:'Minggu',minggu:'Minggu',sun:'Minggu',sunday:'Minggu'};

  /* ---------- schedule + QR (footer) ---------- */
  function parseSchedule(raw){
    var map={};
    String(raw||'').split(/[,;\n]+/).forEach(function(part){
      var m=part.trim().match(/^([A-Za-z]+)\s+(.+)$/);if(!m)return;
      var day=DAY_ALIAS[m[1].toLowerCase()];if(!day)return;
      map[day]=m[2].trim().replace(/\s*[-–]\s*/,' – ');
    });
    return DAY_ORDER.map(function(day){return {day:day,time:map[day]||''};});
  }
  function renderSchedule(){
    $('schedVenue').textContent=VENUE.name||'';
    if(!VENUE.schedule){ $('days').innerHTML='<span class="days-empty">Schedule coming soon</span>'; return; }
    $('days').innerHTML=parseSchedule(VENUE.schedule).map(function(s){
      var off=!s.time;
      return '<div class="day'+(off?' off':'')+'"><span class="dn">'+esc(DAY_ABBR[s.day])+'</span><span class="dt">'+esc(off?'—':s.time)+'</span></div>';
    }).join('');
  }
  function registerLink(){return VENUE.registerUrl||('https://venue.trekkr.online/'+encodeURIComponent(SLUG||slug(VENUE.name)));}
  function drawQR(text){
    var c=$('qr');if(!c)return;var ctx=c.getContext('2d');var size=c.width;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
    if(typeof qrcode==='undefined')return;
    try{var qr=qrcode(0,'M');qr.addData(text);qr.make();var n=qr.getModuleCount(),quiet=2,px=Math.floor(size/(n+quiet*2));if(px<1)px=1;var off=Math.floor((size-px*n)/2);ctx.fillStyle='#000';for(var r=0;r<n;r++)for(var col=0;col<n;col++){if(qr.isDark(r,col))ctx.fillRect(off+col*px,off+r*px,px,px);}}catch(e){}
  }
  function renderRegister(){
    $('regDesc').textContent='Scan to join PlayRank'+(VENUE.name?' at '+VENUE.name:'');
    $('regUrl').innerHTML='venue.trekkr.online/<i>'+esc(SLUG||slug(VENUE.name))+'</i>';
    drawQR(registerLink());
  }

  /* ---------- scene renderers ---------- */
  function sortStd(a){return a.slice().sort(function(x,y){return (y.w-x.w)||(y.pd-x.pd)||(y.elo-x.elo);});}
  function nm(p){return p.displayName||p.name;}

  // LIVE (single-gender session): on-court predictions + live standings
  function sceneLive(){
    var d=(LIVE&&LIVE.session)||{}, players=d.players||[];
    var byKey={}; players.forEach(function(p){byKey[p.name]=p;if(p.short)byKey[p.short]=p;});
    function look(k){return byKey[k]||{name:k,elo:1350,w:0,l:0,streak:0};}
    var now=(d.now||[]).map(function(m){return {court:m.court,a:(m.a||[]).map(look),b:(m.b||[]).map(look)};}).filter(function(m){return m.a.length>=2&&m.b.length>=2;});
    var tgt=d.scoreTarget?('Race to '+d.scoreTarget):'Live';
    var courtsHtml=now.map(function(m){
      var pa=winPct(m.a,m.b),pA=Math.round(pa*100),pB=100-pA;
      function side(t){return t.map(function(p){return '<div class="side2"><span class="av">'+photoInner(p.photoUrl,p.name)+'</span><span class="nm">'+esc(first(nm(p)))+'</span></div>';}).join('');}
      return '<div class="court"><div class="court-top"><span class="ct">Court '+esc(m.court||'')+'</span><span class="fm">'+esc(tgt)+'</span></div>'
        +side(m.a)+'<div class="court-vs"><span class="ln"></span><span class="v">VS</span><span class="ln"></span></div>'+side(m.b)
        +'<div class="probbar"><span class="a" style="width:'+pA+'%"></span><span class="b" style="width:'+pB+'%"></span></div>'
        +'<div class="problab"><span class="a">'+esc(m.a.map(function(p){return first(nm(p));}).join(' & '))+' · '+pA+'%</span><span class="b">'+pB+'% · '+esc(m.b.map(function(p){return first(nm(p));}).join(' & '))+'</span></div>'
        +'<div class="take">'+take(m.a,m.b,pa)+'</div></div>';
    }).join('');
    var bye=(d.bye||[]).map(function(k){return esc(first(nm(look(k))));});
    var byeHtml=bye.length?'<div class="byline">⏸ Resting this round: <b>'+bye.join(', ')+'</b></div>':'';
    var std=sortStd(players);
    var rowsHtml=std.map(function(p,i){
      var rc=i===0?'r1':i===1?'r2':i===2?'r3':'';
      var strk=(p.streak||0)>=2?'<div class="strk">'+p.streak+'W 🔥</div>':'';
      return '<div class="lrow '+(i<3?'top ':'')+rc+'"><span class="rk">'+(i+1)+'</span>'
        +'<span class="pl"><span class="av">'+photoInner(p.photoUrl,p.name)+'</span><span class="who"><div class="pn">'+esc(first(nm(p)))+'</div>'+strk+'</span></span>'
        +'<span class="wl"><span class="w">'+(p.w||0)+'</span><span class="s">/</span><span class="l">'+(p.l||0)+'</span></span>'
        +'<span class="el">'+(p.elo||'')+'</span></div>';
    }).join('');
    return '<div class="livewrap">'
      +'<div class="panel"><div class="panel-h"><span class="t">On Court Now</span><span class="cnt">'+now.length+(now.length===1?' match':' matches')+'</span></div>'
        +'<div class="courts">'+(courtsHtml||'<div class="col-empty">Next round loading…</div>')+'</div>'+byeHtml+'</div>'
      +'<div class="panel"><div class="panel-h"><span class="t">Live Standings</span><span class="cnt">by wins</span></div>'
        +'<div class="lrows">'+(rowsHtml||'<div class="col-empty">Waiting for the first scores…</div>')+'</div></div>'
      +'</div>';
  }

  // PODIUM / champions (final within celebrate window)
  function scenePodium(){
    var d=(LIVE&&LIVE.session)||{}, recap=(LIVE&&LIVE.recap)||null, s=sortStd(d.players||[]);
    var rh=recap&&recap.headline?esc(recap.headline):'Champions Crowned';
    var rl=recap&&recap.line?esc(recap.line):'That\'s a wrap on today\'s PlayRank session.';
    var med=['🥈','🥇','🥉'], stg=['s1','s2','s3'], tags=['Runner-up','Champion','Third'];
    var pods=[s[1],s[0],s[2]].map(function(p,idx){
      if(!p)return '<div class="bp '+stg[idx]+'" style="visibility:hidden"></div>';
      var dl=(p.elo||0)-(p.start||p.elo||0);
      return '<div class="bp '+stg[idx]+'"><div class="medal">'+med[idx]+'</div>'
        +'<div class="bphoto">'+photoInner(p.photoUrl,p.name)+'</div>'
        +'<div class="bnm">'+esc(first(nm(p)))+'</div>'
        +'<div class="brec"><span class="w">'+(p.w||0)+'</span>–<span class="l">'+(p.l||0)+'</span></div>'
        +'<div class="bdl '+(dl>=0?'':'dn')+'">'+(dl>=0?'+':'')+dl+' ELO</div>'
        +'<div class="tag">'+tags[idx]+'</div></div>';
    }).join('');
    var rest=s.slice(3,7).map(function(p,i){
      return '<div class="fchip"><span class="rk">'+(i+4)+'</span><span class="nm">'+esc(first(nm(p)))+'</span><span class="wl"><span class="w">'+(p.w||0)+'</span>–<span class="l">'+(p.l||0)+'</span></span></div>';
    }).join('');
    return '<div class="champ"><div class="recapbar"><div class="rh">'+rh+'</div><div class="rl">'+rl+'</div></div>'
      +'<div class="bigpod">'+pods+'</div>'
      +(rest?'<div class="finalstrip">'+rest+'</div>':'')+'</div>';
  }

  // WEEKLY (Men's / Women's, no tiers)
  function podCard(p,i){
    if(!p)return '<div class="pcard c'+(i+1)+'" style="visibility:hidden"></div>';
    return '<div class="pcard c'+(i+1)+'"><span class="pbadge">'+(i+1)+'</span>'
      +'<span class="pphoto">'+photoInner(p.photoUrl,p.name)+'</span>'
      +'<span class="pnm">'+esc(nm(p))+(p.verified?'<i class="pverified">✔</i>':'')+'</span>'
      +'<span class="pstats"><span class="pwl"><span class="w">'+p.w+'</span><span class="s">/</span><span class="l">'+p.l+'</span></span>'
      +'<span class="pelo"><span class="v">'+p.elo+'</span></span></span></div>';
  }
  function listRow(p,rank){
    var pos=p.pd>0,neg=p.pd<0;
    return '<div class="trow"><span class="rk">'+rank+'</span>'
      +'<span class="pl"><span class="av">'+photoInner(p.photoUrl,p.name)+'</span>'
        +'<span class="who"><div class="pn">'+esc(nm(p))+(p.verified?'<i class="verified">✔</i>':'')+'</div>'
        +'<div class="sub"><span class="'+(pos?'pos':neg?'neg':'')+'">'+(pos?'+':'')+(p.pd||0)+' diff</span>'+(p.region?' · '+esc(p.region):'')+'</div></span></span>'
      +'<span class="wl"><span class="w">'+p.w+'</span><span class="s">/</span><span class="l">'+p.l+'</span></span>'
      +'<span class="eloc"><span class="v">'+p.elo+'</span></span></div>';
  }
  function weeklyCol(g,label){
    var list=((WEEKLY&&WEEKLY[g])||[]).slice(0,8);
    var pod=[0,1,2].map(function(i){return podCard(list[i],i);}).join('');
    var rest=list.slice(3);
    var rows=rest.length?rest.map(function(p,i){return listRow(p,i+4);}).join(''):'<div class="col-empty">Spots 4–8 open this week</div>';
    return '<div class="col col-'+(g==='M'?'m':'f')+'"><div class="col-head"><div class="side"><span class="dot"></span><span class="t">'+label+'</span></div>'
      +'<span class="cnt">'+list.length+' player'+(list.length===1?'':'s')+'</span></div>'
      +'<div class="podium">'+pod+'</div><div class="rows">'+(list.length?rows:'<div class="col-empty">No players yet this week</div>')+'</div></div>';
  }
  function sceneWeekly(){return '<div class="cols">'+weeklyCol('M',"Men's")+weeklyCol('F',"Women's")+'</div>';}

  // MONTHLY hero (kind='wins' | 'loyal')
  function heroCard(g,label,kind){
    var arr=(MONTHLY&&MONTHLY[kind==='wins'?'wins':'loyal']&&MONTHLY[kind==='wins'?'wins':'loyal'][g])||[];
    var champ=arr[0];
    var cls='hero '+(g==='M'?'m':'f');
    if(!champ) return '<div class="'+cls+'"><div class="hero-h"><span class="dot"></span><span class="t">'+label+'</span></div><div class="hero-empty">No '+label.toLowerCase()+' champion yet this month</div></div>';
    var bigN, bigU, sub, cap;
    if(kind==='wins'){
      bigN=champ.wins; bigU='wins';
      sub='<b>'+champ.played+'</b> matches · <b>'+champ.days+'</b> day'+(champ.days===1?'':'s')+' on court';
      cap='The most dominant '+(g==='M'?'man':'woman')+' at '+esc(VENUE.name)+' this month — nobody won more.';
    }else{
      bigN=champ.days; bigU=champ.days===1?'day':'days';
      sub='<b>'+champ.played+'</b> matches played · <b>'+champ.wins+'</b> wins';
      cap='Shows up, racks up. The heartbeat of PlayRank at '+esc(VENUE.name)+' this month.';
    }
    var runners=arr.slice(1,4).map(function(p){
      var v=kind==='wins'?(p.wins+'W'):(p.days+'d');
      return '<div class="runner"><span class="av">'+photoInner(p.photoUrl,p.name)+'</span><span class="rn">'+esc(first(nm(p)))+'</span><span class="rv">'+v+'</span></div>';
    }).join('');
    return '<div class="'+cls+'"><div class="hero-h"><span class="dot"></span><span class="t">'+label+'</span></div>'
      +'<div class="hero-body"><div class="hero-photo">'+photoInner(champ.photoUrl,champ.name)+'</div>'
      +'<div class="hero-info"><div class="hero-crown">👑</div>'
        +'<div class="hero-name">'+esc(nm(champ))+(champ.verified?'<i class="pverified">✔</i>':'')+'</div>'
        +'<div class="hero-big"><span class="n">'+bigN+'</span><span class="u">'+bigU+'</span></div>'
        +'<div class="hero-sub">'+sub+'</div>'
        +'<div class="hero-cap">'+cap+'</div>'
        +(runners?'<div class="hero-runners">'+runners+'</div>':'')
      +'</div></div></div>';
  }
  function sceneMonthly(kind){
    return '<div class="heros">'+heroCard('M',"Men's",kind)+heroCard('F',"Women's",kind)+'</div>';
  }

  /* ---------- scene controller ---------- */
  var content=$('content'), footer=$('footer'), prog=$('prog');
  var curScene=null, sceneStart=0, curQueue='';
  var DUR={weekly:16000, wins:14000, loyal:14000, live:9e9, podium:9e9};
  function heroHas(kind){var m=MONTHLY;if(!m)return false;var w=m[kind==='wins'?'wins':'loyal']||{};return ((w.M&&w.M.length)||(w.F&&w.F.length));}
  function desiredQueue(){
    if(LIVE&&LIVE.active){ return [ LIVE.phase==='celebrate'?'podium':'live' ]; }
    var q=['weekly'];
    if(heroHas('wins')) q.push('wins');
    if(heroHas('loyal')) q.push('loyal');
    return q;
  }
  function headerFor(scene){
    var live=(scene==='live'||scene==='podium');
    footer.classList.toggle('hide', live);
    if(scene==='live'){
      var d=(LIVE&&LIVE.session)||{};
      $('eyebrow').className='vk livek'; $('eyebrow').innerHTML='<span class="livedot"></span> Live Now · PlayRank';
      $('persub').innerHTML=(d.round?'Round <b>'+esc(d.round)+'</b> · ':'')+(d.gender?esc(d.gender==='F'?"Women's":"Men's")+' · ':'')+'<b>'+(((d.players||[]).length))+'</b> players';
    }else if(scene==='podium'){
      $('eyebrow').className='vk'; $('eyebrow').textContent='★ Session Complete';
      $('persub').innerHTML='PlayRank results · <b>'+esc(VENUE.name)+'</b>';
    }else if(scene==='weekly'){
      $('eyebrow').className='vk'; $('eyebrow').textContent='This Week · Top Players';
      $('persub').innerHTML=(WEEKLY&&WEEKLY.week?esc(weekLabel(WEEKLY.week))+' · ':'')+'<b>Ranked by wins</b>';
    }else if(scene==='wins'){
      $('eyebrow').className='vk'; $('eyebrow').textContent='Most Wins · '+((MONTHLY&&MONTHLY.monthLabel)||'This Month');
      $('persub').innerHTML='<b>Champions of the month</b> · the players who won it all';
    }else if(scene==='loyal'){
      $('eyebrow').className='vk'; $('eyebrow').textContent='Most Loyal · '+((MONTHLY&&MONTHLY.monthLabel)||'This Month');
      $('persub').innerHTML='<b>Never miss a night</b> · our most dedicated players';
    }
  }
  function renderScene(scene){
    var html = scene==='live'?sceneLive() : scene==='podium'?scenePodium() : scene==='weekly'?sceneWeekly()
      : scene==='wins'?sceneMonthly('wins') : scene==='loyal'?sceneMonthly('loyal') : '';
    content.innerHTML='<div class="scene on">'+html+'</div>';
    headerFor(scene);
  }
  function tick(){
    var q=desiredQueue(), qs=q.join(',');
    var now=Date.now();
    if(qs!==curQueue){ curQueue=qs; window._si=0; curScene=q[0]; sceneStart=now; renderScene(curScene); }
    else{
      var dur=DUR[curScene]||14000;
      if(now-sceneStart>=dur && q.length>1){
        window._si=((window._si||0)+1)%q.length; curScene=q[window._si]; sceneStart=now; renderScene(curScene);
      }
    }
    var dur2=DUR[curScene]||14000;
    prog.style.width = dur2>1e8 ? '100%' : Math.min(100,(now-sceneStart)/dur2*100).toFixed(1)+'%';
    requestAnimationFrame(tick);
  }

  /* ---------- data loaders ---------- */
  function loadVenue(){
    return fetchJSON(BASE+'/venues').then(function(res){
      var venues=(res&&res.venues)||[], key=slug(SLUG);
      var v=venues.filter(function(x){return slug(x.name)===key||String(x.name||'').toLowerCase()===String(SLUG).toLowerCase();})[0]||venues.filter(function(x){return x.name;})[0];
      if(!v)throw new Error('venue not found');
      VENUE.name=v.name||SLUG; VENUE.region=v.region||v.location||''; VENUE.registerUrl=v.registerUrl||''; VENUE.schedule=v.schedule||'';
      $('vname').textContent=VENUE.name; document.title=VENUE.name+' · Trekkr TV';
      renderSchedule(); renderRegister();
    });
  }
  function buildWeekly(ranking){
    var out={M:[],F:[]};
    (ranking||[]).forEach(function(p){ if(!p||!p.name)return; var g=(p.gender==='F')?'F':'M';
      out[g].push({name:p.name,displayName:p.displayName||p.name,w:p.w||0,l:p.l||0,pd:(p.pd==null?0:p.pd),elo:p.elo||0,photoUrl:p.photoUrl||'',verified:!!p.verified,region:p.region||''}); });
    ['M','F'].forEach(function(g){out[g].sort(function(a,b){return b.w-a.w||b.pd-a.pd||b.elo-a.elo;});});
    return out;
  }
  function loadWeekly(){
    return fetchJSON(BASE+'/venues/'+encodeURIComponent(VENUE.name||SLUG)+'/ranking').then(function(d){
      var w=buildWeekly((d&&d.ranking)||[]); w.week=(d&&d.week)||''; WEEKLY=w;
    }).catch(function(){});
  }
  function loadMonthly(){
    return fetchJSON(BASE+'/venues/'+encodeURIComponent(VENUE.name||SLUG)+'/monthly').then(function(d){ MONTHLY=d||null; }).catch(function(){});
  }
  function loadLive(){
    return fetchJSON(BASE+'/live/venue?venue='+encodeURIComponent(VENUE.name||SLUG)).then(function(d){ LIVE=d||{active:false}; }).catch(function(){ /* keep last */ });
  }

  /* ---------- boot ---------- */
  function boot(){
    loadVenue().then(function(){ return Promise.all([loadLive(),loadWeekly(),loadMonthly()]); }).then(function(){
      $('boot').classList.add('hide');
      requestAnimationFrame(tick);
      setInterval(loadLive, 8000);              // live is the priority signal
      setInterval(function(){ loadWeekly(); loadMonthly(); }, 60000);
    }).catch(function(){
      $('boot').textContent='Could not load venue data. Retrying…';
      setTimeout(boot, 8000);
    });
  }
  boot();
})();
</script>
</body>
</html>
