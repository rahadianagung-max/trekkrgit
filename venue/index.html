<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Venue | Trekkr</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#003ec7;--primary-container:#0052ff;--secondary-container:#cd4800;--on-surface:#0b1c30;--on-surface-variant:#434656;--on-inverse:#eaf1ff;--on-primary:#fff;--surface:#f8f9ff;--surface-low:#eff4ff;--surface-container:#e5eeff;--surface-high:#dce9ff;--surface-highest:#d3e4fe;--surface-lowest:#fff;--surface-inverse:#213145;--ok:#1f9d63;--danger:#ba1a1a;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-pill:999px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:32px;--rhythm-section:32px;--rhythm-major:48px;--shadow-soft:0 16px 34px rgba(11,28,48,0.08);--motion-base:220ms;--ease-out:cubic-bezier(0.22,0.61,0.36,1)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{color:var(--on-surface);font-family:'Plus Jakarta Sans',sans-serif;line-height:1.45;background:radial-gradient(1200px 500px at 100% -15%,rgba(0,82,255,0.11),transparent 58%),radial-gradient(900px 500px at -10% 110%,rgba(205,72,0,0.1),transparent 54%),var(--surface)}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}h1,h2,h3,p{margin:0}
.container{width:min(1280px,calc(100% - 80px));margin:0 auto}

/* STYLE SPOTLIGHT (RANK 1-3) */
.spotlight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; margin-bottom: 32px; }
.spotlight-card { background: var(--surface-lowest); border-radius: var(--radius-xl); padding: 20px; text-align: center; box-shadow: var(--shadow-soft); cursor: pointer; transition: transform 0.2s; border: 1px solid rgba(115,118,136,0.1); }
.spotlight-card:hover { transform: translateY(-5px); }
.spotlight-rank { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 12px; display: block; }
.spotlight-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: var(--surface-low); }
.spotlight-name { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; color: var(--on-surface); }
.spotlight-elo { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; color: var(--primary); }

/* STYLE TABEL (RANK 4+) */
.table-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--surface-high); flex-shrink: 0; }
.flex-player { display: flex; align-items: center; gap: 12px; }

/* HEADER & HERO */
.site-header{position:sticky;top:0;z-index:50;background:rgba(248,249,255,0.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(115,118,136,0.1)}.site-header__inner{display:flex;align-items:center;justify-content:space-between;min-height:80px}.brand{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:800;letter-spacing:-0.03em;text-transform:uppercase}.nav-links{display:flex;gap:6px}.nav-link{border-radius:var(--radius-pill);padding:9px 18px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--on-surface-variant);transition:all var(--motion-base)}.nav-link:hover{background:var(--surface-container)}.nav-link.is-active{color:var(--primary);background:var(--surface-container)}.header-actions{display:flex;gap:12px}.btn{border:0;border-radius:var(--radius-pill);padding:10px 22px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:all var(--motion-base)}.btn--primary{background:var(--primary);color:var(--on-primary)}.btn--ghost{background:var(--surface-container);color:var(--primary)}
.vd-hero{position:relative;overflow:hidden;min-height:280px;background:linear-gradient(135deg,#001c6f 0%,#003ec7 100%);color:#fff;padding:var(--rhythm-major) 0}
.vd-hero>.container{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.vd-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(36px,6vw,64px);line-height:0.9;letter-spacing:-0.04em;font-weight:900;text-transform:uppercase}
.vd-controls{padding:16px 0;border-bottom:1px solid rgba(115,118,136,0.12);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vd-week{display:flex;align-items:center;gap:12px}
.vd-week-btn{width:36px;height:36px;border:0;border-radius:var(--radius-md);background:var(--surface-container);color:var(--primary);font-size:16px;font-weight:700;cursor:pointer}
.vd-week-label{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800}
.seg-control{background:var(--surface-container);border-radius:var(--radius-md);padding:4px;display:flex;gap:4px}
.seg-control__item{flex:1;border:0;background:transparent;border-radius:8px;min-height:36px;padding:0 16px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--on-surface-variant);cursor:pointer}
.seg-control__item.is-active{color:var(--primary);background:var(--surface-lowest)}
.data-table-wrap{margin-top:16px;background:var(--surface-low);border-radius:var(--radius-lg);overflow:auto}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--on-surface-variant);background:rgba(203,219,245,0.5);padding:12px 14px}
.data-table td{padding:14px;background:var(--surface-lowest);font-size:14px}
.data-table tr:nth-child(even) td{background:rgba(239,244,255,0.65)}
.data-table tr:hover td{background:var(--surface-highest)}
.v-rank{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;color:var(--primary)}
.site-footer{margin-top:72px;border-top:1px solid rgba(115,118,136,0.12);padding:var(--space-7) 0}
.site-footer__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.footer-brand{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase}
@media(max-width:1023px){.container{width:min(100%,calc(100% - 48px))}.nav-links{display:none}.spotlight-grid { grid-template-columns: repeat(2, 1fr); }}
@media(max-width:767px){.container{width:min(100%,calc(100% - 32px))}.spotlight-grid { grid-template-columns: 1fr; }}
</style>
</head>
<body>
<header class="site-header"><div class="container site-header__inner"><a href="https://trekkr.online" class="brand">Trekkr</a><nav class="nav-links"><a class="nav-link" href="https://trekkr.online">National Ranking</a><a class="nav-link is-active" href="https://venue.trekkr.online">Venue</a><a class="nav-link" href="https://sportsactvd.com/trekkr" target="_blank">About</a></nav><div class="header-actions"><button class="btn btn--text" onclick="location.href='https://admin.trekkr.online'">Sign In</button></div></div></header>
<main><div id="mainContent"><div class="container"><div class="state-panel" style="text-align:center; padding:40px;"><h2 class="state-title">Loading</h2><p class="state-copy">Compiling rankings...</p></div></div></div></main>
<footer class="site-footer"><div class="container site-footer__inner"><div class="footer-brand">Trekkr</div><div class="footer-links"><a href="https://sportsactvd.com/trekkr" target="_blank">About</a></div><div class="footer-copy">© 2026 Trekkr. All rights reserved.</div></div></footer>

<script src="https://trekkr.online/trekkr-api.js"></script>
<script>
let cG='M',cW=getCW(),vName='',vData=null;

function getCW(){const d=new Date(),s=new Date(d.getFullYear(),0,1),df=d-s+(s.getTimezoneOffset()-d.getTimezoneOffset())*60000;return Math.ceil((df/86400000+s.getDay()+1)/7)}
function switchGender(g){cG=g;loadRanking()}
function changeWeek(d){cW+=d;if(cW<1)cW=1;document.getElementById('weekLabel').textContent=`Week ${cW}`;loadRanking()}

function getTierName(elo) {
  if (elo >= 3000) return "Platinum";
  if (elo >= 2500) return "Gold";
  if (elo >= 2100) return "Silver";
  if (elo >= 1800) return "Upper Bronze";
  if (elo >= 1500) return "Bronze";
  if (elo >= 1200) return "Lower Bronze";
  if (elo >= 900) return "Upper Beginner";
  return "Beginner";
}

async function init(){
  const p=window.location.pathname.replace(/\/$/,'').split('/').filter(Boolean);
  vName=p.length>0&&p[0]!=='venue'?decodeURIComponent(p[p.length-1]):(p.length>1?decodeURIComponent(p[1]):'');
  if(!vName||vName==='venue'){
    document.getElementById('mainContent').innerHTML='<div class="container" style="padding:40px; text-align:center;"><h2>Select a venue to see rankings</h2></div>';
    return;
  }
  await loadVenueDetail();
}

async function loadVenueDetail(){
  try{const d=await TrekkrAPI.getVenues();vData=d.venues.find(v=>v.name.toLowerCase()===vName.toLowerCase())}catch(e){}
  const v=vData||{name:vName};
  let h=`<section class="vd-hero"><div class="container"><div><h1 class="vd-title">${(v.name||vName).toUpperCase()}</h1></div></div></section>`;
  h+=`<section class="section"><div class="container"><div class="vd-controls"><div class="vd-week"><button class="vd-week-btn" onclick="changeWeek(-1)">←</button><p class="vd-week-label" id="weekLabel">Week ${cW}</p><button class="vd-week-btn" onclick="changeWeek(1)">→</button></div>
  <div class="seg-control"><button class="seg-control__item ${cG==='M'?'is-active':''}" onclick="switchGender('M')">Men</button><button class="seg-control__item ${cG==='F'?'is-active':''}" onclick="switchGender('F')">Women</button></div></div>
  <div id="rankingContainer"></div></div></section>`;
  document.getElementById('mainContent').innerHTML=h;
  await loadRanking();
}

async function loadRanking(){
  const c=document.getElementById('rankingContainer');if(!c)return;
  c.innerHTML='<div class="state-panel" style="text-align:center; padding:40px;">Compiling data...</div>';
  try{
    const d=await TrekkrAPI.getVenueWeeklyRanking(vName,{week:`W${cW}`,gender:cG});
    if(!d.ranking||!d.ranking.length){c.innerHTML='<div class="state-panel" style="text-align:center; padding:40px;">No match data for this week.</div>';return}
    
    const top3 = d.ranking.slice(0, 3);
    const rest = d.ranking.slice(3);
    let h = '<div class="spotlight-grid">';

    // RENDERING RANK 1-3 (FOTO BESAR PERSEGI)
    top3.forEach((p, i) => {
      const photo = p.photoUrl && p.photoUrl !== "" 
                    ? p.photoUrl 
                    : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=003ec7&color=fff&size=512&bold=true`;
      
      h += `
        <article class="spotlight-card" onclick="location.href='https://trekkr.online/player/${encodeURIComponent(p.name)}'">
          <span class="spotlight-rank">Rank 0${i+1}</span>
          <img src="${photo}" class="spotlight-img" alt="${p.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=003ec7&color=fff&size=512'">
          <h3 class="spotlight-name">${p.name}</h3>
          <p class="spotlight-elo">${p.elo} ELO</p>
          <p style="font-size:10px; color:var(--on-surface-variant); text-transform:uppercase; font-weight:700; margin-top:4px;">${getTierName(p.elo)}</p>
        </article>`;
    });
    h += '</div>';

    // RENDERING RANK 4+ (TABEL DENGAN FOTO KECIL)
    if(rest.length > 0) {
      h += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Rank</th><th>Player</th><th>Tier / ELO</th><th>W/L</th></tr></thead><tbody>';
      rest.forEach((p, i) => {
        const truePlayed = p.w + p.l;
        const photoSmall = p.photoUrl && p.photoUrl !== "" 
                    ? p.photoUrl 
                    : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=e5eeff&color=003ec7&bold=true`;

        h += `<tr onclick="location.href='https://trekkr.online/player/${encodeURIComponent(p.name)}'">
          <td><span class="v-rank">${String(i + 4).padStart(2,'0')}</span></td>
          <td>
            <div class="flex-player">
              <img src="${photoSmall}" class="table-img" alt="${p.name}">
              <strong>${p.name}</strong>
            </div>
          </td>
          <td><span style="font-size:11px;color:var(--on-surface-variant);text-transform:uppercase;font-weight:700">${getTierName(p.elo)}</span><br>${p.elo}</td>
          <td><span style="color:var(--ok);font-weight:700">${p.w}W</span> / <span style="color:var(--danger)">${p.l}L</span></td>
        </tr>`;
      });
      h += '</tbody></table></div>';
    }
    c.innerHTML = h;
  } catch(e) { c.innerHTML = '<div class="state-panel" style="text-align:center; padding:40px;">Error loading rankings.</div>'; }
}

window.addEventListener('load',init);
</script>
</body>
</html>
