<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Venues — Trekkr</title>
<meta name="description" content="Trekkr venues across Indonesia — find your home court and its ranked-match leaderboard."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="/trekkr-theme.css"/>
<style>
.page-head{padding:26px 0 0}
.page-head h1{font-size:clamp(28px,5vw,42px);margin:8px 0 0}
.page-head p{color:var(--muted);font-size:14px;margin:10px 0 0;max-width:600px}
.back{font-size:12px;font-weight:600;color:var(--subtle);display:inline-flex;align-items:center;gap:5px}
.back:hover{color:var(--orange)}

.searchbar{margin-top:16px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:0 12px;max-width:360px}
.searchbar i{color:var(--orange);font-size:16px}
.searchbar input{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:14px;padding:11px 0;color:var(--text)}

.grid{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.vcard{display:block;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:18px;transition:border-color .2s,transform .2s}
.vcard:hover{border-color:var(--orange);transform:translateY(-2px)}
.vcard .vlogo{width:42px;height:42px;border-radius:11px;background:#FFE3CC;color:var(--orange);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;overflow:hidden}
.vcard .vlogo img{width:100%;height:100%;object-fit:cover}
.vcard .vname{font-size:17px;font-weight:700;margin-top:12px;line-height:1.2}
.vcard .vmeta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.vcard .vmeta i{color:var(--subtle);font-size:13px}
.vcard .vgo{font-size:12px;font-weight:600;color:var(--orange);margin-top:14px;display:inline-flex;align-items:center;gap:5px}

/* Detail */
.vhero{margin-top:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.vhero .vlogo{width:104px;height:104px;border-radius:20px;font-size:40px;flex-shrink:0}
@media(max-width:560px){.vhero .vlogo{width:84px;height:84px;border-radius:16px;font-size:32px}}
.vhero .vinfo{flex:1;min-width:200px}
.vhero h2{font-size:clamp(24px,4.5vw,34px);margin:0}
.vtags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.vtag{font-size:11px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:var(--radius-pill);padding:5px 12px;display:inline-flex;align-items:center;gap:5px}
.vtag i{color:var(--orange);font-size:13px}
.lb{border:1px solid var(--border-soft);border-radius:12px;overflow:hidden}
.lb-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border-soft);transition:background .2s}
.lb-row:last-child{border-bottom:0}
.lb-row:hover{background:var(--surface-2)}
.lb-row .rk{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;color:var(--subtle);width:20px;text-align:center;flex-shrink:0}
.lb-row.top .rk{color:var(--orange)}
.lb-photo{width:54px;height:54px;border-radius:12px;background:var(--surface-3);color:var(--muted);font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;object-fit:cover;overflow:hidden}
.lb-name{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name .lb-sub{display:block;font-size:11px;color:var(--subtle);font-weight:500;margin-top:3px}
.lb-wl{flex-shrink:0;text-align:center;min-width:62px}
.lb-wl .n{font-size:14px;font-weight:700}
.lb-wl .n .w{color:var(--green)}.lb-wl .n .l{color:var(--red)}.lb-wl .n .sep{color:var(--faint);font-weight:600;margin:0 3px}
.lb-wl .cap,.lb-elo .cap{display:block;font-size:9px;letter-spacing:.12em;color:var(--faint);font-weight:700;margin-top:3px}
.lb-elo{flex-shrink:0;text-align:right;min-width:60px}
.lb-elo .v{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;color:var(--orange);line-height:1}
@media(max-width:520px){.lb-photo{width:46px;height:46px;font-size:17px}.lb-row{gap:10px;padding:12px}.lb-wl{min-width:50px}.lb-elo .v{font-size:20px}}

.state{padding:40px 20px;text-align:center;color:var(--subtle);font-size:13px}
.skeleton{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:860px){.nav{display:none}.menu-toggle{display:flex}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
  .pp-nudge{display:flex;align-items:center;gap:13px;background:linear-gradient(100deg,#FFF3EA,#FFFBF7);border:1px solid #FFD9BF;border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .pp-nudge .pp-ic{width:40px;height:40px;border-radius:11px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;animation:ppPulse 2.4s ease-in-out infinite}
  @keyframes ppPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,106,0,.38)}50%{box-shadow:0 0 0 7px rgba(255,106,0,0)}}
  .pp-nudge .pp-tx{display:flex;flex-direction:column;gap:2px}
  .pp-nudge .pp-tx b{font-size:14px;color:var(--text)}
  .pp-nudge .pp-tx span{font-size:12px;color:var(--muted);line-height:1.45}
  .lb-go{flex-shrink:0;color:var(--faint);font-size:18px;display:flex;align-items:center;transition:color .2s,transform .2s}
  .lb-row:hover .lb-go{color:var(--orange);transform:translateX(2px)}
  .vhero{align-items:flex-start}
  .vhero .vname{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(30px,6.4vw,52px);margin:0;line-height:1.02;letter-spacing:-.01em}
  .vmode{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .vmode-b{padding:9px 16px;border:1px solid var(--border);background:#fff;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
  .vmode-b.on{background:var(--orange);border-color:var(--orange);color:#fff}
  .vmode-b:hover:not(.on){border-color:var(--orange);color:var(--orange)}
  .wsel{margin-top:16px;display:flex;align-items:center;gap:10px}
  .wsel label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
  .wsel select{font-family:inherit;font-size:13px;font-weight:600;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer}
  .gblk{margin-top:22px}
  .podium{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin:8px 0 4px;flex-wrap:wrap}
  .pod{flex:1 1 0;min-width:96px;max-width:150px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px 10px 14px;text-align:center;transition:border-color .2s,transform .2s;position:relative}
  .pod:hover{border-color:var(--orange);transform:translateY(-3px)}
  .pod-rk{position:absolute;top:8px;left:11px;font-family:var(--display);font-style:italic;font-weight:800;font-size:16px;color:var(--subtle)}
  .pod1 .pod-rk{color:var(--orange)}
  .pod-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--surface-3);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;border:2px solid var(--border)}
  .pod1{transform:scale(1.05)}
  .pod1 .pod-photo{width:84px;height:84px;font-size:28px;border-color:var(--orange)}
  .pod-nm{font-weight:700;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod-el{font-family:var(--display);font-style:italic;font-weight:800;color:var(--orange);font-size:20px;margin-top:2px}
  .pod-el span{font-size:9px;color:var(--faint);letter-spacing:.08em;margin-left:3px;font-style:normal}
  .pod-wl{font-size:11px;color:var(--muted);margin-top:2px}
  .sortbar{display:flex;gap:8px;margin:12px 0 14px;flex-wrap:wrap}
  .sortb{padding:8px 14px;border:1px solid var(--border);background:#fff;border-radius:999px;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
  .sortb.on{background:var(--text);border-color:var(--text);color:#fff}
  .sortb:hover:not(.on){border-color:var(--orange);color:var(--orange)}
  .mh{border:1px solid var(--border-soft);border-radius:12px;overflow:hidden}
  .mh-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border-soft);font-size:13px}
  .mh-row:last-child{border-bottom:0}
  .mh-team{flex:1;font-weight:600;color:var(--muted);text-align:right;min-width:0}
  .mh-team.r{text-align:left}
  .mh-team.win{color:var(--text);font-weight:700}
  .mh-sc{font-family:var(--display);font-style:italic;font-weight:800;font-size:16px;color:var(--text);flex-shrink:0;min-width:58px;text-align:center}
  .mh-sc span{color:var(--faint);margin:0 4px;font-size:13px}
  .champs{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px}
  .champ{display:flex;align-items:center;gap:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;transition:border-color .2s,transform .2s}
  .champ:hover{border-color:var(--orange);transform:translateY(-2px)}
  .champ-rk{font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;color:var(--subtle);width:34px;text-align:center;flex-shrink:0}
  .champ1{background:linear-gradient(100deg,#FFF6EC,#FFFBF7);border-color:#FFCFA8}
  .champ1 .champ-rk{color:var(--orange)}
  .champ-photo{width:96px;height:96px;border-radius:16px;object-fit:cover;background:var(--surface-3);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;border:2px solid var(--border);flex-shrink:0}
  .champ1 .champ-photo{width:124px;height:124px;border-radius:18px;font-size:44px;border-color:var(--orange)}
  .champ-info{flex:1;min-width:0}
  .champ-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
  .champ-nm{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(22px,4.4vw,34px);line-height:1.04;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .champ1 .champ-nm{font-size:clamp(26px,5.4vw,42px)}
  .champ-stats{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .champ-stats .cs{font-size:12px;color:var(--muted)}
  .champ-stats .cs b{font-family:var(--display);font-style:italic;font-weight:800;font-size:16px;color:var(--text);margin-right:2px}
  .champ-stats .cs-pd b{color:var(--orange)}
  .champ .lb-go{color:var(--faint);font-size:20px;flex-shrink:0}
  .champ:hover .lb-go{color:var(--orange)}
  @media(max-width:520px){.champ-photo{width:76px;height:76px;font-size:27px}.champ1 .champ-photo{width:96px;height:96px;font-size:34px}.champ-rk{font-size:26px;width:24px}.champ{gap:12px;padding:14px}}
  /* Competition (Tournament) type badge + standings table */
  .tbadge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:999px;margin-bottom:2px}
  .tb-tourney{background:#FFF6E5;color:#B8860B;border:1px solid #F0D9A8}
  .tb-league{background:#EEF0FF;color:#4F46E5;border:1px solid #D6D9F5}
  .lseries{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .lserie{min-width:132px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;flex-shrink:0}
  .lserie.now{border-color:#4F46E5;box-shadow:0 0 0 2px #EEF0FF}
  .lserie .lst{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
  .lserie .lsn{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;margin-top:2px}
  .lserie .lsw{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
  .lserie .lsw b{color:var(--text)}
  .lg-boards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
  @media(max-width:640px){.lg-boards{grid-template-columns:1fr}}
  .lg-col{min-width:0}
  .lg-col .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);font-weight:700;text-align:right;padding:9px 8px;border-bottom:1px solid var(--border)}
  .tbl th:nth-child(2){text-align:left}
  .tbl td{padding:11px 8px;border-bottom:1px solid var(--border-soft);text-align:right;font-variant-numeric:tabular-nums}
  .tbl td:nth-child(2){text-align:left;font-weight:700}
  .tbl .rkn{color:var(--subtle);font-family:var(--display);font-style:italic;font-weight:800}
  .tbl .eloc{font-family:var(--display);font-style:italic;font-weight:800;font-size:17px;color:var(--orange)}
  .tbl tr.top td{background:var(--surface-2)}
  .pl-link{color:inherit;font-weight:700}
  .pl-link:hover{color:var(--orange);text-decoration:underline}
  .pl-inline{display:inline-flex;align-items:center;gap:7px}
  .pl-av{width:28px;height:28px;border-radius:8px;background:var(--surface-3);color:var(--muted);font-family:var(--display);font-style:italic;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .pl-av img{width:100%;height:100%;object-fit:cover}
  .tbl td.pairc{white-space:normal}
  .amp{color:var(--faint);font-weight:600}
  .pair-photos{display:flex;align-items:center;flex-shrink:0}
  .pair-photos .champ-photo{width:56px;height:56px;font-size:20px}
  .pair-photos .champ-photo + .champ-photo{margin-left:-16px;border:2px solid #fff}
  .champ1 .pair-photos .champ-photo + .champ-photo{border-color:var(--orange)}
  .ct-pane{margin-top:2px}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="https://trekkr.online/" class="brand">Trekkr</a>
    <nav class="nav" aria-label="Primary">
      <a href="https://trekkr.online/">Home</a>
      <a href="https://trekkr.online/rankings">Rankings</a>
      <a href="https://trekkr.online/playrank">PlayRank</a>
      <a href="https://trekkr.online/tournament">Tourney &amp; League</a>
      <a href="https://trekkr.online/get-listed">Get Listed</a>
      <a href="https://trekkr.online/how-trekkr-works">How Trekkr Works</a>
    </nav>
    <div class="header-actions">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">≡</button>
    </div>
  </div>
  <div class="container">
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile">
      <a href="https://trekkr.online/">Home</a>
      <a href="https://trekkr.online/rankings">Rankings</a>
      <a href="https://trekkr.online/playrank">PlayRank</a>
      <a href="https://trekkr.online/tournament">Tourney &amp; League</a>
      <a href="https://trekkr.online/get-listed">Get Listed</a>
      <a href="https://trekkr.online/how-trekkr-works">How Trekkr Works</a>
    </nav>
  </div>
</header>

<main class="container" id="main">
  <div id="content"><div class="skeleton" style="margin-top:26px"></div></div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="footer-brand">Trekkr</span>
    <nav class="footer-links" aria-label="Footer">
      <a href="https://admin.trekkr.online">Admin (Venue login)</a>
      <a href="https://trekkr.online/market">Market Intelligence</a>
      <a href="https://trekkr.online/about">About</a>
    </nav>
    <span class="footer-copy">© 2026 Trekkr. All rights reserved.</span>
  </div>
</footer>

<script>
(function(){
  var BASE = location.hostname==='trekkr.online' ? '/api' : 'https://trekkr.online/api';
  var mt=document.getElementById('menuToggle'), mn=document.getElementById('mobileNav');
  mt&&mt.addEventListener('click',function(){var o=mn.classList.toggle('open');mt.setAttribute('aria-expanded',o?'true':'false');});

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function initials(n){var p=String(n).trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
  function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
  function vlogo(v,big){var c=big?'vlogo':'vlogo';if(v.logoUrl)return '<span class="'+c+'"><img src="'+esc(v.logoUrl)+'" alt=""/></span>';return '<span class="'+c+'">'+esc(initials(v.name))+'</span>';}
  function photo(p){if(p.photoUrl)return '<img class="lb-photo" src="'+esc(p.photoUrl)+'" alt="" loading="lazy"/>';return '<span class="lb-photo">'+esc(initials(p.name))+'</span>';}
  var content=document.getElementById('content');

  function selected(){
    var seg=decodeURIComponent((location.pathname.split('/').filter(Boolean).pop())||'');
    if(seg&&!/\.html?$/i.test(seg)&&seg.toLowerCase()!=='venue'&&seg.toLowerCase()!=='venues')return seg;
    return new URLSearchParams(location.search).get('v')||null;
  }

  /* ---- Directory ---- */
  function renderDirectory(venues){
    var cards=venues.filter(function(v){return v.name;}).map(function(v){
      var loc=v.region||v.location||'';
      return '<a class="vcard" href="/'+slug(v.name)+'">'+vlogo(v)
        +'<div class="vname">'+esc(v.name)+'</div>'
        +(loc?'<div class="vmeta"><i class="ti ti-map-pin" aria-hidden="true"></i>'+esc(loc)+'</div>':'')
        +(v.schedule?'<div class="vmeta"><i class="ti ti-calendar" aria-hidden="true"></i>'+esc(v.schedule)+'</div>':'')
        +'<div class="vgo">View leaderboard <i class="ti ti-arrow-right" aria-hidden="true"></i></div></a>';
    }).join('');
    content.innerHTML='<div class="page-head"><span class="eyebrow">Ranked match</span><h1 class="display">Venues</h1>'
      +'<p>Find your home court and its ranked-match leaderboard. '+venues.length+' venues on Trekkr.</p></div>'
      +'<div class="searchbar"><i class="ti ti-search" aria-hidden="true"></i><input id="vsearch" type="search" placeholder="Search venues…" aria-label="Search venues"/></div>'
      +'<div class="grid" id="vgrid">'+cards+'</div>';
    var inp=document.getElementById('vsearch'), grid=document.getElementById('vgrid');
    inp.addEventListener('input',function(){
      var q=inp.value.toLowerCase();
      Array.prototype.forEach.call(grid.children,function(c){
        c.style.display=c.textContent.toLowerCase().indexOf(q)>=0?'':'none';
      });
    });
  }

  /* ---- Detail ---- */
  function firstName(n){var t=String(n||'').trim();return t?t.split(/\s+/)[0]:'';}
  function bigphoto(p){if(p.photoUrl)return '<img class="pod-photo" src="'+esc(p.photoUrl)+'" alt="" loading="lazy"/>';return '<span class="pod-photo">'+esc(initials(p.name))+'</span>';}
  function weekLabel(w){return String(w||'').replace(/^W/,'Week ');}
  var CUR=null,CURWEEK=null,ALLCACHE=null;

  function hdr(v){
    var loc=v.region||v.location||'';var tags='';
    if(loc)tags+='<span class="vtag"><i class="ti ti-map-pin"></i>'+esc(loc)+'</span>';
    if(v.schedule)tags+='<span class="vtag"><i class="ti ti-calendar"></i>'+esc(v.schedule)+'</span>';
    if(v.prizePool)tags+='<span class="vtag"><i class="ti ti-trophy"></i>'+esc(v.prizePool)+'</span>';
    if(v.contact)tags+='<span class="vtag"><i class="ti ti-phone"></i>'+esc(v.contact)+'</span>';
    var reg=v.registerUrl?'<a class="btn btn--primary" href="'+esc(v.registerUrl)+'" target="_blank" rel="noopener"><i class="ti ti-user-plus"></i>Register</a>':'';
    return '<div class="page-head"><a class="back" href="/"><i class="ti ti-arrow-left"></i>All venues</a></div>'
      +'<div class="vhero">'+vlogo(v,true)+'<div class="vinfo"><h2 class="vname">'+esc(v.name)+'</h2><div class="vtags">'+tags+'</div></div>'+reg+'</div>';
  }
  function modeTabs(mode){
    return '<div class="vmode">'
      +'<button class="vmode-b'+(mode==='week'?' on':'')+'" onclick="showWeekly()">Weekly ranking</button>'
      +'<button class="vmode-b'+(mode==='all'?' on':'')+'" onclick="showAll()">All venue players</button></div>';
  }
  function ppNudge(){return '<div class="pp-nudge"><span class="pp-ic"><i class="ti ti-id-badge-2"></i></span><div class="pp-tx"><b>Found your name? Tap it.</b><span>Every player here has a Player Passport &mdash; rating, tier, match history &amp; badges.</span></div></div>';}
  function bigphoto2(p){if(p.photoUrl)return '<img class="champ-photo" src="'+esc(p.photoUrl)+'" alt="" loading="lazy"/>';return '<span class="champ-photo">'+esc(initials(p.name))+'</span>';}
  function pdText(v){v=(v==null?0:v);return (v>0?'+':'')+v;}
  function champCard(p,rank){
    var label=rank===1?'Weekly Champion':(rank===2?'Runner-up':'3rd place');
    return '<a class="champ champ'+rank+'" href="https://trekkr.online/player/'+slug(p.name)+'">'
      +'<div class="champ-rk">'+rank+'</div>'+bigphoto2(p)
      +'<div class="champ-info"><div class="champ-lbl">'+label+'</div>'
      +'<div class="champ-nm">'+esc(p.name)+'</div>'
      +'<div class="champ-stats"><span class="cs"><b>'+(p.w||0)+'</b>W</span><span class="cs"><b>'+(p.l||0)+'</b>L</span><span class="cs cs-pd"><b>'+pdText(p.pd)+'</b> diff</span><span class="cs"><b>'+(p.elo||'')+'</b> ELO</span></div></div>'
      +'<span class="lb-go"><i class="ti ti-chevron-right"></i></span></a>';
  }
  function podium(list){var top=list.slice(0,3);if(!top.length)return '';return '<div class="champs">'+top.map(function(p,i){return champCard(p,i+1);}).join('')+'</div>';}
  function wkRow(p,i){
    return '<a class="lb-row" href="https://trekkr.online/player/'+slug(p.name)+'">'
      +'<span class="rk">'+(i+1)+'</span>'+photo(p)
      +'<span class="lb-name">'+esc(p.name)+'<span class="lb-sub">'+(p.gender==='F'?'Women':'Men')+' &middot; '+pdText(p.pd)+' diff</span></span>'
      +'<span class="lb-wl"><span class="n"><span class="w">'+(p.w||0)+'</span><span class="sep">/</span><span class="l">'+(p.l||0)+'</span></span><span class="cap">W / L</span></span>'
      +'<span class="lb-elo"><span class="v">'+(p.elo||'')+'</span><span class="cap">ELO</span></span>'
      +'<span class="lb-go"><i class="ti ti-chevron-right"></i></span></a>';
  }
  function genderBlock(title,list){
    if(!list||!list.length)return '<div class="gblk"><div class="sec-label">'+title+'</div><div class="state">No matches this week.</div></div>';
    var rest=list.slice(3);
    var restHtml=rest.length?'<div class="lb">'+rest.map(function(p,i){return wkRow(p,i+3);}).join('')+'</div>':'';
    return '<div class="gblk"><div class="sec-label">'+title+'</div>'+podium(list)+restHtml+'</div>';
  }
  function matchHist(matches){
    if(!matches||!matches.length)return '';
    var rows=matches.map(function(m){
      var t1=(m.t1||[]).map(firstName).join(' & '),t2=(m.t2||[]).map(firstName).join(' & ');
      return '<div class="mh-row"><span class="mh-team'+(m.s1>m.s2?' win':'')+'">'+esc(t1)+'</span>'
        +'<span class="mh-sc">'+m.s1+'<span>&ndash;</span>'+m.s2+'</span>'
        +'<span class="mh-team r'+(m.s2>m.s1?' win':'')+'">'+esc(t2)+'</span></div>';
    }).join('');
    return '<div class="sec-label" style="margin-top:24px">Match history &middot; this week</div><div class="mh">'+rows+'</div>';
  }
  function weekSelect(weeks,cur){
    if(!weeks||!weeks.length)return '';
    var opts=weeks.map(function(w){return '<option value="'+esc(w)+'"'+(w===cur?' selected':'')+'>'+esc(weekLabel(w))+'</option>';}).join('');
    return '<div class="wsel"><label>Game week</label><select onchange="pickWeek(this.value)">'+opts+'</select></div>';
  }
  function renderWeekly(v,d){
    var rk=d.ranking||[];
    var males=rk.filter(function(p){return p.gender!=='F';});
    var females=rk.filter(function(p){return p.gender==='F';});
    content.innerHTML=hdr(v)+modeTabs('week')+weekSelect(d.weeks,d.week)+ppNudge()
      +genderBlock('Men &middot; '+weekLabel(d.week),males)
      +genderBlock('Women &middot; '+weekLabel(d.week),females)
      +matchHist(d.matches);
  }
  function loadWeekly(v,week){
    CUR=v;CURWEEK=week||null;
    content.innerHTML=hdr(v)+modeTabs('week')+'<div class="state" style="margin-top:24px">Loading week&hellip;</div>';
    var u=BASE+'/venues/'+encodeURIComponent(v.name)+'/ranking'+(week?('?week='+encodeURIComponent(week)):'');
    fetch(u).then(function(r){return r.json();}).then(function(d){CURWEEK=d.week;renderWeekly(v,d);})
      .catch(function(){content.innerHTML=hdr(v)+modeTabs('week')+'<div class="state">Couldn\'t load week.</div>';});
  }
  function pickWeek(w){loadWeekly(CUR,w);}
  function showWeekly(){loadWeekly(CUR,CURWEEK);}
  function openVenue(v){CUR=v;ALLCACHE=null;loadWeekly(v,null);}

  function sortAll(list,mode){
    var a=list.slice();
    if(mode==='wins')a.sort(function(x,y){return (y.totalW||0)-(x.totalW||0)||(y.elo||0)-(x.elo||0);});
    else if(mode==='elo')a.sort(function(x,y){return (y.elo||0)-(x.elo||0);});
    else a.sort(function(x,y){return (y.totalMatches||0)-(x.totalMatches||0)||(y.totalW||0)-(x.totalW||0);});
    return a;
  }
  function allRow(p,i,mode){
    var metric=mode==='wins'?((p.totalW||0)+' wins'):mode==='elo'?((p.elo||0)+' ELO'):((p.totalMatches||0)+' matches');
    return '<a class="lb-row" href="https://trekkr.online/player/'+slug(p.name)+'">'
      +'<span class="rk">'+(i+1)+'</span>'+photo(p)
      +'<span class="lb-name">'+esc(p.name)+'<span class="lb-sub">'+esc(metric)+'</span></span>'
      +'<span class="lb-wl"><span class="n"><span class="w">'+(p.totalW||0)+'</span><span class="sep">/</span><span class="l">'+(p.totalL||0)+'</span></span><span class="cap">W / L</span></span>'
      +'<span class="lb-elo"><span class="v">'+(p.elo||'')+'</span><span class="cap">ELO</span></span>'
      +'<span class="lb-go"><i class="ti ti-chevron-right"></i></span></a>';
  }
  function renderAll(v,players,mode){
    var sorted=sortAll(players,mode);
    var tabs='<div class="sortbar">'
      +'<button class="sortb'+(mode==='loyal'?' on':'')+'" onclick="setSort(\'loyal\')">Most loyal</button>'
      +'<button class="sortb'+(mode==='wins'?' on':'')+'" onclick="setSort(\'wins\')">Most wins</button>'
      +'<button class="sortb'+(mode==='elo'?' on':'')+'" onclick="setSort(\'elo\')">Highest ELO</button></div>';
    var rows=sorted.length?('<div class="lb">'+sorted.map(function(p,i){return allRow(p,i,mode);}).join('')+'</div>'):'<div class="state">No players yet.</div>';
    content.innerHTML=hdr(v)+modeTabs('all')+'<div class="sec-label" style="margin-top:18px">All venue players</div>'+ppNudge()+tabs+rows;
  }
  function showAll(){
    if(ALLCACHE){renderAll(CUR,ALLCACHE,'loyal');return;}
    content.innerHTML=hdr(CUR)+modeTabs('all')+'<div class="state" style="margin-top:24px">Loading players&hellip;</div>';
    fetch(BASE+'/elo/leaderboard?'+new URLSearchParams({venue:CUR.name,limit:200}).toString()).then(function(r){return r.json();})
      .then(function(ld){ALLCACHE=(ld&&ld.leaderboard)||[];renderAll(CUR,ALLCACHE,'loyal');})
      .catch(function(){content.innerHTML=hdr(CUR)+modeTabs('all')+'<div class="state">Couldn\'t load players.</div>';});
  }
  function setSort(m){renderAll(CUR,ALLCACHE||[],m);}
  window.showWeekly=showWeekly;window.showAll=showAll;window.pickWeek=pickWeek;window.setSort=setSort;

  /* ---- Tournament (standalone result page) ---- */
  function compLogo(d){if(d.logoUrl)return '<span class="vlogo"><img src="'+esc(d.logoUrl)+'" alt=""/></span>';return '<span class="vlogo">'+esc(initials(d.name))+'</span>';}
  function passHref(sl){return 'https://trekkr.online/player/'+sl;}
  function nameLink(p){return '<a class="pl-link" href="'+passHref(p.slug)+'">'+esc(p.name)+'</a>';}
  function pAv(p,cls){cls=cls||'pl-av';if(p&&p.photo)return '<span class="'+cls+'"><img src="'+esc(p.photo)+'" alt="" loading="lazy"/></span>';return '<span class="'+cls+'">'+esc(initials(p&&p.name||''))+'</span>';}
  function compHdr(d,badgeCls,badge){
    var tags='';
    if(d.location)tags+='<span class="vtag"><i class="ti ti-map-pin"></i>'+esc(d.location)+'</span>';
    if(d.status)tags+='<span class="vtag"><i class="ti ti-flag"></i>'+esc(cap(d.status))+'</span>';
    return '<div class="page-head"><a class="back" href="https://trekkr.online/tournament"><i class="ti ti-arrow-left"></i>Tourney &amp; League</a></div>'
      +'<div class="vhero">'+compLogo(d)+'<div class="vinfo"><span class="tbadge '+badgeCls+'">'+badge+'</span>'
      +'<div class="vname">'+esc(d.name)+'</div><div class="vtags">'+tags+'</div></div></div>';
  }
  function tourPodium(d){
    var top=(d.pairs||[]).slice(0,3);
    if(!top.length)return '';
    var labels=['Champion','Runner-up','3rd place'];
    return '<div class="sec-label" style="margin-top:20px">Podium</div><div class="champs">'+top.map(function(pr,i){
      var pls=pr.players||[];
      var avs='<div class="pair-photos">'+pls.map(function(p){return pAv(p,'champ-photo');}).join('')+'</div>';
      var names=pls.map(nameLink).join(' <span class="amp">&amp;</span> ');
      return '<div class="champ champ'+(i+1)+'"><div class="champ-rk">'+(i+1)+'</div>'+avs
        +'<div class="champ-info"><div class="champ-lbl">'+labels[i]+'</div><div class="champ-nm">'+names+'</div>'
        +'<div class="champ-stats"><span class="cs"><b>'+pr.wins+'</b>W</span><span class="cs"><b>'+pr.losses+'</b>L</span><span class="cs"><b>'+pdText(pr.gd)+'</b> diff</span></div></div></div>';
    }).join('')+'</div>';
  }
  function tourPairsTable(d){
    if(!d.pairs||!d.pairs.length)return '<div class="state">No results yet.</div>';
    var rows=d.pairs.map(function(pr){
      var cell=(pr.players||[]).map(function(p){return '<span class="pl-inline">'+pAv(p)+nameLink(p)+'</span>';}).join('<span class="amp"> &amp; </span>');
      return '<tr'+(pr.rank===1?' class="top"':'')+'><td class="rkn">'+pr.rank+'</td><td class="pairc">'+cell+'</td><td>'+pr.wins+'</td><td>'+pr.losses+'</td><td>'+pdText(pr.gd)+'</td></tr>';
    }).join('');
    return '<div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>Pair</th><th>W</th><th>L</th><th>Diff</th></tr>'+rows+'</table></div>';
  }
  function tourPlayersTable(d){
    if(!d.players||!d.players.length)return '<div class="state">No players yet.</div>';
    var rows=d.players.map(function(p){
      return '<tr'+(p.rank===1?' class="top"':'')+'><td class="rkn">'+p.rank+'</td><td class="pairc"><span class="pl-inline">'+pAv(p)+nameLink(p)+'</span></td><td>'+p.wins+'</td><td>'+p.losses+'</td><td class="eloc">'+(p.elo||'—')+'</td></tr>';
    }).join('');
    return '<div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>ELO</th></tr>'+rows+'</table></div>';
  }
  function catBody(cat){
    return tourPodium(cat)
      +'<div class="vmode" style="margin-top:16px"><button class="vmode-b on" data-ct="stand">Standings</button><button class="vmode-b" data-ct="perf">Player Performance</button></div>'
      +'<div class="ct-stand ct-pane"><div class="sec-label" style="margin-top:14px">Final standings &middot; by pair</div>'+tourPairsTable(cat)+'</div>'
      +'<div class="ct-perf ct-pane" style="display:none"><div class="sec-label" style="margin-top:14px">Player performance &middot; ranked by ELO</div>'+tourPlayersTable(cat)+'</div>';
  }
  function wireSubTabs(box){
    var mb=box.querySelectorAll('.vmode-b[data-ct]');
    Array.prototype.forEach.call(mb,function(b){b.addEventListener('click',function(){
      Array.prototype.forEach.call(mb,function(x){x.classList.toggle('on',x===b);});
      box.querySelector('.ct-stand').style.display=b.getAttribute('data-ct')==='stand'?'':'none';
      box.querySelector('.ct-perf').style.display=b.getAttribute('data-ct')==='perf'?'':'none';
    });});
  }
  function loadTournamentPage(cslug){
    content.innerHTML='<div class="skeleton" style="margin-top:26px"></div>';
    fetch(BASE+'/competition/'+encodeURIComponent(cslug)).then(function(r){return r.json();}).then(function(d){
      if(!d||d.error||!d.name){content.innerHTML='<div class="page-head"><a class="back" href="https://trekkr.online/tournament"><i class="ti ti-arrow-left"></i>Tourney &amp; League</a></div><div class="state" style="margin-top:24px">Tournament not found.</div>';return;}
      var html=compHdr(d,'tb-tourney','<i class="ti ti-trophy"></i>Tournament · Single Event');
      var cats=(d.categories||[]).filter(function(c){return (c.pairs&&c.pairs.length)||(c.players&&c.players.length);});
      if(!cats.length){
        html+='<div class="state" style="margin-top:24px">Hasil belum tersedia. Data akan muncul begitu turnamen selesai di-input.</div>';
        content.innerHTML=html;return;
      }
      if(cats.length>1){
        html+='<div class="vmode catbar" style="margin-top:16px">'+cats.map(function(c,i){return '<button class="vmode-b'+(i===0?' on':'')+'" data-ci="'+i+'">'+esc(c.label)+'</button>';}).join('')+'</div>';
      }
      html+='<div id="catBody"></div>';
      content.innerHTML=html;
      var body=document.getElementById('catBody');
      function renderCat(i){ body.innerHTML=catBody(cats[i]); wireSubTabs(body); }
      renderCat(0);
      var cb=content.querySelectorAll('.catbar .vmode-b[data-ci]');
      Array.prototype.forEach.call(cb,function(b){b.addEventListener('click',function(){
        Array.prototype.forEach.call(cb,function(x){x.classList.toggle('on',x===b);});
        renderCat(parseInt(b.getAttribute('data-ci'),10));
      });});
    }).catch(function(){content.innerHTML='<div class="state" style="margin-top:30px">Couldn\'t load tournament.</div>';});
  }

  /* ---- League (standalone result page) ---- */
  function cap(s){s=String(s||'');return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
  function leagueHdr(d){
    var tags='';
    if(d.location)tags+='<span class="vtag"><i class="ti ti-map-pin"></i>'+esc(d.location)+'</span>';
    if(d.status)tags+='<span class="vtag"><i class="ti ti-flag"></i>'+esc(cap(d.status))+'</span>';
    return '<div class="page-head"><a class="back" href="https://trekkr.online/tournament"><i class="ti ti-arrow-left"></i>Tourney &amp; League</a></div>'
      +'<div class="vhero">'+compLogo(d)+'<div class="vinfo"><span class="tbadge tb-league"><i class="ti ti-medal"></i>League · Season</span>'
      +'<div class="vname">'+esc(d.name)+'</div><div class="vtags">'+tags+'</div></div></div>';
  }
  function leagueBoard(title,list){
    if(!list||!list.length)return '<div class="lg-col"><div class="sec-label" style="margin-top:0">'+title+'</div><div class="state">No matches.</div></div>';
    var rows=list.map(function(p){
      return '<tr'+(p.rank===1?' class="top"':'')+'><td class="rkn">'+p.rank+'</td><td class="pairc"><span class="pl-inline">'+pAv(p)+nameLink(p)+'</span></td><td>'+p.wins+'</td><td>'+p.losses+'</td><td>'+pdText(p.gd)+'</td></tr>';
    }).join('');
    return '<div class="lg-col"><div class="sec-label" style="margin-top:0">'+title+'</div>'
      +'<div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>Diff</th></tr>'+rows+'</table></div></div>';
  }
  function leagueViewBody(v){
    return '<div class="lg-boards">'
      +leagueBoard('<span class="dot" style="background:var(--orange)"></span> Men', v.men)
      +leagueBoard('<span class="dot" style="background:var(--red)"></span> Women', v.women)
      +'</div>';
  }
  function loadLeaguePage(cslug){
    content.innerHTML='<div class="skeleton" style="margin-top:26px"></div>';
    fetch(BASE+'/competition/'+encodeURIComponent(cslug)).then(function(r){return r.json();}).then(function(d){
      if(!d||d.error||!d.name){content.innerHTML='<div class="page-head"><a class="back" href="https://trekkr.online/tournament"><i class="ti ti-arrow-left"></i>Tourney &amp; League</a></div><div class="state" style="margin-top:24px">League not found.</div>';return;}
      var html=leagueHdr(d);
      var views=d.views||[];
      if(!views.length){
        html+='<div class="state" style="margin-top:24px">Hasil belum tersedia. Data akan muncul begitu series di-input.</div>';
        content.innerHTML=html;return;
      }
      html+='<div class="vmode lgviews" style="margin-top:16px">'+views.map(function(v,i){return '<button class="vmode-b'+(i===views.length-1?' on':'')+'" data-vi="'+i+'">'+esc(v.label)+'</button>';}).join('')+'</div>';
      html+='<div id="lgBody"></div>';
      content.innerHTML=html;
      var body=document.getElementById('lgBody');
      function renderView(i){ body.innerHTML=leagueViewBody(views[i]); }
      renderView(views.length-1);
      var vb=content.querySelectorAll('.lgviews .vmode-b[data-vi]');
      Array.prototype.forEach.call(vb,function(b){b.addEventListener('click',function(){
        Array.prototype.forEach.call(vb,function(x){x.classList.toggle('on',x===b);});
        renderView(parseInt(b.getAttribute('data-vi'),10));
      });});
    }).catch(function(){content.innerHTML='<div class="state" style="margin-top:30px">Couldn\'t load league.</div>';});
  }

  /* ---- Load ---- */
  var segs=location.pathname.split('/').filter(Boolean);
  var kind=segs.length>=2?segs[segs.length-2].toLowerCase():'';
  if(kind==='tournament'){
    loadTournamentPage(decodeURIComponent(segs[segs.length-1]));
  }else if(kind==='league'){
    loadLeaguePage(decodeURIComponent(segs[segs.length-1]));
  }else{
    var sel=selected();
    fetch(BASE+'/venues').then(function(r){return r.json();}).then(function(d){
      var venues=(d&&d.venues)||[];
      if(!sel){renderDirectory(venues);return;}
      var key=slug(sel);
      var v=venues.filter(function(x){return slug(x.name)===key||(x.name||'').toLowerCase()===String(sel).toLowerCase();})[0];
      if(!v){content.innerHTML='<div class="page-head"><a class="back" href="/"><i class="ti ti-arrow-left"></i>All venues</a></div><div class="state" style="margin-top:24px">Venue not found.</div>';return;}
      openVenue(v);
    }).catch(function(){
      content.innerHTML='<div class="state" style="margin-top:30px">Couldn\'t load venues. Please try again.</div>';
    });
  }
})();
</script>
</body>
</html>
