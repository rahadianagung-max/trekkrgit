<style>
:root{--primary:#003ec7;--primary-container:#0052ff;--secondary-container:#cd4800;--on-surface:#0b1c30;--on-surface-variant:#434656;--on-inverse:#eaf1ff;--on-primary:#fff;--surface:#f8f9ff;--surface-low:#eff4ff;--surface-container:#e5eeff;--surface-high:#dce9ff;--surface-highest:#d3e4fe;--surface-lowest:#fff;--surface-inverse:#213145;--ok:#1f9d63;--danger:#ba1a1a;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-pill:999px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:32px;--rhythm-section:32px;--rhythm-major:48px;--shadow-soft:0 16px 34px rgba(11,28,48,0.08);--motion-base:220ms;--ease-out:cubic-bezier(0.22,0.61,0.36,1)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{color:var(--on-surface);font-family:'Plus Jakarta Sans',sans-serif;line-height:1.45;background:radial-gradient(1200px 500px at 100% -15%,rgba(0,82,255,0.11),transparent 58%),radial-gradient(900px 500px at -10% 110%,rgba(205,72,0,0.1),transparent 54%),var(--surface)}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}h1,h2,h3,p{margin:0}
.container{width:min(1280px,calc(100% - 80px));margin:0 auto}
.site-header{position:sticky;top:0;z-index:50;background:rgba(248,249,255,0.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(115,118,136,0.1)}.site-header__inner{display:flex;align-items:center;justify-content:space-between;min-height:80px}.brand{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:800;letter-spacing:-0.03em;text-transform:uppercase}.nav-links{display:flex;gap:6px}.nav-link{border-radius:var(--radius-pill);padding:9px 18px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--on-surface-variant);transition:all var(--motion-base)}.nav-link:hover{background:var(--surface-container)}.nav-link.is-active{color:var(--primary);background:var(--surface-container)}.header-actions{display:flex;gap:12px}.btn{border:0;border-radius:var(--radius-pill);padding:10px 22px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:all var(--motion-base)}.btn--primary{background:var(--primary);color:var(--on-primary)}.btn--primary:hover{background:var(--primary-container)}.btn--ghost{background:var(--surface-container);color:var(--primary)}.btn--text{background:transparent;color:var(--on-surface-variant)}
/* Venue hero */
.v-hero{position:relative;overflow:hidden;background:linear-gradient(140deg,rgba(0,62,199,0.08),rgba(205,72,0,0.08));padding:var(--rhythm-major) 0}
.v-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(145deg,rgba(248,249,255,0.82),rgba(248,249,255,0.46)),var(--v-bg,url("https://i.ibb.co.com/99jXdc9f/Screen-Shot-2026-04-21-at-01-35-48.png"));background-size:cover;background-position:center;pointer-events:none}
.v-hero>.container{position:relative;z-index:1}
.v-eyebrow{display:inline-flex;padding:5px 12px;border-radius:999px;background:var(--secondary-container);color:#fff;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase}
.v-title{margin-top:14px;font-family:'Space Grotesk',sans-serif;font-size:clamp(48px,10vw,88px);line-height:0.9;letter-spacing:-0.04em;font-weight:900;text-transform:uppercase}
.v-subtitle{margin-top:12px;max-width:740px;color:var(--on-surface-variant);font-size:clamp(15px,2.3vw,20px)}
/* Venue grid */
.section{margin-top:var(--rhythm-section)}.section-title{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.18em;color:var(--on-surface-variant);text-transform:uppercase}
.v-grid{margin-top:16px;display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.v-card{border-radius:var(--radius-xl);overflow:hidden;background:var(--surface-low);box-shadow:var(--shadow-soft);transition:transform var(--motion-base),background var(--motion-base);cursor:pointer}
.v-card:hover{transform:translateY(-2px);background:var(--surface-high)}
.v-card__body{padding:18px;display:grid;gap:8px}
.v-card__region{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--on-surface-variant)}
.v-card__title{font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:0.94;letter-spacing:-0.02em;text-transform:uppercase;font-weight:800}
.v-card__meta{color:var(--on-surface-variant);font-size:13px}
.v-card__footer{margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.v-card__init{width:52px;height:52px;border-radius:var(--radius-lg);background:var(--primary);color:#fff;display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:900;flex-shrink:0}
/* Venue detail */
.vd-hero{position:relative;overflow:hidden;min-height:280px;background:linear-gradient(135deg,#001c6f 0%,#003ec7 100%);color:#fff;padding:var(--rhythm-major) 0}
.vd-hero>.container{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.vd-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(36px,6vw,64px);line-height:0.9;letter-spacing:-0.04em;font-weight:900;text-transform:uppercase}
.vd-subtitle{margin-top:8px;font-size:14px;opacity:0.8}
.vd-info{background:rgba(255,255,255,0.08);border-radius:var(--radius-lg);padding:18px;min-width:240px;backdrop-filter:blur(8px)}
.vd-info-title{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;opacity:0.7}
.vd-info-line{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.vd-info-kpi{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vd-info-label{font-family:'Inter',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:0.6}
.vd-info-value{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;margin-top:2px}
/* Controls */
.vd-controls{padding:16px 0;border-bottom:1px solid rgba(115,118,136,0.12);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vd-week{display:flex;align-items:center;gap:12px}
.vd-week-btn{width:36px;height:36px;border:0;border-radius:var(--radius-md);background:var(--surface-container);color:var(--primary);font-size:16px;font-weight:700;cursor:pointer}
.vd-week-label{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800}
.seg-control{background:var(--surface-container);border-radius:var(--radius-md);padding:4px;display:flex;gap:4px}
.seg-control__item{flex:1;border:0;background:transparent;border-radius:8px;min-height:36px;padding:0 16px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--on-surface-variant);cursor:pointer}
.seg-control__item.is-active{color:var(--primary);background:var(--surface-lowest)}
/* Ranking table */
.data-table-wrap{margin-top:16px;background:var(--surface-low);border-radius:var(--radius-lg);overflow:auto}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--on-surface-variant);background:rgba(203,219,245,0.5);padding:12px 14px}
.data-table td{padding:14px;background:var(--surface-lowest);font-size:14px}
.data-table tr:nth-child(even) td{background:rgba(239,244,255,0.65)}
.data-table tr:hover td{background:var(--surface-highest)}
.data-table tr{cursor:pointer;transition:background var(--motion-base)}
.v-rank{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;color:var(--primary)}
.v-rank--1{color:var(--secondary-container)}
.v-elo{font-family:'Inter',sans-serif;font-weight:700;color:var(--primary)}
/* Top 3 podium cards */
.podium{margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.podium-card{border-radius:var(--radius-xl);padding:24px 20px;text-align:center;cursor:pointer;transition:transform var(--motion-base),box-shadow var(--motion-base)}
.podium-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-soft)}
.podium-card--1{background:linear-gradient(135deg,#001c6f,#003ec7);color:#fff;grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:380px}
.podium-card--2{background:var(--surface-container)}
.podium-card--3{background:var(--surface-container)}
.podium-rank{font-family:'Space Grotesk',sans-serif;font-weight:900;opacity:0.25;line-height:1}
.podium-card--1 .podium-rank{font-size:72px}
.podium-card--2 .podium-rank,.podium-card--3 .podium-rank{font-size:48px;color:var(--on-surface)}
.podium-avatar{border-radius:50%;object-fit:cover;margin:16px auto 12px;display:block}
.podium-card--1 .podium-avatar{width:120px;height:120px;border:4px solid rgba(255,255,255,0.25);box-shadow:0 12px 32px rgba(0,0,0,0.3)}
.podium-card--2 .podium-avatar,.podium-card--3 .podium-avatar{width:80px;height:80px;border:3px solid var(--surface-highest);box-shadow:0 8px 20px rgba(11,28,48,0.08)}
.podium-name{font-family:'Space Grotesk',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.02em;margin-top:4px}
.podium-card--1 .podium-name{font-size:24px}
.podium-card--2 .podium-name,.podium-card--3 .podium-name{font-size:16px}
.podium-tier{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-top:4px}
.podium-card--1 .podium-tier{opacity:0.8}
.podium-card--2 .podium-tier,.podium-card--3 .podium-tier{color:var(--on-surface-variant)}
.podium-stats{margin-top:10px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.06em}
.podium-card--1 .podium-stats{opacity:0.75}
.podium-card--2 .podium-stats,.podium-card--3 .podium-stats{color:var(--on-surface-variant)}
/* Table avatar */
.tbl-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-highest);flex-shrink:0}
.tbl-player{display:flex;align-items:center;gap:10px}
@media(max-width:767px){.podium{grid-template-columns:1fr}.podium-card--1{grid-row:auto;min-height:280px}}
/* States */
.state-panel{margin-top:var(--rhythm-section);background:var(--surface-container);border-radius:var(--radius-xl);padding:44px 28px;text-align:center}
.state-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4vw,48px);line-height:0.95;letter-spacing:-0.03em;text-transform:uppercase}
.state-copy{margin:10px auto 0;max-width:700px;color:var(--on-surface-variant);font-size:16px}
/* Footer */
.site-footer{margin-top:72px;border-top:1px solid rgba(115,118,136,0.12);padding:var(--space-7) 0}
.site-footer__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.footer-brand{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase}
.footer-links{display:flex;gap:20px;font-size:13px;color:var(--on-surface-variant)}
.footer-copy{font-size:12px;color:var(--on-surface-variant)}
@media(max-width:1023px){.container{width:min(100%,calc(100% - 48px))}.nav-links{display:none}.v-grid{grid-template-columns:repeat(2,1fr)}.vd-hero>.container{grid-template-columns:1fr}}
@media(max-width:767px){.container{width:min(100%,calc(100% - 32px))}.header-actions{display:none}.v-grid{grid-template-columns:1fr}.vd-hero>.container{grid-template-columns:1fr}}

/* ── CALIBRATION STATUS PILLS ─────────────────────────────────── */
.pill-cal {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  background: rgba(205,72,0,0.1); border: 1px solid rgba(205,72,0,0.25);
  font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: #cd4800;
  white-space: nowrap; vertical-align: middle;
}
.pill-cal .cdot {
  width: 5px; height: 5px; border-radius: 50%; background: #cd4800; flex-shrink: 0;
  animation: cpulse 1.4s ease-out infinite;
}
@keyframes cpulse {
  0%  { box-shadow: 0 0 0 0 rgba(205,72,0,0.5); }
  70% { box-shadow: 0 0 0 5px rgba(205,72,0,0); }
  100%{ box-shadow: 0 0 0 0 rgba(205,72,0,0); }
}
.pill-rated {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  background: rgba(0,62,199,0.08); border: 1px solid rgba(0,62,199,0.2);
  font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--primary);
  white-space: nowrap; vertical-align: middle;
}
/* Light versions for dark podium card #1 */
.pill-cal--light {
  background: rgba(255,255,255,0.15); border-color: rgba(255,140,0,0.5); color: #ffb366;
}
.pill-rated--light {
  background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); color: rgba(234,241,255,0.85);
}

/* ── BADGE CHIPS ───────────────────────────────────────────────── */
.badge-strip { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; justify-content: center; }
.badge-chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 8px; border-radius: 999px;
  font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  white-space: nowrap; transition: transform 0.15s; cursor: default;
}
.badge-chip:hover { transform: scale(1.06); }
.badge-chip.common   { background: rgba(100,116,139,0.12); color:#475569; border:1px solid rgba(100,116,139,0.2); }
.badge-chip.uncommon { background: rgba(0,62,199,0.1);     color:var(--primary); border:1px solid rgba(0,62,199,0.2); }
.badge-chip.rare     { background: rgba(124,58,237,0.1);   color:#7C3AED; border:1px solid rgba(124,58,237,0.2); }
.badge-chip.epic     { background: rgba(245,158,11,0.1);   color:#D97706; border:1px solid rgba(245,158,11,0.2); }
.badge-chip.legendary{ background: rgba(220,38,38,0.1);    color:#DC2626; border:1px solid rgba(220,38,38,0.2); }
/* Light versions for dark card */
.badge-chip--light   { background: rgba(255,255,255,0.13) !important; color:rgba(234,241,255,0.9) !important; border-color:rgba(255,255,255,0.22) !important; }

/* ── WEEKLY TOP PLAYERS — bigger title ─────────────────────────── */
.weekly-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 900; text-transform: uppercase;
  letter-spacing: -0.03em; line-height: 0.95;
  margin-bottom: 16px;
}
.weekly-title span { color: var(--secondary-container); }

/* ── PODIUM ENHANCEMENTS ────────────────────────────────────────── */
/* Tier dot */
.tier-dot-wrap {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase;
}
.tier-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

/* Table tier dot */
.tbl-tier { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.tbl-tier-name {
  font-size: 10px; color: var(--on-surface-variant);
  text-transform: uppercase; font-weight: 700; letter-spacing: 0.09em;
}
.tbl-player-col { display: flex; flex-direction: column; }
.tbl-pills { display: flex; align-items: center; gap: 5px; margin-top: 4px; flex-wrap: wrap; }


/* ── VENUE VALUE PROP SECTION ──────────────────────────────────── */
.venue-value{padding:64px 0;background:var(--surface-lowest);border-bottom:1px solid rgba(115,118,136,0.1)}
.venue-value__header{text-align:center;margin-bottom:48px}
.venue-value__eyebrow{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--primary);margin-bottom:12px}
.venue-value__title{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-0.03em;text-transform:uppercase;line-height:1}
.venue-value__sub{margin-top:10px;font-size:16px;color:var(--on-surface-variant);max-width:520px;margin-left:auto;margin-right:auto}
.venue-value__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.venue-value-card{background:var(--surface-low);border-radius:var(--radius-xl);padding:24px 20px;transition:transform 220ms,box-shadow 220ms}
.venue-value-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(11,28,48,0.08)}
.venue-value-card__icon{width:44px;height:44px;border-radius:var(--radius-lg);background:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:20px}
.venue-value-card__title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:8px}
.venue-value-card__desc{font-size:13px;color:var(--on-surface-variant);line-height:1.6}
.venue-value-cta{margin-top:40px;text-align:center;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@media(max-width:1023px){.venue-value__grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:767px){.venue-value__grid{grid-template-columns:1fr}.venue-value{padding:40px 0}}

/* ── MOBILE NAV (venue page) ─────────────────────────────────── */
.mobile-nav{display:none;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:rgba(248,249,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(115,118,136,0.12);position:sticky;top:80px;z-index:49;padding:0 16px}
.mobile-nav::-webkit-scrollbar{display:none}
.mobile-nav__inner{display:flex;gap:4px;padding:8px 0;width:max-content;min-width:100%}
.mobile-nav__link{display:inline-flex;align-items:center;white-space:nowrap;padding:8px 16px;border-radius:var(--radius-pill);font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--on-surface-variant);text-decoration:none;transition:all 180ms ease}
.mobile-nav__link:hover{background:var(--surface-container)}
.mobile-nav__link.is-active{color:var(--primary);background:var(--surface-container)}
.mobile-nav__link--cta{color:var(--primary);border:1.5px solid rgba(0,62,199,0.25);background:var(--surface-low)}
.mobile-nav__link--cta:hover{background:var(--surface-container)}
@media(max-width:1023px){.mobile-nav{display:block}}
</style>
</head>

<script>

// ── CALIBRATION & BADGE HELPERS ──────────────────────────────────────────
const CALIB_MIN = 15;
const TIER_COLORS = {
  'Platinum':'#6B7280','Gold':'#D97706','Silver':'#64748B',
  'Upper Bronze':'#92400E','Bronze':'#B45309','Lower Bronze':'#78350F',
  'Upper Beginner':'#3B82F6','Beginner':'#94A3B8',
};

function statusPill(totalMatches, light=false) {
  const cal = (totalMatches||0) < CALIB_MIN;
  if (cal) {
    return `<span class="pill-cal${light?' pill-cal--light':''}"><span class="cdot"></span>Calibrating</span>`;
  }
  return `<span class="pill-rated${light?' pill-rated--light':''}">✓ Rated</span>`;
}

function tierDotHTML(tierName, light=false) {
  const col = TIER_COLORS[tierName] || '#94A3B8';
  const textCol = light ? 'rgba(234,241,255,0.8)' : 'var(--on-surface-variant)';

}

// Badge definitions — computed from leaderboard data fields
const VENUE_BADGES = [
  { id:'centurion', emoji:'🎖️', name:'Veteran',     rarity:'uncommon', fn: p => (p.totalMatches||p.w+p.l||0) >= 100 },
  { id:'legend',    emoji:'🏛️', name:'Legend',      rarity:'epic',     fn: p => (p.totalMatches||p.w+p.l||0) >= 500 },
  { id:'dominator', emoji:'💥', name:'Dominator',   rarity:'rare',     fn: p => (p.w+p.l)>=10 && p.w/(p.w+p.l)>=0.7 },
  { id:'flawless',  emoji:'🎯', name:'Clutch',      rarity:'uncommon', fn: p => p.w >= 5 && p.l === 0 },
  { id:'onfire',    emoji:'🔥', name:'On Fire',     rarity:'rare',     fn: p => /^([5-9]|\d{2,})W/.test(p.streak||'') },
  { id:'gold',      emoji:'🥇', name:'Gold Tier',   rarity:'epic',     fn: p => (p.elo||0) >= 2500 },
  { id:'silver',    emoji:'🥈', name:'Silver',      rarity:'rare',     fn: p => (p.elo||0) >= 2100 },
  { id:'bronze',    emoji:'🥉', name:'Bronze',      rarity:'uncommon', fn: p => (p.elo||0) >= 1500 },
  { id:'consistent',emoji:'📈', name:'Consistent',  rarity:'uncommon', fn: p => (p.winRate||0) >= 60 && (p.w+p.l) >= 10 },
  { id:'ironman',   emoji:'💪', name:'Ironman',     rarity:'rare',     fn: p => (p.w+p.l) >= 30 },
];

function earnedBadges(player) {
  // Enrich totalMatches if not present
  if (!player.totalMatches) player.totalMatches = (player.w||0) + (player.l||0);
  return VENUE_BADGES.filter(b => { try{ return b.fn(player); } catch(e){ return false; } });
}

function badgeStrip(player, light=false, max=5) {
  const earned = earnedBadges(player);
  if (!earned.length) return '';
  const show = earned.slice(0, max);
  const chips = show.map(b =>
    `<span class="badge-chip ${b.rarity}${light?' badge-chip--light':''}" title="${b.name}">${b.emoji} ${b.name}</span>`
  ).join('');
  const more = earned.length > max
    ? `<span class="badge-chip common${light?' badge-chip--light':''}" title="${earned.length - max} more">+${earned.length - max}</span>`
    : '';
  return `<div class="badge-strip">${chips}${more}</div>`;
}

let cG='M',cW=getCW(),vName='',vData=null;

function getCW(){const d=new Date(),s=new Date(d.getFullYear(),0,1),df=d-s+(s.getTimezoneOffset()-d.getTimezoneOffset())*60000;return Math.ceil((df/86400000+s.getDay()+1)/7)}
function switchGender(g){cG=g;document.querySelectorAll('.seg-control__item').forEach(t=>t.classList.toggle('is-active',t.dataset.gender===g));loadRanking()}
function changeWeek(d){cW+=d;if(cW<1)cW=1;document.getElementById('weekLabel').textContent=`Week ${cW}`;loadRanking()}

// --- FUNGSI MENGUBAH ANGKA ELO MENJADI TEKS LEVEL (TIER) ---
function getTierName(elo) {
  if (elo >= 3000) return "Platinum";
  if (elo >= 2500) return "Gold";
  if (elo >= 2100) return "Silver";
  if (elo >= 1800) return "Upper Bronze";
  if (elo >= 1500) return "Bronze";
  if (elo >= 1200) return "Lower Bronze";
  if (elo >= 900) return "Upper Beginner";
  return "Beginner";
}


async function shareVenuePage(venueName) {
  const slug = venueName.trim().replace(/\s+/g, '');
  const url = `https://venue.trekkr.online/${encodeURIComponent(slug)}`;
  const text = `Cek leaderboard ${venueName} di Trekkr!\n${url}`;
  if (navigator.share) {
    try { await navigator.share({ title: `Trekkr – ${venueName}`, text, url }); return; } catch(e) {}
  }
  // WhatsApp fallback
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

async function loadRanking(){

    if(!d.ranking||!d.ranking.length){c.innerHTML='<div class="state-panel"><h2 class="state-title">No Data</h2><p class="state-copy">No matches found for this week</p></div>';loadMatchHistory();return}

      const lb=await TrekkrAPI.getNationalLeaderboard({limit:200});

            photoUrl:     p.photoUrl||'',
            displayName:  p.displayName||p.name,
            // Extra stats from updated backend (sheet.js patch)
            totalMatches: p.totalMatches||0,

            totalL:       p.totalL||0,

      }

    // 3. Helper: get avatar URL

      const info=photoMap[p.name.toLowerCase()];
