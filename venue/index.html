<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trekkr — Venue Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c12;--s1:#10131a;--s2:#161a24;--s3:#1c2130;--border:#1e2333;--border2:#2a3045;--lime:#d4f53c;--lime2:#b8d930;--coral:#ff5757;--text:#eeeef5;--muted:#4a5068;--muted2:#6b7394}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:1}

/* Header Styles */
.header{text-align:center;margin-bottom:40px}
.venue-name{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--lime);margin-bottom:8px;text-transform:uppercase}
.venue-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:2px}

/* Leaderboard Grid */
.leaderboard-grid{display:flex;flex-direction:column;gap:12px}

/* Base Player Card */
.player-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px;transition:all 0.2s}
.player-card:hover{border-color:var(--border2);transform:translateY(-2px)}

/* Top 1 & 2 Card Enhancements (Megacard) */
.player-card.top-card{background:var(--s2);border-color:var(--lime);padding:24px;flex-direction:column;text-align:center;box-shadow:0 8px 32px rgba(212,245,60,0.05)}
.player-card.top-card .rank-num{font-size:24px;color:var(--lime);position:absolute;top:16px;left:20px}
.player-card.top-card .player-avatar{width:80px;height:80px;margin:0 auto}
.player-card.top-card .player-info{flex:none;align-items:center;margin-top:12px}
.player-card.top-card .player-name{font-size:22px}
.player-card.top-card .player-stats{flex-direction:row;justify-content:center;gap:24px;width:100%;margin-top:16px}

/* Elements inside Card */
.rank-num{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);font-weight:700;width:30px}
.player-avatar{width:48px;height:48px;border-radius:50%;background:var(--s3);border:2px solid var(--border2);flex-shrink:0;overflow:hidden}
.player-avatar img{width:100%;height:100%;object-fit:cover}

.player-info{flex:1;display:flex;flex-direction:column;gap:4px}
.player-name{font-size:16px;font-weight:700;letter-spacing:0.5px}

.player-tier{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:4px;display:inline-block;width:max-content}
.tier-platinum{background:rgba(229,228,226,0.1);color:#e5e4e2;border:1px solid #e5e4e2}
.tier-gold{background:rgba(255,215,0,0.1);color:#ffd700;border:1px solid #ffd700}
.tier-silver{background:rgba(192,192,192,0.1);color:#c0c0c0;border:1px solid #c0c0c0}
.tier-ubronze{background:rgba(205,127,50,0.15);color:#cd7f32;border:1px solid #cd7f32}
.tier-bronze{background:rgba(205,127,50,0.1);color:#b06d29;border:1px solid #b06d29}
.tier-lbronze{background:rgba(205,127,50,0.05);color:#8c5620;border:1px solid #8c5620}
.tier-ubeginner{background:rgba(107,115,148,0.15);color:var(--muted2);border:1px solid var(--muted2)}
.tier-beginner{background:rgba(74,80,104,0.1);color:var(--muted);border:1px solid var(--muted)}

.player-stats{display:flex;gap:16px;text-align:right}
.stat-box{display:flex;flex-direction:column}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--lime)}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px}

.loading-state{text-align:center;padding:40px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px}
.error-state{text-align:center;padding:20px;color:var(--coral);background:rgba(255,87,87,0.1);border:1px solid rgba(255,87,87,0.3);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px}

footer{border-top:1px solid var(--border);padding-top:24px;margin-top:60px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px}
footer span{color:var(--lime)}
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div class="venue-name" id="venueTitle">LOADING VENUE...</div>
        <div class="venue-sub" id="venueSubtitle">WEEKLY STANDINGS</div>
    </div>

    <div id="statusArea" class="loading-state">Fetching latest matches and ELO...</div>
    
    <div class="leaderboard-grid" id="rankingContainer"></div>

    <footer>TREKKR · <span>VENUE RANKING</span> · © 2026</footer>
</div>

<script src="https://trekkr.online/trekkr-api.js"></script>

<script>
async function loadVenueRanking() {
    // Membaca nama venue dari link URL (misal: venue.trekkr.online/Stellar Squad)
    const rawPath = window.location.pathname.replace(/^\//, '');
    const venueName = decodeURIComponent(rawPath);

    const titleEl = document.getElementById('venueTitle');
    const statusEl = document.getElementById('statusArea');
    const container = document.getElementById('rankingContainer');

    if (!venueName || venueName === "index.html") {
        titleEl.textContent = "VENUE NOT FOUND";
        statusEl.innerHTML = "Please access this page via a valid venue link.<br>(e.g., venue.trekkr.online/NamaVenue)";
        statusEl.className = "error-state";
        return;
    }

    titleEl.textContent = venueName;

    try {
        // Karena script API di load dari trekkr.online, kita bisa pakai BASE fetch langsung
        const response = await fetch(`https://trekkr.online/api/venues/${encodeURIComponent(venueName)}/ranking`);
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Failed to load ranking");
        
        statusEl.style.display = 'none';

        if (!data.ranking || data.ranking.length === 0) {
            container.innerHTML = `<div class="loading-state">No matches recorded for this venue yet.</div>`;
            return;
        }

        let html = '';
        data.ranking.forEach((p, index) => {
            const rank = index + 1;
            
            // Tarik nama dan warna kelas dari TrekkrAPI
            const tierName = TrekkrAPI.getTierName(p.elo);
            const tierClass = TrekkrAPI.getTierClass(p.elo);
            
            // Foto fallback jika kosong
            const avatarImg = p.photoUrl ? p.photoUrl : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=10131a&color=d4f53c&bold=true`;

            // Membuat rank 1 dan 2 menggunakan class 'top-card' (Lebih besar)
            const cardClass = rank <= 2 ? 'player-card top-card' : 'player-card';

            html += `
            <div class="${cardClass}">
                <div class="rank-num">#${rank}</div>
                
                <div class="player-avatar">
                     <img src="${avatarImg}" alt="${p.name}">
                </div>

                <div class="player-info">
                    <div class="player-name">${p.name}</div>
                    <div class="player-tier ${tierClass}">${tierName}</div>
                </div>
                
                <div class="player-stats">
                    <div class="stat-box">
                        <span class="stat-val">${p.elo}</span>
                        <span class="stat-lbl">ELO</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val">${p.w}W - ${p.l}L</span>
                        <span class="stat-lbl">RECORD</span>
                    </div>
                </div>
            </div>
            `;
        });
        
        container.innerHTML = html;

    } catch (e) {
        statusEl.textContent = e.message;
        statusEl.className = "error-state";
    }
}

// Jalankan ketika halaman selesai di-load
window.addEventListener('DOMContentLoaded', loadVenueRanking);
</script>
</body>
</html>
