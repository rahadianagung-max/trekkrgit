<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Akun Pemain — Trekkr</title>
<meta name="robots" content="noindex"/>
<style>body{font-family:system-ui,sans-serif;background:#F7F7F8;color:#16161A;display:flex;min-height:100dvh;align-items:center;justify-content:center;margin:0}</style>
</head>
<body>
<p>Mengalihkan ke halaman login…</p>
<script>
// /akun is retired — the account area now lives at /login (and /reset for password recovery).
// Preserve any Supabase auth hash so old confirmation/recovery links still work.
(function(){
  var h = location.hash || "";
  var isRecovery = /type=recovery/.test(h);
  var base = (location.hostname==="trekkr.online"||location.hostname.endsWith(".vercel.app")) ? "" : "https://trekkr.online";
  location.replace(base + (isRecovery ? "/reset" : "/login") + h);
})();
</script>
</body>
</html>
