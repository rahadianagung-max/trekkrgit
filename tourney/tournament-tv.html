<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trekkr · TV Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0c0f0d; --panel:#131815; --panel2:#171d1a; --line:#28312c;
    --text:#e9f0ec; --muted:#8a968f; --faint:#5d655f;
    --accent:#c8f24e; --accent2:#7fe0a8; --danger:#ff6f60; --warn:#ffd166;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:radial-gradient(1200px 700px at 80% -10%, #15201a 0%, var(--bg) 55%);
    color:var(--text); font-family:'Hanken Grotesk',sans-serif; overflow:hidden;}
  .screen{height:100vh; display:flex; flex-direction:column; padding:2.2vh 2.2vw;}
  /* top bar */
  .bar{display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; margin-bottom:1.8vh;}
  .logo{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(24px,3vw,48px); letter-spacing:-.02em;}
  .logo span{color:var(--accent);}
  .ev{text-align:center;}
  .ev .nm{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:clamp(18px,2vw,32px);}
  .ev .mt{font-family:'Space Mono',monospace; font-size:clamp(10px,.9vw,15px); color:var(--muted); margin-top:.3vh; letter-spacing:.06em;}
  .clock{text-align:right; font-family:'Space Mono',monospace;}
  .clock .t{font-size:clamp(20px,2.4vw,40px); font-weight:700;}
  .clock .l{font-size:clamp(9px,.8vw,13px); color:var(--accent2); letter-spacing:.12em;}
  /* main split */
  .main{flex:1 1 auto; min-height:0; display:flex; gap:1.6vw;}
  .left{flex:0 0 39%; min-width:0; display:flex; flex-direction:column; min-height:0;}
  .right{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; min-height:0; overflow:hidden;}
  .col-title{font-family:'Space Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
    font-size:clamp(11px,1vw,17px); margin:0 0 1.1vh; flex:0 0 auto;}
  .col-title.up{margin-top:1.6vh; color:var(--accent2);}
  /* avatars */
  .av{ --s:42px; position:relative; width:var(--s); height:var(--s); border-radius:50%; overflow:hidden;
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:linear-gradient(135deg,#1d2622,#27332c); border:1px solid var(--line);}
  .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .av i{ font-style:normal; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; color:var(--accent2); font-size:calc(var(--s)*.44); }
  /* now playing cards */
  #nowWrap{display:flex; flex-direction:column; gap:1.4vh;}
  .np-card{border:1px solid rgba(200,242,78,.5); border-radius:16px; background:rgba(200,242,78,.05); padding:1.6vh 1.4vw;}
  .np-head{display:flex; align-items:center; gap:.8vw; margin-bottom:1.2vh;}
  .np-court{font-family:'Space Mono',monospace; font-weight:700; color:var(--accent2); font-size:clamp(13px,1.25vw,22px); letter-spacing:.03em;}
  .np-meta{font-family:'Space Mono',monospace; color:var(--muted); font-size:clamp(10px,.85vw,14px);}
  .np-badge{margin-left:auto; font-family:'Space Mono',monospace; font-size:clamp(10px,.8vw,13px); font-weight:700;
    color:var(--bg); background:var(--accent); padding:.4vh .8vw; border-radius:7px; letter-spacing:.04em;}
  .np-teams{display:flex; flex-direction:column; gap:1vh;}
  .tmblk{display:flex; gap:1.1vw;}
  .tmblk .pl{display:flex; align-items:center; gap:.6vw; min-width:0; flex:1 1 50%;}
  .tmblk .av{--s:clamp(40px,4.2vw,84px);}
  .tmblk .plnm{font-weight:600; font-size:clamp(15px,1.55vw,28px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .np-vs{font-family:'Space Mono',monospace; color:var(--faint); font-size:clamp(11px,1vw,16px); text-align:center; letter-spacing:.18em;}
  .np-empty,.up-empty{color:var(--faint); font-family:'Space Mono',monospace; font-size:clamp(13px,1.1vw,18px); padding:2vh 0;}
  /* upcoming rows */
  #nextWrap{display:flex; flex-direction:column; gap:1vh; overflow:hidden;}
  .up-row{display:flex; align-items:center; gap:.9vw; border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:1vh 1vw;}
  .up-when{display:flex; flex-direction:column; align-items:center; flex:0 0 auto; min-width:4.4vw;}
  .up-court{font-family:'Space Mono',monospace; font-weight:700; color:var(--accent2); font-size:clamp(11px,.95vw,16px);}
  .up-time{font-family:'Space Mono',monospace; color:var(--muted); font-size:clamp(11px,1vw,18px);}
  .up-mid{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:.7vw;}
  .up-side{display:flex; align-items:center; gap:.45vw; min-width:0; flex:1 1 50%;}
  .up-side .av{--s:clamp(26px,1.9vw,40px);}
  .up-nm{font-weight:600; font-size:clamp(12px,1.05vw,19px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .up-x{font-family:'Space Mono',monospace; color:var(--faint); font-size:clamp(10px,.8vw,13px);}
  .up-lb{flex:0 0 auto; max-width:9vw; text-align:right; font-family:'Space Mono',monospace; color:var(--faint);
    font-size:clamp(9px,.75vw,12px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* standings */
  #standWrap{overflow:hidden; display:flex; flex-direction:column; gap:1.6vh;}
  .cat-block{display:flex; flex-direction:column; gap:1vh;}
  .cat-head{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:clamp(15px,1.5vw,26px); display:flex; align-items:baseline; gap:.9vw; flex-wrap:wrap;}
  .cat-cap{font-family:'Space Mono',monospace; font-weight:400; font-size:clamp(9px,.8vw,13px); color:var(--muted); letter-spacing:.02em;}
  .grp-grid{display:grid; gap:1.2vh 1.2vw; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); align-content:start;}
  .grp{border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:1.1vh 1vw; overflow:hidden;}
  .grp-h{font-family:'Space Mono',monospace; font-weight:700; color:var(--accent2); font-size:clamp(11px,1vw,17px); letter-spacing:.04em; margin-bottom:.7vh;}
  table.st{width:100%; border-collapse:collapse;}
  table.st th{font-family:'Space Mono',monospace; font-weight:400; color:var(--faint); text-transform:uppercase; letter-spacing:.03em;
    font-size:clamp(8px,.72vw,12px); text-align:center; padding:.3vh .25vw; border-bottom:1px solid var(--line);}
  table.st th:nth-child(2){text-align:left;}
  table.st td{font-size:clamp(11px,1.05vw,18px); padding:.55vh .25vw; text-align:center; border-bottom:1px solid rgba(40,49,44,.5);}
  table.st td.rk{font-family:'Space Mono',monospace; color:var(--accent2); width:1.8em;}
  table.st td.nm{text-align:left; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:0; width:99%;}
  table.st tr:last-child td{border-bottom:none;}
  table.st tr.champ td{background:rgba(200,242,78,.07);} table.st tr.champ td.rk{color:var(--accent); font-weight:700;}
  table.st tr.prosp td{background:rgba(127,224,168,.06);} table.st tr.prosp td.rk{color:var(--accent2);}
  table.st tr.top td{background:rgba(200,242,78,.07);} table.st tr.top td.rk{color:var(--accent); font-weight:700;}
  .center{display:flex; align-items:center; justify-content:center; height:100%; color:var(--faint);
    font-family:'Space Mono',monospace; font-size:clamp(14px,1.4vw,22px); text-align:center; padding:2vh;}
</style>
</head>
<body>
<div class="screen">
  <div class="bar">
    <div class="logo">Trekk<span>r</span></div>
    <div class="ev"><div class="nm" id="evnm">—</div><div class="mt" id="evmt"></div></div>
    <div class="clock"><div class="t" id="clock">--:--</div><div class="l" id="livedot">● LIVE</div></div>
  </div>
  <div class="main">
    <div class="left">
      <div class="col-title">Sedang Berlangsung</div>
      <div id="nowWrap"><div class="np-empty">Memuat…</div></div>
      <div class="col-title up">Berikutnya</div>
      <div id="nextWrap"></div>
    </div>
    <div class="right">
      <div class="col-title">Klasemen Grup</div>
      <div id="standWrap"><div class="center">Memuat data turnamen…</div></div>
    </div>
  </div>
</div>

<script>
const BASE = location.hostname === "trekkr.online" ? "/api" : "https://trekkr.online/api";
const qs = new URLSearchParams(location.search);
const EVENT_ID = qs.get("event");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { data:null };
const TIER = { MAIN:"Bracket Utama", CHAMPION:"Champion", PROSPECT:"Prospect" };

async function api(p){ const r=await fetch(BASE+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function fmtTime(t){ const s=String(t==null?"":t).trim(); if(!s) return ""; const ap=/(am|pm)/i.exec(s); const x=s.replace(/\s*(am|pm)/i,"").trim(); const pp=x.split(/[:.]/); let h=parseInt(pp[0],10), m=parseInt(pp[1],10); if(isNaN(h)) return s; if(isNaN(m)) m=0; if(ap){const pm=/pm/i.test(ap[0]); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0;} h=((h%24)+24)%24; m=((m%60)+60)%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function normName(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }
function tick(){ document.getElementById("clock").textContent = new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}); }

function photoOf(name){ const p=state.data.players && state.data.players[normName(name)]; return (p&&p.photo)?p.photo:""; }
function avatar(name,size){ const ph=photoOf(name); const init=(String(name||"?").trim()[0]||"?").toUpperCase();
  return `<span class="av" style="--s:${size}"><i>${esc(init)}</i>${ph?`<img src="${esc(ph)}" alt="" onerror="this.remove()"/>`:""}</span>`; }
function pairPlayers(c, eid){ const e=c.entrants && c.entrants[eid]; if(!e) return [eid||"TBD",""]; return [e.player1||"", e.player2||""]; }

function teamBlock(c, eid, sz){
  const [p1,p2]=pairPlayers(c,eid);
  const chip=(n)=>`<div class="pl">${avatar(n,sz)}<span class="plnm">${esc(n)||"TBD"}</span></div>`;
  return `<div class="tmblk">${chip(p1)}${p2?chip(p2):""}</div>`;
}
function nowCard(f){
  return `<div class="np-card">
    <div class="np-head"><span class="np-court">LAP ${esc(f.court)}</span>
      <span class="np-meta">${esc(f.label)}${f.time?` · ${fmtTime(f.time)}`:""}</span>
      <span class="np-badge">BERLANGSUNG</span></div>
    <div class="np-teams">
      ${teamBlock(f.c,f.eA,"clamp(40px,4.2vw,84px)")}
      <div class="np-vs">VS</div>
      ${teamBlock(f.c,f.eB,"clamp(40px,4.2vw,84px)")}
    </div></div>`;
}
function upRow(f){
  const [a1,a2]=pairPlayers(f.c,f.eA), [b1,b2]=pairPlayers(f.c,f.eB);
  const side=(x,y)=>`<div class="up-side">${avatar(x,"clamp(26px,1.9vw,40px)")}${y?avatar(y,"clamp(26px,1.9vw,40px)"):""}<span class="up-nm">${esc(x)}${y?" & "+esc(y):""}</span></div>`;
  return `<div class="up-row">
    <div class="up-when"><span class="up-court">LAP ${esc(f.court||"?")}</span><span class="up-time">${f.time?fmtTime(f.time):"—"}</span></div>
    <div class="up-mid">${side(a1,a2)}<span class="up-x">vs</span>${side(b1,b2)}</div>
    <div class="up-lb">${esc(f.label)}</div>
  </div>`;
}

function buildFeed(){
  const d=state.data, feed=[];
  d.categories.forEach(c=>{
    (c.schedule||[]).forEach(m=> feed.push({ key:m.matchId, c, court:m.court, sortKey:(m.slot||0),
      time:m.time, label:`${c.category} · Grup ${m.groupLabel}`, eA:m.entrantA, eB:m.entrantB, status:m.status }));
    (c.playoff||[]).forEach(b=> (b.rounds||[]).forEach(r=> (r.matches||[]).forEach(m=>{
      if(m.status==="BYE" || !m.entrantA || !m.entrantB) return;
      feed.push({ key:m.matchId, c, court:m.court, sortKey:100000+(parseInt(m.round)||0)*100+(m.idx||0),
        time:m.time, label:`${c.category} · ${TIER[b.tier]||b.tier}`, eA:m.entrantA, eB:m.entrantB, status:m.status });
    })));
  });
  feed.sort((a,b)=> (a.sortKey-b.sortKey) || ((a.court||0)-(b.court||0)));
  return feed;
}

function standHtml(){
  const out = state.data.categories.map(c=>{
    if(!c.groups || !c.groups.some(g=>g.standings.length)) return "";
    const N=c.advancersPerGroup||0, split=String(c.format||"").toUpperCase()==="SPLIT";
    const cap = split ? `Rank 1${N>1?`–${N}`:""} → Championship Bracket · Rank ${N+1}+ → Prospect Bracket` : (N?`Top ${N} lolos`:"");
    const grps=c.groups.map(g=>{
      const denom=Math.max(1,(g.standings.length||1)-1);
      const rows=g.standings.map(s=>{
        const cls= split?(s.rank<=N?"champ":"prosp"):(N&&s.rank<=N?"top":"");
        return `<tr class="${cls}"><td class="rk">${s.rank}</td><td class="nm">${esc(s.team)}</td>
          <td>${s.played}/${denom}</td><td>${s.wins}</td><td>${s.losses}</td>
          <td>${s.gd>0?"+":""}${s.gd}</td><td>${s.gf}</td><td>${s.ga!=null?s.ga:""}</td></tr>`;
      }).join("");
      return `<div class="grp"><div class="grp-h">Grup ${esc(g.label)}</div>
        <table class="st"><thead><tr><th>#</th><th>Pasangan</th><th>Played</th><th>Win</th><th>Lose</th><th>PD</th><th>PF</th><th>PA</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }).join("");
    return `<div class="cat-block"><div class="cat-head">${esc(c.category)}${cap?`<span class="cat-cap">${cap}</span>`:""}</div>
      <div class="grp-grid">${grps}</div></div>`;
  }).join("");
  return out || '<div class="center">Belum ada klasemen. Input skor babak grup dulu.</div>';
}

function render(){
  if(!state.data) return;
  const feed=buildFeed();
  const playSeen={};
  feed.forEach(f=>{ if(f.status!=="DONE" && f.court && playSeen[f.court]===undefined) playSeen[f.court]=f; });
  const playing=Object.keys(playSeen).sort((a,b)=>a-b).map(k=>playSeen[k]);
  const playingIds=new Set(playing.map(f=>f.key));
  const upcoming=feed.filter(f=> f.status!=="DONE" && !playingIds.has(f.key)).slice(0,2);

  document.getElementById("nowWrap").innerHTML = playing.length ? playing.map(nowCard).join("") : '<div class="np-empty">Tidak ada match yang sedang berlangsung.</div>';
  document.getElementById("nextWrap").innerHTML = upcoming.length ? upcoming.map(upRow).join("") : '<div class="up-empty">Tidak ada match berikutnya.</div>';
  document.getElementById("standWrap").innerHTML = standHtml();
}

async function load(){
  try{
    const d=await api("/tournament/event/"+encodeURIComponent(EVENT_ID)+"/public");
    state.data=d;
    document.getElementById("evnm").textContent=d.event.name||"Turnamen";
    document.getElementById("evmt").textContent=[d.event.venue,d.event.date].filter(Boolean).join("  ·  ");
    render();
  }catch(e){ document.getElementById("standWrap").innerHTML='<div class="center">Gagal memuat data.</div>'; }
}

tick(); setInterval(tick,1000);
if(EVENT_ID){ load(); setInterval(load,20000); }
else {
  document.getElementById("nowWrap").innerHTML='';
  document.getElementById("standWrap").innerHTML='<div class="center">Tambahkan ?event=EVENT_ID di URL untuk menampilkan board.</div>';
}
</script>
</body>
</html>
