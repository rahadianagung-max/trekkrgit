<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trekkr · TV Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000000; --panel:#121110; --panel2:#171513; --line:#332a24;
    --text:#fdf4ee; --muted:#bfa091; --faint:#856a5d;
    --accent:#ff7a1a; --accent2:#ffab40; --hot:#ff3d2e; --danger:#ff5a4d;
    --grad:linear-gradient(115deg,#ff3d2e 0%,#ff7a18 55%,#ffb347 100%);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:#000; color:var(--text); font-family:'Hanken Grotesk',sans-serif; overflow:hidden;}
  .screen{height:100vh; display:flex; flex-direction:column; padding:2vh 2.2vw;}
  /* top bar */
  .bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; flex:0 0 auto; margin-bottom:1.6vh;}
  .ev{grid-column:2; text-align:center;}
  .ev .nm{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(30px,4.4vw,84px); line-height:1; letter-spacing:-.02em;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .ev .mt{font-family:'Space Mono',monospace; font-size:clamp(11px,1vw,18px); color:var(--muted); margin-top:.8vh; letter-spacing:.08em;}
  .clock{grid-column:3; justify-self:end; text-align:right; font-family:'Space Mono',monospace;}
  .clock .t{font-size:clamp(20px,2.4vw,42px); font-weight:700;}
  .clock .l{font-size:clamp(9px,.8vw,13px); color:var(--accent); letter-spacing:.12em; animation:liveblink 1.4s steps(1,end) infinite;}
  .qr{grid-column:1; justify-self:start; display:flex; align-items:center; gap:.7vw;}
  .qr .qrimg{background:#fff; padding:.5vw; border-radius:10px; line-height:0; box-shadow:0 0 0 1px var(--line);}
  .qr .qrimg img{display:block; width:clamp(72px,6vw,120px); height:clamp(72px,6vw,120px);}
  .qr .qrlabel{font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:.1em;
    font-size:clamp(9px,.78vw,13px); color:var(--accent2); line-height:1.35;}
  /* main split */
  .main{flex:1 1 auto; min-height:0; display:flex; gap:1.6vw;}
  .left{flex:0 0 36%; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
  .right{flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
  .col-title{font-family:'Space Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent2);
    font-size:clamp(11px,1vw,17px); margin:0 0 1vh; flex:0 0 auto;}
  .col-title.up{margin-top:1.4vh;}
  .col-title.live{color:var(--accent); animation:liveblink 1.4s steps(1,end) infinite;}
  .col-title.live::before{content:"\25CF  ";}
  @keyframes liveblink{0%,62%{opacity:1} 63%,100%{opacity:.22}}
  /* avatars */
  .av{ --s:42px; position:relative; width:var(--s); height:var(--s); border-radius:50%; overflow:hidden;
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:linear-gradient(135deg,#3a241b,#1c120c); border:1px solid var(--line);}
  .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .av i{ font-style:normal; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; color:var(--accent2); font-size:calc(var(--s)*.44); }
  /* now playing cards — fill column height */
  #nowWrap{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:1.2vh;}
  .np-card{flex:1 1 0; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:center;
    border:1px solid rgba(255,122,26,.55); border-radius:16px; background:rgba(255,122,26,.05); padding:1.3vh 1.3vw;}
  .np-head{display:flex; align-items:center; gap:.8vw; margin-bottom:1vh; flex:0 0 auto;}
  .np-court{font-family:'Space Mono',monospace; font-weight:700; color:var(--accent); font-size:clamp(13px,1.25vw,22px); letter-spacing:.03em;}
  .np-meta{font-family:'Space Mono',monospace; color:var(--muted); font-size:clamp(10px,.85vw,14px);}
  .np-badge{margin-left:auto; font-family:'Space Mono',monospace; font-size:clamp(10px,.8vw,13px); font-weight:700;
    color:#1a0d06; background:var(--accent); padding:.4vh .8vw; border-radius:7px; letter-spacing:.05em;
    animation:liveblink 1.4s steps(1,end) infinite;}
  .np-teams{display:flex; align-items:center; gap:.6vw; flex:1 1 auto; min-height:0;}
  .tmblk{flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; gap:.7vw;}
  .tmblk .pl{display:flex; align-items:center; gap:.5vw; min-width:0; flex:0 1 50%;}
  .tmblk .plnm{font-weight:600; font-size:var(--nmf,clamp(13px,1.2vw,22px)); line-height:1.12; word-break:break-word;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .np-vs{flex:0 0 auto; align-self:center; font-family:'Space Mono',monospace; color:var(--faint); font-size:clamp(10px,.9vw,15px); letter-spacing:.14em;}
  .np-empty,.up-empty{color:var(--faint); font-family:'Space Mono',monospace; font-size:clamp(13px,1.1vw,18px); padding:2vh 0;}
  /* upcoming rows */
  #nextWrap{flex:0 0 auto; display:flex; flex-direction:column; gap:.7vh;}
  .up-row{display:flex; align-items:center; gap:.9vw; border:1px solid var(--line); border-radius:11px; background:var(--panel); padding:.7vh 1vw;}
  .up-when{display:flex; flex-direction:column; align-items:center; flex:0 0 auto; min-width:4.6vw;}
  .up-court{font-family:'Space Mono',monospace; font-weight:700; color:var(--accent); font-size:clamp(10px,.9vw,15px);}
  .up-time{font-family:'Space Mono',monospace; color:var(--muted); font-size:clamp(10px,.95vw,16px);}
  .up-mid{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:.7vw;}
  .up-side{display:flex; align-items:center; gap:.45vw; min-width:0; flex:1 1 50%;}
  .up-side .av{--s:clamp(22px,1.6vw,34px);}
  .up-nm{font-weight:600; font-size:clamp(11px,1vw,17px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .up-x{font-family:'Space Mono',monospace; color:var(--faint); font-size:clamp(10px,.8vw,13px);}
  /* standings — fill right column */
  #standWrap{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:1.4vh;}
  .cat-block{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
  .cat-head{flex:0 0 auto; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:clamp(16px,1.6vw,28px); display:flex; align-items:baseline; gap:.9vw; flex-wrap:wrap; margin-bottom:1vh;}
  .cat-cap{font-family:'Space Mono',monospace; font-weight:400; font-size:clamp(9px,.82vw,14px); color:var(--muted); letter-spacing:.02em;}
  .grp-grid{flex:1 1 auto; min-height:0; display:grid; gap:1.2vh 1.2vw; grid-auto-rows:1fr;}
  .grp{min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:1.1vh 1.1vw; display:flex; flex-direction:column;}
  .grp-h{flex:0 0 auto; font-family:'Space Mono',monospace; font-weight:700; color:var(--accent); font-size:clamp(12px,1.05vw,18px); letter-spacing:.04em; margin-bottom:.7vh;}
  table.st{flex:1 1 auto; width:100%; height:100%; border-collapse:collapse; table-layout:auto;}
  table.st th{font-family:'Space Mono',monospace; font-weight:400; color:var(--faint); text-transform:uppercase; letter-spacing:.03em;
    font-size:clamp(9px,.78vw,13px); text-align:center; padding:.3vh .4vw; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.st th.nm{text-align:left;}
  table.st td{font-size:clamp(12px,1.05vw,19px); padding:.4vh .4vw; text-align:center; border-bottom:1px solid rgba(60,41,32,.55); white-space:nowrap; vertical-align:middle;}
  table.st td.rk{font-family:'Space Mono',monospace; color:var(--accent2); width:1.8em;}
  table.st td.nm{text-align:left; white-space:normal; line-height:1.16; padding-right:1vw;}
  table.st td.nm .p1{display:block; font-weight:700;}
  table.st td.nm .p2{display:block; font-weight:500; color:var(--muted);}
  table.st tr:last-child td{border-bottom:none;}
  table.st tr.champ td{background:rgba(255,122,26,.12);} table.st tr.champ td.rk{color:var(--accent); font-weight:700;}
  table.st tr.prosp td{background:rgba(255,171,64,.08);} table.st tr.prosp td.rk{color:var(--accent2);}
  table.st tr.top td{background:rgba(255,122,26,.12);} table.st tr.top td.rk{color:var(--accent); font-weight:700;}
  .center{display:flex; align-items:center; justify-content:center; height:100%; color:var(--faint);
    font-family:'Space Mono',monospace; font-size:clamp(14px,1.4vw,22px); text-align:center; padding:2vh;}
  /* footer */
  .footer{flex:0 0 auto; display:flex; justify-content:flex-end; align-items:baseline; gap:.6vw; margin-top:1.2vh;}
  .footer .pwr{font-family:'Space Mono',monospace; font-size:clamp(9px,.8vw,13px); color:var(--faint); letter-spacing:.1em; text-transform:uppercase;}
  .footer .logo-sm{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(14px,1.4vw,24px); letter-spacing:-.01em;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
</style>
</head>
<body>
<div class="screen">
  <div class="bar">
    <div class="qr" id="qrBox" style="display:none">
      <div class="qrimg"><img id="qrImg" alt="QR" /></div>
      <div class="qrlabel">Scan for<br>live mobile view</div>
    </div>
    <div class="ev"><div class="nm" id="evnm">—</div><div class="mt" id="evmt"></div></div>
    <div class="clock"><div class="t" id="clock">--:--</div><div class="l" id="livedot">● LIVE</div></div>
  </div>
  <div class="main">
    <div class="left">
      <div class="col-title live">Now Playing</div>
      <div id="nowWrap"><div class="np-empty">Loading…</div></div>
      <div class="col-title up">Upcoming</div>
      <div id="nextWrap"></div>
    </div>
    <div class="right">
      <div class="col-title">Group Standings</div>
      <div id="standWrap"><div class="center">Loading tournament data…</div></div>
    </div>
  </div>
  <div class="footer"><span class="pwr">powered by</span><span class="logo-sm">TREKKR</span></div>
</div>

<script>
const BASE = location.hostname === "trekkr.online" ? "/api" : "https://trekkr.online/api";
const qs = new URLSearchParams(location.search);
const EVENT_ID = qs.get("event");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { data:null };
const TIER = { MAIN:"Main Bracket", CHAMPION:"Champion", PROSPECT:"Prospect" };

async function api(p){ const r=await fetch(BASE+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function fmtTime(t){ const s=String(t==null?"":t).trim(); if(!s) return ""; const ap=/(am|pm)/i.exec(s); const x=s.replace(/\s*(am|pm)/i,"").trim(); const pp=x.split(/[:.]/); let h=parseInt(pp[0],10), m=parseInt(pp[1],10); if(isNaN(h)) return s; if(isNaN(m)) m=0; if(ap){const pm=/pm/i.test(ap[0]); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0;} h=((h%24)+24)%24; m=((m%60)+60)%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function normName(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }
function tick(){ document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }

function photoOf(name){ const p=state.data.players && state.data.players[normName(name)]; return (p&&p.photo)?p.photo:""; }
function avatar(name,size){ const ph=photoOf(name); const init=(String(name||"?").trim()[0]||"?").toUpperCase();
  return `<span class="av" style="--s:${size}"><i>${esc(init)}</i>${ph?`<img src="${esc(ph)}" alt="" onerror="this.remove()"/>`:""}</span>`; }
function pairPlayers(c, eid){ const e=c.entrants && c.entrants[eid]; if(!e) return [eid||"TBD",""]; return [e.player1||"", e.player2||""]; }

function teamBlock(c, eid, sz){
  const [p1,p2]=pairPlayers(c,eid);
  const chip=(n)=>`<div class="pl">${avatar(n,sz)}<span class="plnm">${esc(n)||"TBD"}</span></div>`;
  return `<div class="tmblk">${chip(p1)}${p2?chip(p2):""}</div>`;
}
function nowCard(f, sz, nmf){
  return `<div class="np-card" style="--nmf:${nmf}">
    <div class="np-head"><span class="np-court">COURT ${esc(f.court)}</span>
      <span class="np-meta">${esc(f.label)}${f.time?` · ${fmtTime(f.time)}`:""}</span>
      <span class="np-badge">LIVE</span></div>
    <div class="np-teams">
      ${teamBlock(f.c,f.eA,sz)}
      <div class="np-vs">VS</div>
      ${teamBlock(f.c,f.eB,sz)}
    </div></div>`;
}
function upRow(f){
  const [a1,a2]=pairPlayers(f.c,f.eA), [b1,b2]=pairPlayers(f.c,f.eB);
  const side=(x,y)=>`<div class="up-side">${avatar(x,"clamp(24px,1.8vw,38px)")}${y?avatar(y,"clamp(24px,1.8vw,38px)"):""}<span class="up-nm">${esc(x)}${y?" & "+esc(y):""}</span></div>`;
  return `<div class="up-row">
    <div class="up-when"><span class="up-court">COURT ${esc(f.court||"?")}</span><span class="up-time">${f.time?fmtTime(f.time):"—"}</span></div>
    <div class="up-mid">${side(a1,a2)}<span class="up-x">vs</span>${side(b1,b2)}</div>
  </div>`;
}

function buildFeed(){
  const d=state.data, feed=[];
  d.categories.forEach(c=>{
    (c.schedule||[]).forEach(m=> feed.push({ key:m.matchId, c, court:m.court, sortKey:(m.slot||0),
      time:m.time, label:`${c.category} · Group ${m.groupLabel}`, eA:m.entrantA, eB:m.entrantB, status:m.status }));
    (c.playoff||[]).forEach(b=> (b.rounds||[]).forEach(r=> (r.matches||[]).forEach(m=>{
      if(m.status==="BYE" || !m.entrantA || !m.entrantB) return;
      feed.push({ key:m.matchId, c, court:m.court, sortKey:100000+(parseInt(m.round)||0)*100+(m.idx||0),
        time:m.time, label:`${c.category} · ${TIER[b.tier]||b.tier}`, eA:m.entrantA, eB:m.entrantB, status:m.status });
    })));
  });
  feed.sort((a,b)=> (a.sortKey-b.sortKey) || ((a.court||0)-(b.court||0)));
  return feed;
}

function colsFor(g){ if(g<=1) return 1; if(g<=3) return g; let c=Math.round(Math.sqrt(g*1.3)); return Math.max(2, Math.min(c, g>8?4:3)); }

function standHtml(){
  const out = state.data.categories.map(c=>{
    if(!c.groups || !c.groups.some(g=>g.standings.length)) return "";
    const N=c.advancersPerGroup||0, split=String(c.format||"").toUpperCase()==="SPLIT";
    const rankNote = "Ranked by: most wins → head-to-head → point difference → points for → points against";
    const advText = split ? `Rank 1${N>1?`–${N}`:""} → Championship Bracket · Rank ${N+1}+ → Prospect Bracket` : (N?`Top ${N} advance`:"");
    const cap = `${advText ? advText + " · " : ""}${rankNote}`;
    const cols = colsFor(c.groups.length);
    const grps=c.groups.map(g=>{
      const denom=Math.max(1,(g.standings.length||1)-1);
      const rows=g.standings.map(s=>{
        const cls= split?(s.rank<=N?"champ":"prosp"):(N&&s.rank<=N?"top":"");
        const pa = (s.ga!=null) ? s.ga : (Number(s.gf||0)-Number(s.gd||0));
        const [p1,p2]=pairPlayers(c,s.entrantId);
        const pair = `<span class="p1">${esc(p1)||esc(s.team)}</span>${p2?`<span class="p2">${esc(p2)}</span>`:""}`;
        return `<tr class="${cls}"><td class="rk">${s.rank}</td><td class="nm">${pair}</td>
          <td>${s.played}/${denom}</td><td>${s.wins}</td><td>${s.losses}</td>
          <td>${s.gd>0?"+":""}${s.gd}</td><td>${s.gf}</td><td>${pa}</td></tr>`;
      }).join("");
      return `<div class="grp"><div class="grp-h">Group ${esc(g.label)}</div>
        <table class="st"><thead><tr><th>#</th><th class="nm">Pair</th><th>Played</th><th>Win</th><th>Lose</th><th>PD</th><th>PF</th><th>PA</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }).join("");
    return `<div class="cat-block"><div class="cat-head">${esc(c.category)}${cap?`<span class="cat-cap">${cap}</span>`:""}</div>
      <div class="grp-grid" style="grid-template-columns:repeat(${cols},1fr)">${grps}</div></div>`;
  }).join("");
  return out || '<div class="center">No standings yet — enter group scores first.</div>';
}

function render(){
  if(!state.data) return;
  const feed=buildFeed();
  const perCourt={};
  feed.forEach(f=>{ if(f.status!=="DONE" && f.court){ (perCourt[f.court]=perCourt[f.court]||[]).push(f); } });
  const courts=Object.keys(perCourt).sort((a,b)=>a-b);
  const playing=courts.map(ct=>perCourt[ct][0]).filter(Boolean);
  const upcoming=courts.map(ct=>perCourt[ct][1]).filter(Boolean);  // next match per court

  const ac=playing.length||1;
  let sz,nmf;
  if(ac>=4){ sz="clamp(20px,1.5vw,30px)"; nmf="clamp(11px,.95vw,17px)"; }
  else if(ac===3){ sz="clamp(26px,2vw,42px)"; nmf="clamp(12px,1.1vw,20px)"; }
  else if(ac===2){ sz="clamp(34px,2.7vw,58px)"; nmf="clamp(13px,1.3vw,24px)"; }
  else { sz="clamp(44px,3.8vw,88px)"; nmf="clamp(16px,1.7vw,31px)"; }

  document.getElementById("nowWrap").innerHTML = playing.length ? playing.map(f=>nowCard(f,sz,nmf)).join("") : '<div class="np-empty">No match in progress.</div>';
  document.getElementById("nextWrap").innerHTML = upcoming.length ? upcoming.map(upRow).join("") : '<div class="up-empty">No upcoming match.</div>';
  document.getElementById("standWrap").innerHTML = standHtml();
}

async function load(){
  try{
    const d=await api("/tournament/event/"+encodeURIComponent(EVENT_ID)+"/public");
    state.data=d;
    document.getElementById("evnm").textContent=d.event.name||"Tournament";
    document.getElementById("evmt").textContent=[d.event.venue,d.event.date].filter(Boolean).join("  ·  ");
    render();
  }catch(e){ document.getElementById("standWrap").innerHTML='<div class="center">Failed to load data.</div>'; }
}

function mobileURL(){
  let path = location.pathname;
  if(/tournament-tv/i.test(path)) path = path.replace(/tournament-tv/i, "tournament-mobile");
  else path = path.replace(/[^/]*$/, "tournament-mobile.html");
  return location.origin + path + "?event=" + encodeURIComponent(EVENT_ID);
}
function setupQR(){
  if(!EVENT_ID) return;
  const url = mobileURL();
  const img = document.getElementById("qrImg");
  img.onerror = ()=>{ document.getElementById("qrBox").style.display="none"; };
  img.src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&qzone=1&data=" + encodeURIComponent(url);
  document.getElementById("qrBox").style.display = "flex";
}

tick(); setInterval(tick,1000);
if(EVENT_ID){ setupQR(); load(); setInterval(load,20000); }
else {
  document.getElementById("nowWrap").innerHTML='';
  document.getElementById("standWrap").innerHTML='<div class="center">Add ?event=EVENT_ID to the URL to display the board.</div>';
}
</script>
</body>
</html>
