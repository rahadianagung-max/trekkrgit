<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trekkr · Turnamen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0c0f0d; --panel:#131815; --panel2:#171d1a; --line:#28312c;
    --text:#e9f0ec; --muted:#8a968f; --faint:#5d655f;
    --accent:#c8f24e; --accent2:#7fe0a8; --press:#b2e02f;
    --danger:#ff6f60; --warn:#ffd166;
    --r:14px; --r-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Hanken Grotesk',sans-serif;
    padding:0 0 40px; max-width:640px; margin:0 auto; min-height:100vh;}
  a{color:inherit; text-decoration:none;}
  .wrap{padding:0 14px;}
  header{padding:18px 14px 12px; position:sticky; top:0; background:linear-gradient(180deg,var(--bg) 70%,transparent);
    z-index:20;}
  .brand{display:flex; align-items:center; justify-content:space-between;}
  .logo{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:22px; letter-spacing:-.02em;}
  .logo span{color:var(--accent);}
  .live{font-family:'Space Mono',monospace; font-size:10px; color:var(--faint); letter-spacing:.08em; text-align:right;}
  .live b{color:var(--accent2);}
  .evname{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; margin-top:10px;}
  .evmeta{font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); margin-top:3px;}
  /* tabs */
  .tabs{display:flex; gap:7px; overflow-x:auto; padding:10px 14px 4px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--panel);
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .tab.on{background:var(--accent); color:var(--bg); border-color:var(--accent);}
  .subtabs{display:flex; gap:0; margin:14px 0 4px; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--panel);}
  .subtab{flex:1; text-align:center; padding:8px 0; border-radius:999px; font-size:12.5px; font-weight:600;
    color:var(--muted); cursor:pointer;}
  .subtab.on{background:var(--panel2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line);}
  /* avatars + names */
  .av{width:22px; height:22px; border-radius:50%; object-fit:cover; background:var(--panel2); flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:9px;
    color:var(--accent2); border:1px solid var(--line); overflow:hidden;}
  .pl{color:var(--text); border-bottom:1px dotted var(--faint);}
  /* schedule */
  .court-sec{margin-top:16px;}
  .court-sec h3{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent2); margin:0 0 8px;}
  .mrow{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel); padding:10px 12px; margin-bottom:7px;}
  .mrow.live-now{border-color:rgba(200,242,78,.5); background:rgba(200,242,78,.05);}
  .mrow.done{opacity:.82;}
  .mrow .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .mrow .time{font-family:'Space Mono',monospace; font-size:12px; color:var(--muted);}
  .mrow .gl{font-family:'Space Mono',monospace; font-size:10px; color:var(--faint);}
  .mrow .badge-now{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.06em; color:var(--bg);
    background:var(--accent); padding:2px 6px; border-radius:5px;}
  .team{display:flex; align-items:center; gap:7px; padding:3px 0; font-size:13.5px;}
  .team .nm{display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .team.w .nm{color:var(--accent); font-weight:700;}
  .team .sc{margin-left:auto; font-family:'Space Mono',monospace; font-size:15px;}
  /* standings */
  .stable{width:100%; border-collapse:collapse; font-size:13px; margin:12px 0 18px;}
  .stable caption{text-align:left; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px;
    padding-bottom:8px; caption-side:top;}
  .stable caption span{font-family:'Space Mono',monospace; font-size:10px; color:var(--accent2); margin-left:7px;}
  .stable th{font-size:9.5px; color:var(--faint); font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:.05em; text-align:center; padding-bottom:6px;}
  .stable th.l{text-align:left;}
  .stable td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .stable .rk{font-family:'Space Mono',monospace; color:var(--accent2); width:24px; text-align:center;}
  .stable .nmcell{display:flex; align-items:center; gap:6px;}
  .stable .num-c{font-family:'Space Mono',monospace; text-align:center; width:30px; color:var(--muted);}
  .stable tr.top td{background:rgba(200,242,78,.06);}
  .stable tr.top .rk{color:var(--accent);}
  /* bracket */
  .tier{margin-top:14px;}
  .tier > h3{font-family:'Bricolage Grotesque',sans-serif; font-size:16px; margin:0 0 9px; display:flex; gap:8px; align-items:center;}
  .tier > h3 .tg{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--bg); background:var(--accent2); padding:3px 7px; border-radius:5px;}
  .podium{display:flex; gap:8px; margin-bottom:14px;}
  .pod{flex:1; border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 10px; background:var(--panel);}
  .pod .rk{font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
  .pod .who{font-weight:700; font-size:12.5px; margin-top:4px; line-height:1.25;}
  .pod.g{border-color:rgba(200,242,78,.5); background:rgba(200,242,78,.07);} .pod.g .rk{color:var(--accent);}
  .pod.s .rk{color:#cdd6d0;} .pod.b .rk{color:var(--warn);}
  .pround{margin-bottom:12px;}
  .pround h4{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint); margin:0 0 7px; border-bottom:1px solid var(--line); padding-bottom:5px;}
  .pmatch{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel); padding:9px 11px; margin-bottom:6px;}
  .pmatch.bye{opacity:.5;}
  .pline{display:flex; align-items:center; gap:6px; padding:2px 0; font-size:13px;}
  .pline.w{color:var(--accent); font-weight:700;}
  .pline .sc{margin-left:auto; font-family:'Space Mono',monospace;}
  .pline .tbd{color:var(--faint); font-style:italic;}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:34px 10px;}
  .picker a{display:block; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel);
    padding:14px 16px; margin-bottom:9px;}
  .picker .pn{font-weight:700; font-size:15px;} .picker .pm{font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); margin-top:3px;}
  footer{text-align:center; font-family:'Space Mono',monospace; font-size:10px; color:var(--faint); margin-top:24px; letter-spacing:.06em;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">Trekk<span>r</span></div>
    <div class="live" id="live"></div>
  </div>
  <div id="evhead"></div>
</header>
<div id="cattabs" class="tabs"></div>
<div class="wrap">
  <div id="subtabs"></div>
  <div id="body"><p class="empty">Memuat…</p></div>
</div>
<footer>TREKKR.ONLINE · PADEL RATING INDONESIA</footer>

<script>
const BASE = location.hostname === "trekkr.online" ? "/api" : "https://trekkr.online/api";
const PASSPORT = "https://trekkr.online/player/";
const qs = new URLSearchParams(location.search);
const EVENT_ID = qs.get("event");
const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { data:null, cat:0, view:"jadwal" };

async function api(path){ const r = await fetch(BASE+path); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

function initials(name){ const p=String(name||"").trim().split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
function avatar(name){
  const pl = state.data && state.data.players[norm(name)];
  if(pl && pl.photo) return `<span class="av"><img src="${esc(pl.photo)}" style="width:100%;height:100%;object-fit:cover" alt=""/></span>`;
  return `<span class="av">${esc(initials(name).toUpperCase())}</span>`;
}
function plink(name){ if(!name) return ""; return `<a class="pl" href="${PASSPORT}${encodeURIComponent(name)}">${esc(name)}</a>`; }
function teamNames(cat, entrantId, withAv){
  const e = cat.entrants[entrantId];
  if(!e) return entrantId ? esc(entrantId) : '<span class="tbd">TBD</span>';
  const a = (withAv?avatar(e.player1):"")+plink(e.player1);
  const b = (withAv?avatar(e.player2):"")+plink(e.player2);
  return `${a} <span style="color:var(--faint)">+</span> ${b}`;
}

function roundLabel(round, numRounds){
  if(String(round)==="BRONZE") return "Perebutan Juara 3";
  const r=parseInt(round), f=numRounds-r;
  return f===0?"Final":f===1?"Semifinal":f===2?"Perempat Final":f===3?"Babak 16 Besar":"Babak "+r;
}

function renderTabs(){
  const cats = state.data.categories;
  document.getElementById("cattabs").innerHTML = cats.map((c,i)=>
    `<div class="tab ${i===state.cat?'on':''}" onclick="setCat(${i})">${esc(c.category)}</div>`).join("");
  document.getElementById("subtabs").innerHTML = `<div class="subtabs">
    ${["jadwal","klasemen","bracket"].map(v=>`<div class="subtab ${v===state.view?'on':''}" onclick="setView('${v}')">${({jadwal:"Jadwal",klasemen:"Klasemen",bracket:"Bracket"})[v]}</div>`).join("")}
  </div>`;
}
function setCat(i){ state.cat=i; renderTabs(); renderBody(); }
function setView(v){ state.view=v; renderTabs(); renderBody(); }

function renderBody(){
  const cat = state.data.categories[state.cat];
  const el = document.getElementById("body");
  if(!cat){ el.innerHTML='<p class="empty">Belum ada kategori.</p>'; return; }
  if(state.view==="jadwal") el.innerHTML = renderJadwal(cat);
  else if(state.view==="klasemen") el.innerHTML = renderKlasemen(cat);
  else el.innerHTML = renderBracket(cat);
}

function renderJadwal(cat){
  if(!cat.schedule.length) return '<p class="empty">Jadwal babak grup belum dibuat.</p>';
  const courts = {};
  cat.schedule.forEach(m=>{ (courts[m.court]=courts[m.court]||[]).push(m); });
  return Object.keys(courts).sort((a,b)=>a-b).map(ct=>{
    const list = courts[ct].sort((a,b)=>a.slot-b.slot);
    const playingId = (list.find(m=>m.status!=="DONE")||{}).matchId;
    const rows = list.map(m=>{
      const done = m.status==="DONE";
      const aw = done && String(m.winner)===String(m.entrantA);
      const bw = done && String(m.winner)===String(m.entrantB);
      const liveNow = m.matchId===playingId && !done;
      return `<div class="mrow ${done?'done':''} ${liveNow?'live-now':''}">
        <div class="top"><span class="time">${esc(m.time||"")}</span>
          ${liveNow?'<span class="badge-now">MAIN</span>':`<span class="gl">Grup ${esc(m.groupLabel)}</span>`}</div>
        <div class="team ${aw?'w':''}"><span class="nm">${teamNames(cat,m.entrantA,false)}</span><span class="sc">${done?esc(String(m.scoreA)):"–"}</span></div>
        <div class="team ${bw?'w':''}"><span class="nm">${teamNames(cat,m.entrantB,false)}</span><span class="sc">${done?esc(String(m.scoreB)):"–"}</span></div>
      </div>`;
    }).join("");
    return `<div class="court-sec"><h3>Lapangan ${ct}</h3>${rows}</div>`;
  }).join("");
}

function renderKlasemen(cat){
  const any = cat.groups.some(g=>g.standings.some(s=>s.played>0));
  if(!cat.groups.length) return '<p class="empty">Grup belum diundi.</p>';
  if(!any) return '<p class="empty">Belum ada hasil pertandingan.</p>';
  const adv = cat.advancersPerGroup||0;
  return cat.groups.map(g=>{
    const rows = g.standings.map(s=>`<tr class="${adv&&s.rank<=adv?'top':''}">
      <td class="rk">${s.rank}</td>
      <td><span class="nmcell">${avatar((cat.entrants[s.entrantId]||{}).player1)}${teamNames(cat,s.entrantId,false)}</span></td>
      <td class="num-c">${s.played}</td><td class="num-c">${s.wins}</td><td class="num-c">${s.losses}</td>
      <td class="num-c">${s.gd>0?'+':''}${s.gd}</td><td class="num-c">${s.gf}</td></tr>`).join("");
    return `<table class="stable"><caption>Grup ${esc(g.label)}${adv?`<span>top ${adv} lolos</span>`:''}</caption>
      <thead><tr><th>#</th><th class="l">Pasangan</th><th>M</th><th>W</th><th>K</th><th>+/−</th><th>GF</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }).join("");
}

const TIER = { MAIN:"Bracket Utama", CHAMPION:"Champion", PROSPECT:"Prospect" };
function renderBracket(cat){
  if(!cat.playoff.length) return '<p class="empty">Bracket playoff belum dibuat.</p>';
  return cat.playoff.map(b=>{
    const pod = (b.podium.champion||b.podium.runnerUp||b.podium.third) ? `<div class="podium">
      <div class="pod g"><div class="rk">🏆 Juara 1</div><div class="who">${esc(b.podium.champion)||"—"}</div></div>
      <div class="pod s"><div class="rk">Juara 2</div><div class="who">${esc(b.podium.runnerUp)||"—"}</div></div>
      <div class="pod b"><div class="rk">Juara 3</div><div class="who">${esc(b.podium.third)||"—"}</div></div></div>` : "";
    const rounds = b.rounds.map(r=>`<div class="pround"><h4>${roundLabel(r.round,b.numRounds)}</h4>${r.matches.map(m=>pmatch(cat,m)).join("")}</div>`).join("");
    const bronze = b.bronze ? `<div class="pround"><h4>${roundLabel("BRONZE",b.numRounds)}</h4>${pmatch(cat,b.bronze)}</div>`:"";
    return `<div class="tier"><h3><span class="tg">${TIER[b.tier]||b.tier}</span> ${b.nQual} tim</h3>${pod}${rounds}${bronze}</div>`;
  }).join("");
}
function pmatch(cat,m){
  const bye = m.status==="BYE", done = m.status==="DONE";
  const aw = done && String(m.winner)===String(m.entrantA);
  const bw = done && String(m.winner)===String(m.entrantB);
  const nameA = m.entrantA ? teamNames(cat,m.entrantA,false) : '<span class="tbd">TBD</span>';
  const nameB = m.entrantB ? teamNames(cat,m.entrantB,false) : '<span class="tbd">TBD</span>';
  const scA = done?esc(String(m.scoreA)):""; const scB = done?esc(String(m.scoreB)):"";
  return `<div class="pmatch ${bye?'bye':''}">
    <div class="pline ${aw?'w':''}">${nameA}<span class="sc">${bye?'BYE':scA}</span></div>
    <div class="pline ${bw?'w':''}">${nameB}<span class="sc">${scB}</span></div></div>`;
}

function toMin(t){ if(!t||t.indexOf(":")<0) return null; const [h,m]=t.split(":").map(Number); return h*60+m; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

async function load(){
  try{
    const d = await api("/tournament/event/"+encodeURIComponent(EVENT_ID)+"/public");
    state.data = d;
    document.getElementById("evhead").innerHTML =
      `<div class="evname">${esc(d.event.name||"Turnamen")}</div>
       <div class="evmeta">${esc([d.event.venue,d.event.date].filter(Boolean).join(" · "))}</div>`;
    document.getElementById("live").innerHTML = `<b>● LIVE</b><br>diperbarui ${new Date().toLocaleTimeString("id-ID")}`;
    if(state.cat >= d.categories.length) state.cat = 0;
    renderTabs(); renderBody();
  }catch(e){ document.getElementById("body").innerHTML = '<p class="empty">Gagal memuat data.</p>'; }
}

async function pickEvent(){
  try{
    const { events } = await api("/tournament/events");
    const list = (events||[]).slice().reverse();
    document.getElementById("body").innerHTML = list.length ? `<div class="picker">${list.map(e=>
      `<a href="?event=${encodeURIComponent(e.eventId)}"><div class="pn">${esc(e.name)}</div><div class="pm">${esc([e.venue,e.date].filter(Boolean).join(" · "))}</div></a>`).join("")}</div>`
      : '<p class="empty">Belum ada event.</p>';
  }catch(e){ document.getElementById("body").innerHTML='<p class="empty">Gagal memuat event.</p>'; }
}

if(EVENT_ID){ load(); setInterval(load, 30000); }
else { document.getElementById("evhead").innerHTML='<div class="evname">Pilih Event</div>'; pickEvent(); }
</script>
</body>
</html>
