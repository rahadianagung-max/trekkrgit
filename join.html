<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gabung / Klaim Profil — Trekkr</title>
<meta name="description" content="Daftar sebagai pemain baru di Trekkr, atau klaim profil yang sudah ada untuk mengelola sendiri."/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--or:#FF6A00;--ink:#16161A;--mu:#6B6B72;--bd:#E6E6EA;--bg:#F7F7F8;--card:#fff;--grn:#16A34A;--red:#DC2626;--grad:linear-gradient(90deg,#FF3830,#FFB000)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:26px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.brand b{color:var(--or)}
.back{font-size:13px;color:var(--mu);text-decoration:none}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:14px;margin:0 0 20px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin:0 0 5px}
.field{margin-bottom:14px}
.opt{text-transform:none;font-weight:500;color:var(--mu)}
input,select{width:100%;padding:12px 13px;border:1px solid var(--bd);border-radius:11px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--or)}
.btn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--grad);color:#fff;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{background:none;border:none;color:var(--or);font:inherit;font-weight:700;cursor:pointer;padding:0;font-size:13.5px;text-decoration:none}
.hint{font-size:12.5px;margin-top:7px;min-height:16px}
.hint.ok{color:var(--grn)}.hint.busy{color:var(--mu)}.hint.err{color:var(--red)}
.msg{padding:11px 13px;border-radius:10px;font-size:13.5px;font-weight:600;margin:14px 0 0;display:none}
.msg.ok{display:block;background:#eafaf0;border:1px solid #bfe9cf;color:var(--grn)}
.msg.err{display:block;background:#fdecec;border:1px solid #f6c9c9;color:var(--red)}
.banner{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:16px}
.banner.claim{background:rgba(255,106,0,.08);border:1px solid rgba(255,106,0,.35);color:#9a4d00}
.banner.new{background:#eef7f1;border:1px solid #cfe9d9;color:#166534}
/* Seed placement question (SEED ONLY — bukan tier resmi) */
.seed{background:#FFF8F3;border:1px solid rgba(255,106,0,.28);border-radius:14px;padding:15px 14px 13px;margin-bottom:14px}
.seed .q{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin:0 0 2px}
.seed .cap{font-size:11.5px;color:var(--mu);line-height:1.5;margin:0 0 11px}
.opts{display:flex;flex-direction:column;gap:8px}
.optcard{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s}
.optcard:hover{border-color:rgba(255,106,0,.28)}
.optcard .dot{width:18px;height:18px;border-radius:50%;border:2px solid #CFCFD6;flex:0 0 auto;margin-top:1px;position:relative;transition:border-color .12s}
.optcard .tt{font-size:13.5px;font-weight:700;line-height:1.3}
.optcard .dd{font-size:11.5px;color:var(--mu);line-height:1.45;margin-top:2px}
.optcard.sel{border-color:var(--or)}
.optcard.sel .dot{border-color:var(--or)}
.optcard.sel .dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--or)}
.seedfoot{font-size:11px;color:var(--mu);line-height:1.5;margin:11px 2px 0;display:flex;gap:6px}
.seedfoot svg{flex:0 0 auto;margin-top:1px}
.photo{display:flex;align-items:center;gap:14px}
.photo .pv{width:62px;height:62px;border-radius:14px;object-fit:cover;background:#EFEFF1;display:flex;align-items:center;justify-content:center;color:#B7B2AD;font-size:22px;flex:0 0 auto}
.note{font-size:11px;color:var(--mu);margin-top:5px}
.btn.ghost.sm{width:auto;padding:9px 14px;font-size:12.5px;background:#fff;color:var(--ink);border:1px solid var(--bd);font-weight:700}
.row2{display:flex;gap:10px}.row2>div{flex:1;min-width:0}
.foot{text-align:center;font-size:13.5px;color:var(--mu);line-height:1.6;margin-top:4px}
.center{text-align:center}
.hidden{display:none}
.done .ic{width:56px;height:56px;border-radius:50%;background:rgba(34,160,82,.12);color:#15803D;display:flex;align-items:center;justify-content:center;font-size:30px;margin:2px auto 14px}
.done h2{font-size:22px;margin:0 0 10px}
.done p{font-size:14px;color:var(--mu);line-height:1.65;margin:0 0 12px}
.done .box{text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
</style>
<link rel="stylesheet" href="/theme-kit.css"/>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="https://trekkr.online/" aria-label="Trekkr"><img src="/trekkr-logo.png" alt="Trekkr" style="height:26px;width:auto;display:block"></a>
    <a class="back" href="https://trekkr.online/">&larr; Beranda</a>
  </div>
  <div id="app"></div>
</div>

<script src="/trekkr-auth.js"></script>
<script>
const SUPA_URL="https://ftkbankqixnwssfrbqyc.supabase.co";
const API=(location.hostname==="trekkr.online"||(location.hostname.endsWith(".vercel.app")&&location.hostname.startsWith("trekkrgit")))?"/api":"https://trekkr.online/api";
const HOME=(location.hostname==="trekkr.online"||location.hostname.endsWith(".vercel.app"))?"":"https://trekkr.online";
const $=(id)=>document.getElementById(id); const app=()=>$("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function slug(n){return String(n||"").toLowerCase().replace(/[^a-z0-9]+/g,"");}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||""));}
async function apiSend(path,method,body){const r=await fetch(`${API}/${path}`,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));return {ok:r.ok,status:r.status,d};}

let _photoData="";           // base64 for new-player photo
let _mode="";                // "new" | "claim"
let _existingName="";        // canonical name when claiming
let _seed="";                // seed placement estimate (SEED ONLY — bukan tier/ELO resmi)
let _autoClaim="";           // claim to submit automatically after the sign-in redirect
let _me=null;                // account/me for a signed-in visitor (null = not signed in)
const PK="trekkr_join_pending"; // new-player form kept across the sign-in redirect

async function authToken(){ try{ return await TrekkrAuth.token(); }catch(e){ return ""; } }
async function loadMe(){
  const t=await authToken(); if(!t) return null;
  try{ const r=await fetch(`${API}/account/me?token=${encodeURIComponent(t)}`); if(!r.ok){ if(r.status===401) TrekkrAuth.clear(); return null; } return await r.json(); }catch(e){ return null; }
}
function savePending(o){ try{ localStorage.setItem(PK, JSON.stringify(o)); }catch(e){ try{ delete o.photo; localStorage.setItem(PK, JSON.stringify(o)); }catch(e2){} } }
function takePending(){ try{ const v=JSON.parse(localStorage.getItem(PK)||"null"); localStorage.removeItem(PK); return v; }catch(e){ return null; } }

// ---------- ENTRY (name check) ----------
function viewEntry(prefill){
  _mode=""; _photoData=""; _existingName=""; _seed="";
  const who=_me&&_me.email?`<div class="banner new" style="margin-bottom:14px">Masuk sebagai <b>${esc(_me.email)}</b> · <button class="link" id="soBtn" style="padding:0">Keluar</button></div>`:"";
  app().innerHTML=`
    <h1>Gabung ke Trekkr</h1>
    <p class="sub">Masukkan nama kamu. Kami cek dulu apakah kamu sudah ada di Trekkr — kalau sudah, kamu tinggal <b>klaim</b> profilnya; kalau belum, kamu bisa <b>daftar baru</b>.</p>
    ${who}
    <div class="card">
      <div class="field">
        <label>Nama lengkap</label>
        <input id="name" placeholder="cth. Budi Santoso" autocomplete="name" value="${esc(prefill||"")}"/>
        <div class="hint" id="nameHint"></div>
      </div>
      <div id="dyn"></div>
    </div>
    <div class="foot">Sudah punya akun? <a class="link" href="${HOME}/login">Masuk di sini &rarr;</a></div>`;
  $("name").addEventListener("input",scheduleCheck);
  const so=$("soBtn"); if(so) so.onclick=()=>{TrekkrAuth.clear();_me=null;viewEntry(($("name").value||"").trim());};
  if(prefill){ scheduleCheck(); }
}

let _chkTimer=null,_last="";
function scheduleCheck(){
  clearTimeout(_chkTimer);
  $("dyn").innerHTML=""; _mode="";
  const n=($("name").value||"").trim();
  if(n.length<2){ setHint("",""); return; }
  setHint("Mengecek nama…","busy");
  _chkTimer=setTimeout(()=>doCheck(n),450);
}
function setHint(t,k){const h=$("nameHint");h.textContent=t||"";h.className="hint"+(k?(" "+k):"");}
function doCheck(n){
  _last=n;
  fetch(API+"/players/check-name?name="+encodeURIComponent(n))
    .then(r=>r.json()).then(d=>{
      if(($("name").value||"").trim()!==_last) return; // stale
      if(d&&d.exists){ setHint("",""); renderClaim(d.name||n); }
      else { setHint("✓ Nama ini belum ada di Trekkr — daftar sebagai pemain baru.","ok"); renderNew(); }
    }).catch(()=>setHint("Gagal cek nama, coba lagi.","err"));
}

// Sign-in box shown inline when a visitor must sign in to finish.
function renderAuth(el, next, onDone){
  TrekkrAuth.renderBox(el,{
    title:"",
    sub:"Langkah terakhir: masuk tanpa password — pakai Google atau link/kode dari email.",
    next, onDone,
  });
}

// ---------- CLAIM (name already exists) ----------
function renderClaim(name){
  _mode="claim"; _existingName=name;
  if(_me&&_me.player){
    $("dyn").innerHTML=`<div class="banner claim">Akunmu sudah terhubung ke profil <b>${esc(_me.player.name)}</b>. <a class="link" href="${HOME}/player/${slug(_me.player.name)}">Buka profilmu &rarr;</a></div>`;
    return;
  }
  $("dyn").innerHTML=`
    <div class="banner claim"><b>"${esc(name)}"</b> sudah ada di Trekkr. Klaim profil ini untuk mengelolanya — riwayat pertandingan &amp; ELO-mu tetap. Klaim ditinjau admin dulu.</div>
    <div id="cAuth"></div>
    <button class="btn" id="cGo" ${_me?"":"hidden"}>Ajukan klaim</button>
    <div class="msg" id="cMsg"></div>`;
  if(_me){ $("cGo").onclick=submitClaim; if(_autoClaim && _autoClaim.toLowerCase()===String(name).toLowerCase()){ _autoClaim=""; submitClaim(); } }
  else renderAuth($("cAuth"), `/join?name=${encodeURIComponent(name)}&act=claim`, async()=>{ _me=await loadMe(); submitClaim(); });
}
async function submitClaim(){
  const m=$("cMsg"), b=$("cGo");
  if(b){ b.hidden=false; b.disabled=true; b.textContent="Mengirim…"; }
  m.className="msg";
  const t=await authToken();
  if(!t){ m.className="msg err"; m.textContent="Sesi berakhir — silakan masuk lagi."; if(b){b.disabled=false;b.textContent="Ajukan klaim";} return; }
  const {ok,d}=await apiSend("account/claim-session","POST",{token:t,player_name:_existingName});
  if(ok){ viewDoneClaim(_existingName); }
  else { m.className="msg err"; m.textContent=(d&&d.error)||"Gagal mengajukan klaim."; if(b){b.disabled=false; b.textContent="Ajukan klaim";} }
}

// ---------- NEW PLAYER ----------
function renderNew(){
  _mode="new";
  if(_me&&_me.player){
    $("dyn").innerHTML=`<div class="banner claim">Akunmu sudah terhubung ke profil <b>${esc(_me.player.name)}</b>. <a class="link" href="${HOME}/player/${slug(_me.player.name)}">Buka profilmu &rarr;</a></div>`;
    return;
  }
  $("dyn").innerHTML=`
    <div class="banner new">Nama belum terdaftar — buat profil baru. Rating resmimu terbentuk otomatis dari hasil main, bukan dari isian ini.</div>
    <div class="row2">
      <div class="field"><label>Gender</label><select id="nGender"><option value="M">Male</option><option value="F">Female</option></select></div>
      <div class="field"><label>Region / Kota <span class="opt">(opsional)</span></label><input id="nRegion" placeholder="cth. Jakarta" autocomplete="off"/></div>
    </div>
    <div class="seed">
      <p class="q">Pengalaman padel kamu? <span class="opt">(opsional)</span></p>
      <p class="cap">Cuma buat nyocokin lawan main di sesi-sesi pertama biar seru. Bukan penentu tier.</p>
      <div class="opts" id="nSeed">
        <div class="optcard" data-seed="900"><span class="dot"></span><div><div class="tt">Baru mulai / masih belajar</div><div class="dd">Belum lama kenal padel, masih cari feeling.</div></div></div>
        <div class="optcard" data-seed="1000"><span class="dot"></span><div><div class="tt">Main santai, rutin</div><div class="dd">Sering main bareng teman, belum pernah turnamen.</div></div></div>
        <div class="optcard" data-seed="1500"><span class="dot"></span><div><div class="tt">Kompetitif / pernah turnamen</div><div class="dd">Udah pernah ikut turnamen atau liga.</div></div></div>
        <div class="optcard" data-seed=""><span class="dot"></span><div><div class="tt">Nggak yakin</div><div class="dd">Biar host yang nilai pas main pertama.</div></div></div>
      </div>
      <div class="seedfoot">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6B72" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/></svg>
        <span>Tier resmimu (T1/T2/T3) ditentukan dari hasil main setelah kalibrasi, bukan dari jawaban ini.</span>
      </div>
    </div>
    <div class="field"><label>Instagram <span class="opt">(opsional)</span></label><input id="nIg" placeholder="username tanpa @" autocomplete="off"/></div>
    <div class="field"><label>Foto <span class="opt">(opsional)</span></label>
      <div class="photo">
        <img id="nPhotoPrev" class="pv" alt="" style="display:none">
        <span class="pv" id="nPhotoPh">👤</span>
        <div>
          <label class="btn ghost sm" style="cursor:pointer;display:inline-block">Unggah foto<input type="file" id="nPhoto" accept="image/*" style="display:none"></label>
          <div class="note">Foto wajah — dikecilkan otomatis.</div>
        </div>
      </div>
    </div>
    <button class="btn" id="nGo">${_me?"Daftar":"Lanjut"}</button>
    <div id="nAuth" style="margin-top:14px"></div>
    <div class="msg" id="nMsg"></div>`;
  $("nPhoto").addEventListener("change",onPhoto);
  $("nSeed").addEventListener("click",function(e){
    const c=e.target.closest(".optcard"); if(!c) return;
    this.querySelectorAll(".optcard").forEach(o=>o.classList.remove("sel"));
    c.classList.add("sel"); _seed=c.getAttribute("data-seed")||"";
  });
  $("nGo").onclick=submitNew;
}
function onPhoto(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const m=$("nMsg");
  if(!/^image\//.test(f.type)){ m.className="msg err"; m.textContent="File harus berupa gambar."; return; }
  const r=new FileReader();
  r.onload=function(){
    const im=new Image();
    im.onload=function(){
      const M=512,s=Math.min(1,M/Math.max(im.width,im.height));
      const w=Math.round(im.width*s),h=Math.round(im.height*s);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      _photoData=cv.toDataURL("image/jpeg",0.85);
      const pv=$("nPhotoPrev");pv.src=_photoData;pv.style.display="";$("nPhotoPh").style.display="none";
    };
    im.src=r.result;
  };
  r.readAsDataURL(f); e.target.value="";
}
function newBody(){
  const body={name:($("name").value||"").trim(),gender:($("nGender").value||"M"),region:($("nRegion").value||"").trim(),ig:($("nIg").value||"").trim().replace(/^@+/,"")};
  if(_photoData) body.photo=_photoData;
  if(_seed) body.seedEstimate=_seed;   // SEED ONLY — dipakai buat matchmaking awal, bukan tier/ELO resmi
  return body;
}
async function submitNew(){
  const body=newBody(), m=$("nMsg");
  if(body.name.length<2){ m.className="msg err"; m.textContent="Masukkan nama lengkap."; return; }
  if(!_me){
    // Keep the form, sign in, then finish (here via code, or on return via link).
    savePending(body);
    $("nGo").hidden=true;
    renderAuth($("nAuth"), "/join?act=new", async()=>{ _me=await loadMe(); const p=takePending()||body; registerNew(p); });
    return;
  }
  registerNew(body);
}
async function registerNew(body){
  const m=$("nMsg"), b=$("nGo");
  if(b){ b.hidden=false; b.disabled=true; b.textContent="Mendaftar…"; }
  m.className="msg";
  const t=await authToken();
  if(!t){ m.className="msg err"; m.textContent="Sesi berakhir — silakan masuk lagi."; if(b){b.disabled=false;b.textContent="Daftar";} return; }
  const {ok,d}=await apiSend("account/register-session","POST",Object.assign({token:t},body));
  if(ok){ viewDoneNew((d&&d.name)||body.name); }
  else if(d&&d.claim){ m.className="msg"; renderClaim(body.name); }  // race: name got taken → offer claim
  else { m.className="msg err"; m.textContent=(d&&d.error)||"Gagal mendaftar."; if(b){b.disabled=false; b.textContent="Daftar";} }
}

// ---------- DONE ----------
function viewDoneNew(name){
  window.scrollTo(0,0);
  app().innerHTML=`
    <div class="card done center">
      <div class="ic">✓</div>
      <h2>Profil kamu sudah jadi</h2>
      <p>Selamat datang di Trekkr, <b>${esc(name)}</b>! Profilmu langsung aktif dan terhubung ke akunmu.</p>
      <div class="box">Mainlah di <b>venue atau komunitas mitra Trekkr</b> supaya pertandinganmu tercatat dan rating-mu mulai terbentuk.</div>
      <p style="margin-top:18px"><a class="btn" href="${HOME}/player/${slug(name)}" style="display:inline-block;text-decoration:none">Lihat profilku &rarr;</a></p>
    </div>`;
}
function viewDoneClaim(name){
  window.scrollTo(0,0);
  app().innerHTML=`
    <div class="card done center">
      <div class="ic">⏳</div>
      <h2>Klaim diajukan</h2>
      <p>Permintaan klaim profil <b>${esc(name)}</b> sudah kami terima dan sedang ditinjau admin.</p>
      <div class="box">Begitu disetujui, kamu akan menerima <b>email konfirmasi</b>. Sementara itu kamu sudah masuk — analitik lengkap di semua profil sudah terbuka untukmu.</div>
      <p style="margin-top:18px"><a class="link" href="${HOME}/player/${slug(name)}">Lihat profil ${esc(name)} &rarr;</a></p>
    </div>`;
}

// ---------- init ----------
(async function init(){
  const q=new URLSearchParams(location.search);
  const preName=q.get("name")||"", act=q.get("act")||"";
  app().innerHTML='<div class="card center" style="padding:30px">Memuat…</div>';
  _me=await loadMe();
  // Returning from a sign-in redirect → finish what the player started.
  if(_me && act==="new"){
    const p=takePending();
    try{ history.replaceState(null,"",location.pathname); }catch(e){}
    if(p&&p.name){ viewEntry(p.name); _mode="new"; $("dyn").innerHTML='<div class="msg" id="nMsg"></div>'; return registerNew(p); }
  }
  if(_me && act==="claim" && preName && !_me.player){
    try{ history.replaceState(null,"",location.pathname+"?name="+encodeURIComponent(preName)); }catch(e){}
    _autoClaim=preName; viewEntry(preName); return;   // name check → renderClaim submits it
  }
  viewEntry(preName);
})();
</script>
</body>
</html>
