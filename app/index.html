<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<title>Trekkr Player</title>
<meta name="description" content="Passport, ranking & event padel kamu — ELO Trekkr."/>
<link rel="manifest" href="/app/manifest.webmanifest"/>
<meta name="theme-color" content="#FF6A00"/>
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Trekkr"/>
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png"/>
<link rel="icon" href="/app/icons/favicon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/app/app.css"/>
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <!-- Supabase JS (UMD → window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/app/api.js"></script>
  <script src="/app/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" }).catch(function(){});
      });
    }
  </script>
</body>
</html>
