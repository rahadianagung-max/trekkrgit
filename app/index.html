<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<title>Trekkr Player</title>
<meta name="description" content="Your padel passport, ranking & events — Trekkr ELO."/>
<link rel="manifest" href="/app/manifest.webmanifest"/>
<meta name="theme-color" content="#090D14"/>
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Trekkr"/>
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png"/>
<link rel="icon" href="/app/icons/favicon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/app/app.css"/>
<style>
  /* Launch splash — painted instantly, removed by app.js once auth resolves. */
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;text-align:center;
    background-color:#090D14;color:#fff;
    background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:24px 24px;
    font-family:'Space Grotesk',system-ui,sans-serif;
    padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    transition:opacity .45s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .sp-mark{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-style:italic;font-weight:900;
    font-size:60px;letter-spacing:-.04em;line-height:1;text-transform:uppercase;
    animation:sp-pop .6s cubic-bezier(.2,.9,.3,1.3) both}
  #splash .sp-mark i{font-style:normal;background:#FF5900;color:#fff;font-size:.62em;padding:0 8px;margin-left:6px;vertical-align:.12em}
  #splash .sp-name{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800;font-size:12px;text-transform:uppercase;
    letter-spacing:.24em;color:#090D14;background:#D2F802;padding:5px 10px;margin-top:16px}
  #splash .sp-tag{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:500;
    font-size:13px;opacity:.75;margin-top:12px;animation:sp-fade .8s .25s both}
  @keyframes sp-pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes sp-fade{from{opacity:0}to{opacity:.75}}
</style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-mark">Trekkr<i>//</i></div>
    <div class="sp-name">Trekkr Player</div>
    <div class="sp-tag">Every match builds your journey</div>
  </div>
  <div id="app" aria-live="polite"></div>

  <!-- Supabase JS (UMD → window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/app/api.js"></script>
  <script src="/app/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" }).catch(function(){});
      });
    }
  </script>
</body>
</html>
