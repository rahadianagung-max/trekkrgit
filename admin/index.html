<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trekkr — Venue Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#070709; --s1:#0f0f14; --s2:#16161f; --s3:#1e1e2a; --border:#252535; --border2:#32324a; --lime:#d4f53c; --lime2:#aacb2a; --coral:#ff5757; --text:#eeeef5; --muted:#5a5a7a; --muted2:#7a7a9a; }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; min-height:100vh; }
.wrap { max-width:680px; margin:0 auto; padding:20px 20px 80px; position:relative; z-index:1; }

.page-title { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:4px; color:var(--lime); margin-bottom:6px; }
.page-sub { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:2px; margin-bottom:24px; }

/* Login */
.login-card { background:var(--s1); border:1px solid var(--border2); border-radius:12px; padding:32px; max-width:380px; margin:60px auto; }
.login-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:4px; color:var(--lime); margin-bottom:20px; text-align:center; }

/* Form */
.field { margin-bottom:14px; }
.field-label { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; display:block; }
.field-input,.field-select,.field-textarea {
  width:100%; background:var(--s3); border:1px solid var(--border2); border-radius:8px;
  padding:10px 14px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text); outline:none; transition:border-color 0.2s;
}
.field-input:focus,.field-select:focus,.field-textarea:focus { border-color:var(--lime); }
.field-input::placeholder,.field-textarea::placeholder { color:var(--muted); }
.field-select { appearance:none; cursor:pointer; }
.field-textarea { min-height:60px; resize:vertical; }

.btn { padding:10px 22px; border-radius:8px; border:none; cursor:pointer; font-family:'Syne',sans-serif; font-weight:700; font-size:13px; transition:all 0.15s; }
.btn-primary { background:var(--lime); color:var(--bg); }
.btn-primary:hover { background:var(--lime2); }
.btn-ghost { background:transparent; border:1px solid var(--border2); color:var(--muted2); font-size:12px; }
.btn-ghost:hover { border-color:var(--lime); color:var(--lime); }
.btn-danger { background:var(--coral); color:#fff; }
.btn-sm { padding:6px 14px; font-size:11px; }
.btn-full { width:100%; }

/* Sections */
.section { background:var(--s1); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:16px; }
.section-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px; color:var(--text); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.section-title .dot { width:6px; height:6px; border-radius:50%; background:var(--lime); }

/* Match entry */
.match-entry { background:var(--s2); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px; }
.match-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.match-num { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--lime); letter-spacing:2px; }

.team-row { display:grid; grid-template-columns:1fr 1fr 60px; gap:8px; align-items:end; margin-bottom:8px; }
.team-label { font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--muted); letter-spacing:1px; margin-bottom:4px; }

.vs-row { text-align:center; font-family:'Bebas Neue',sans-serif; font-size:14px; color:var(--muted); margin:6px 0; letter-spacing:4px; }

.gender-toggle { display:flex; gap:0; }
.gender-opt {
  padding:6px 12px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px;
  border:1px solid var(--border); background:var(--s3); color:var(--muted); cursor:pointer; transition:all 0.15s;
}
.gender-opt:first-child { border-radius:4px 0 0 4px; }
.gender-opt:last-child { border-radius:0 4px 4px 0; }
.gender-opt.active { background:rgba(212,245,60,0.1); border-color:rgba(212,245,60,0.3); color:var(--lime); }

/* Status */
.status-msg {
  padding:10px 14px; border-radius:8px; margin-top:12px;
  font-family:'JetBrains Mono',monospace; font-size:11px; display:none;
}
.status-msg.success { display:block; background:rgba(212,245,60,0.08); border:1px solid rgba(212,245,60,0.3); color:var(--lime); }
.status-msg.error { display:block; background:rgba(255,87,87,0.08); border:1px solid rgba(255,87,87,0.3); color:var(--coral); }

.logout-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.logout-bar .user-info { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted2); }

footer { border-top:1px solid var(--border); padding-top:24px; margin-top:40px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:2px; }
footer span { color:var(--lime); }
</style>
</head>
<body>

<div class="wrap">
  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-title">VENUE ADMIN</div>
      <div class="field">
        <label class="field-label">Username</label>
        <input class="field-input" id="loginUser" type="text" placeholder="admin">
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <input class="field-input" id="loginPass" type="password" placeholder="••••••">
      </div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">Login →</button>
      <div class="status-msg" id="loginStatus"></div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminScreen" style="display:none">
    <div class="page-title">VENUE ADMIN</div>
    <div class="page-sub" id="adminVenueLabel">MANAGING: —</div>

    <div class="logout-bar">
      <span class="user-info" id="userLabel">—</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
    </div>

    <!-- URL Parse -->
    <div class="section">
      <div class="section-title"><span class="dot"></span>IMPORT FROM URL</div>
      <div class="field">
        <label class="field-label">Americano / Skorapp URL</label>
        <input class="field-input" id="parseUrl" type="text" placeholder="https://americano-padel.com/r/...">
      </div>
      <button class="btn btn-primary" onclick="parseUrl()">Parse & Import →</button>
      <div class="status-msg" id="parseStatus"></div>
    </div>

    <!-- Manual Match Entry -->
    <div class="section">
      <div class="section-title"><span class="dot"></span>MANUAL MATCH ENTRY</div>
      <div id="matchEntries"></div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn btn-ghost btn-sm" onclick="addMatchEntry()">+ Add Match</button>
        <button class="btn btn-primary" onclick="submitMatches()">Submit All Matches →</button>
      </div>
      <div class="status-msg" id="matchStatus"></div>
    </div>

    <!-- Edit Venue -->
    <div class="section">
      <div class="section-title"><span class="dot"></span>EDIT VENUE INFO</div>
      <div class="field">
        <label class="field-label">Schedule</label>
        <textarea class="field-textarea" id="venueSchedule" placeholder="Every Monday 8am-10am&#10;Every Friday 4pm-6pm"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Prize Pool</label>
        <input class="field-input" id="venuePrize" placeholder="IDR 2.5 Million">
      </div>
      <div class="field">
        <label class="field-label">Contact</label>
        <input class="field-input" id="venueContact" placeholder="@instagram or phone">
      </div>
      <button class="btn btn-primary" onclick="updateVenueInfo()">Save Changes →</button>
      <div class="status-msg" id="venueStatus"></div>
    </div>
  </div>

  <footer>TREKKR · <span>VENUE ADMIN</span> · © 2026</footer>
</div>

<script src="/trekkr-api.js"></script>
<script>
let matchCount = 0;
let adminVenue = '';

// ── Auth ──
function checkAuth() {
  const session = TrekkrAPI.getSession();
  if (session.token && (session.role === 'venue_admin' || session.role === 'superadmin')) {
    adminVenue = session.venue;
    showDashboard(session);
  }
}

async function doLogin() {
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  const status = document.getElementById('loginStatus');

  try {
    const data = await TrekkrAPI.login(user, pass);
    if (data.role !== 'venue_admin' && data.role !== 'superadmin') {
      status.className = 'status-msg error';
      status.textContent = 'Access denied — not a venue admin';
      return;
    }
    adminVenue = data.venue;
    showDashboard(data);
  } catch (err) {
    status.className = 'status-msg error';
    status.textContent = err.message || 'Login failed';
  }
}

function showDashboard(session) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  document.getElementById('adminVenueLabel').textContent = `MANAGING: ${adminVenue || 'ALL'}`;
  document.getElementById('userLabel').textContent = `Logged in as ${session.username || ''}`;

  // Add first match entry
  addMatchEntry();

  // Load venue info
  loadVenueInfo();
}

function doLogout() {
  TrekkrAPI.logout();
  location.reload();
}

// ── URL Parse ──
async function parseUrl() {
  const url = document.getElementById('parseUrl').value;
  const status = document.getElementById('parseStatus');

  if (!url) {
    status.className = 'status-msg error';
    status.textContent = 'Please enter a URL';
    return;
  }

  status.className = 'status-msg success';
  status.textContent = 'Parsing... (this feature will connect to americano-padel.com scraper)';

  // In production: call a parse endpoint that scrapes the URL
  // For now, show placeholder
  setTimeout(() => {
    status.textContent = '✓ URL parsing requires backend scraper — use manual entry for now';
  }, 1500);
}

// ── Manual Match Entry ──
function addMatchEntry() {
  matchCount++;
  const container = document.getElementById('matchEntries');

  const entry = document.createElement('div');
  entry.className = 'match-entry';
  entry.id = `match-${matchCount}`;
  entry.innerHTML = `
    <div class="match-header">
      <span class="match-num">MATCH #${matchCount}</span>
      <div class="gender-toggle">
        <div class="gender-opt active" data-g="M" onclick="setMatchGender(${matchCount}, 'M', this)">MEN</div>
        <div class="gender-opt" data-g="F" onclick="setMatchGender(${matchCount}, 'F', this)">WOMEN</div>
        <div class="gender-opt" data-g="X" onclick="setMatchGender(${matchCount}, 'X', this)">MIXED</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="removeMatch(${matchCount})" style="margin-left:8px">✕</button>
    </div>
    <input type="hidden" id="match-${matchCount}-gender" value="M">

    <div class="team-label">TEAM 1</div>
    <div class="team-row">
      <input class="field-input" id="match-${matchCount}-p1t1" placeholder="Player 1 name">
      <input class="field-input" id="match-${matchCount}-p2t1" placeholder="Player 2 name">
      <input class="field-input" id="match-${matchCount}-s1" type="number" placeholder="Score" min="0">
    </div>

    <div class="vs-row">VS</div>

    <div class="team-label">TEAM 2</div>
    <div class="team-row">
      <input class="field-input" id="match-${matchCount}-p1t2" placeholder="Player 1 name">
      <input class="field-input" id="match-${matchCount}-p2t2" placeholder="Player 2 name">
      <input class="field-input" id="match-${matchCount}-s2" type="number" placeholder="Score" min="0">
    </div>
  `;

  container.appendChild(entry);
}

function setMatchGender(id, gender, el) {
  document.getElementById(`match-${id}-gender`).value = gender;
  const parent = el.parentElement;
  parent.querySelectorAll('.gender-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
}

function removeMatch(id) {
  const el = document.getElementById(`match-${id}`);
  if (el) el.remove();
}

async function submitMatches() {
  const status = document.getElementById('matchStatus');
  const entries = document.querySelectorAll('.match-entry');
  const matches = [];

  entries.forEach(entry => {
    const id = entry.id.replace('match-', '');
    const p1t1 = document.getElementById(`match-${id}-p1t1`)?.value.trim();
    const p2t1 = document.getElementById(`match-${id}-p2t1`)?.value.trim();
    const p1t2 = document.getElementById(`match-${id}-p1t2`)?.value.trim();
    const p2t2 = document.getElementById(`match-${id}-p2t2`)?.value.trim();
    const s1 = parseInt(document.getElementById(`match-${id}-s1`)?.value) || 0;
    const s2 = parseInt(document.getElementById(`match-${id}-s2`)?.value) || 0;
    const gender = document.getElementById(`match-${id}-gender`)?.value || 'M';

    if (p1t1 && p2t1 && p1t2 && p2t2) {
      matches.push({ p1t1, p2t1, p1t2, p2t2, scoreT1: s1, scoreT2: s2, gender });
    }
  });

  if (matches.length === 0) {
    status.className = 'status-msg error';
    status.textContent = 'No valid matches to submit. Fill in all player names.';
    return;
  }

  if (!adminVenue) {
    status.className = 'status-msg error';
    status.textContent = 'No venue assigned to this admin account';
    return;
  }

  try {
    const result = await TrekkrAPI.addVenueMatch(adminVenue, matches);
    status.className = 'status-msg success';
    status.textContent = `✓ ${result.added} matches submitted! ${result.newPlayers?.length ? `New players created: ${result.newPlayers.join(', ')}` : ''}`;

    // Clear entries
    document.getElementById('matchEntries').innerHTML = '';
    matchCount = 0;
    addMatchEntry();
  } catch (err) {
    status.className = 'status-msg error';
    status.textContent = err.message || 'Failed to submit matches';
  }
}

// ── Venue Info ──
async function loadVenueInfo() {
  if (!adminVenue) return;
  try {
    const data = await TrekkrAPI.getVenues();
    const v = data.venues.find(x => x.name.toLowerCase() === adminVenue.toLowerCase());
    if (v) {
      document.getElementById('venueSchedule').value = v.schedule || '';
      document.getElementById('venuePrize').value = v.prizePool || '';
      document.getElementById('venueContact').value = v.contact || '';
    }
  } catch (err) {
    console.warn('Could not load venue info');
  }
}

async function updateVenueInfo() {
  const status = document.getElementById('venueStatus');
  if (!adminVenue) {
    status.className = 'status-msg error';
    status.textContent = 'No venue assigned';
    return;
  }

  try {
    await TrekkrAPI.updateVenue(adminVenue, {
      schedule: document.getElementById('venueSchedule').value,
      prizePool: document.getElementById('venuePrize').value,
      contact: document.getElementById('venueContact').value,
    });
    status.className = 'status-msg success';
    status.textContent = '✓ Venue info updated';
  } catch (err) {
    status.className = 'status-msg error';
    status.textContent = err.message || 'Failed to update';
  }
}

window.addEventListener('load', checkAuth);
</script>
</body>
</html>
