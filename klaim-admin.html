<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Persetujuan Klaim Profil — Trekkr Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--or:#FF6A00;--ink:#16161A;--mu:#6B6B72;--bd:#E6E6EA;--bg:#F7F7F8;--grn:#16A34A;--red:#DC2626;--grad:linear-gradient(90deg,#FF3830,#FFB000)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:26px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;font-size:20px}.brand b{color:var(--or)}
h1{font-size:24px;margin:10px 0 4px}.sub{color:var(--mu);font-size:14px;margin:0 0 20px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin:0 0 5px}
.field{margin-bottom:13px}
input{width:100%;padding:12px 13px;border:1px solid var(--bd);border-radius:11px;font:inherit;font-size:15px}
input:focus{outline:none;border-color:var(--or)}
.btn{padding:11px 16px;border:none;border-radius:10px;background:var(--grad);color:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.btn.full{width:100%;padding:13px}
.btn.gr{background:var(--grn)}.btn.rd{background:var(--red)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--bd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:none;color:var(--or);font:inherit;font-weight:700;cursor:pointer;font-size:13.5px}
.claim{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.claim .who b{font-weight:800}.claim .who span{color:var(--mu);font-size:12.5px;display:block;margin-top:2px}
.acts{display:flex;gap:8px;flex-shrink:0}
.msg{padding:11px 13px;border-radius:10px;font-size:13.5px;font-weight:600;margin-bottom:14px;display:none}
.msg.ok{display:block;background:#eafaf0;border:1px solid #bfe9cf;color:var(--grn)}
.msg.err{display:block;background:#fdecec;border:1px solid #f6c9c9;color:var(--red)}
.empty{text-align:center;color:var(--mu);padding:26px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Trekk<b>r</b> · Admin</div><button class="link hidden" id="logout">Keluar</button></div>
  <div id="msg" class="msg"></div>
  <div id="app"></div>
</div>
<script src="trekkr-api.js"></script>
<script>
const $=(id)=>document.getElementById(id); const app=()=>$("app");
const API=(location.hostname==="trekkr.online"||location.hostname.endsWith(".vercel.app"))?"/api":"https://trekkr.online/api";
function msg(t,k){const m=$("msg");if(!t){m.className="msg";return;}m.textContent=t;m.className="msg "+(k||"err");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function apiGet(p){const r=await fetch(`${API}/${p}`);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d;}
async function apiSend(p,m,b){const r=await fetch(`${API}/${p}`,{method:m,headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d;}

function viewLogin(){
  $("logout").classList.add("hidden");
  app().innerHTML=`<h1>Masuk Admin</h1><p class="sub">Login dengan akun admin/superadmin untuk menyetujui klaim profil.</p>
    <div class="card"><div class="field"><label>Username</label><input id="u" autocomplete="username"/></div>
    <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"/></div>
    <button class="btn full" id="go">Masuk</button></div>`;
  $("go").onclick=async()=>{
    const b=$("go");b.disabled=true;b.textContent="Memproses…";
    try{ const d=await TrekkrAPI.login($("u").value.trim(),$("p").value); if(!d.token) throw new Error("Login gagal"); msg(""); load(); }
    catch(e){ msg("Gagal masuk: "+e.message); b.disabled=false;b.textContent="Masuk"; }
  };
}
async function load(){
  const s=TrekkrAPI.getSession();
  if(!s.token) return viewLogin();
  $("logout").classList.remove("hidden");
  app().innerHTML=`<h1>Klaim Profil</h1><p class="sub">Permintaan pemain untuk mengelola profilnya sendiri. Setujui hanya jika yakin orangnya benar.</p><div id="list" class="card"><div class="empty">Memuat…</div></div>`;
  try{
    const d=await apiGet("account/claims?status=pending");
    const cl=d.claims||[]; const el=$("list");
    if(!cl.length){ el.innerHTML='<div class="empty">🎉 Tidak ada klaim yang menunggu.</div>'; return; }
    el.classList.remove("card"); el.innerHTML=cl.map(c=>`
      <div class="claim" data-id="${c.id}">
        <div class="who"><b>${esc(c.player_name)}</b><span>${esc(c.email)} · ${esc((c.created_at||"").slice(0,10))}</span></div>
        <div class="acts"><button class="btn gr" data-a="approve">Setujui</button><button class="btn rd" data-a="reject">Tolak</button></div>
      </div>`).join("");
    el.querySelectorAll(".claim").forEach(row=>{
      row.querySelectorAll("button").forEach(btn=>btn.onclick=()=>resolve(row.getAttribute("data-id"),btn.getAttribute("data-a"),row));
    });
  }catch(e){ $("list").innerHTML=`<div class="empty" style="color:var(--red)">Gagal memuat: ${esc(e.message)}</div>`; }
}
async function resolve(id,action,row){
  const admin=(TrekkrAPI.getSession().username)||"admin";
  row.querySelectorAll("button").forEach(b=>b.disabled=true);
  try{ await apiSend("account/claims/resolve","POST",{claimId:parseInt(id),action,admin});
    msg(action==="approve"?"Klaim disetujui ✓":"Klaim ditolak","ok"); row.remove();
    if(!$("list").querySelector(".claim")) load();
  }catch(e){ msg("Gagal: "+e.message); row.querySelectorAll("button").forEach(b=>b.disabled=false); }
}
$("logout").onclick=()=>{ TrekkrAPI.logout(); msg(""); viewLogin(); };
load();
</script>
</body>
</html>
